<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Concorrentes</title>
<link rel="icon" href="../icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Concorrentes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root { --bg:#f3f5f9; --card:#fff; --ink:#14213d; --muted:#667489; --line:#e3e8f0; --blue:#1d5fbf; --blue-soft:#e3edfb;
  --green:#2f7d3a; --green-soft:#e6f4ea; --red:#c0392b; --red-soft:#fdeaea; --amber:#b7791f; --amber-soft:#fff4dc; --violet:#6a4bb8; --violet-soft:#efeafb; --shadow:0 1px 3px rgba(20,33,61,.08); }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1420; --card:#162031; --ink:#e8edf6; --muted:#95a3ba; --line:#25314a; --blue:#6aa2ec; --blue-soft:#1b2c47;
  --green:#5fbf6e; --green-soft:#16301d; --red:#ef7b6e; --red-soft:#3a1c1a; --amber:#e8b04a; --amber-soft:#38290e; --violet:#b59cf0; --violet-soft:#2a2342; --shadow:none; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
.top-row { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; }
.sync { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
.sync.ok { background: var(--green-soft); color: var(--green); } .sync.err { background: var(--red-soft); color: var(--red); } .sync.run { background: var(--amber-soft); color: var(--amber); }
.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs button { display: inline-flex; gap: 6px; align-items: center; border: 0; background: none; padding: 8px 12px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--blue); border-bottom-color: var(--blue); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; } .btn.sm { min-height: 30px; padding: 3px 10px; font-size: 12.5px; }
.btn.danger { color: var(--red); }
.input { width: 100%; min-height: 40px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
textarea.input { min-height: 80px; resize: vertical; }
main { padding: 14px 16px 60px; }
.search { position: relative; margin-bottom: 10px; } .search .input { padding-left: 38px; min-height: 44px; font-size: 15px; } .search svg { position: absolute; left: 12px; top: 13px; color: var(--muted); width: 18px; height: 18px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 7px 13px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); font-weight: 700; font-size: 13px; cursor: pointer; }
.chip b { font-size: 11.5px; color: var(--muted); } .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; } .chip.on b { color: #fff; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 700; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--blue-soft); color: var(--blue); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 700; } .kpi .v { font-size: 21px; font-weight: 800; } .kpi .s { font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.cd { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cd:hover { border-color: var(--blue); }
.cd .nm { font-weight: 800; font-size: 14.5px; line-height: 1.3; } .ct { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tg { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: var(--line); color: var(--ink); }
.tg.mm { background: var(--violet-soft); color: var(--violet); }
.tg.warn { background: var(--amber-soft); color: var(--amber); } .tg.bad { background: var(--red-soft); color: var(--red); } .tg.ok { background: var(--green-soft); color: var(--green); } .tg.blue { background: var(--blue-soft); color: var(--blue); }
.big { font-size: 24px; font-weight: 800; line-height: 1.1; } .lb { font-size: 12px; color: var(--muted); font-weight: 600; }
.bar { height: 9px; border-radius: 5px; background: var(--line); position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--green); }
.bar > s { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--red); }
.bar > u { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--blue); }
.foot { margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.foot .row { align-items: center; } .foot svg { color: var(--muted); }
.down { color: var(--green); font-weight: 800; } .neg { color: var(--red); font-weight: 800; }
.leg { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.leg span { display: inline-flex; align-items: center; gap: 5px; } .leg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cmp { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(4, minmax(0, .8fr)) minmax(0, 1.5fr); gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cmp[data-ver] { cursor: pointer; } .cmp:last-child { border-bottom: 0; } .cmp .h { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.cmp .n { text-align: right; font-variant-numeric: tabular-nums; } .cmp.head { padding-top: 0; }
.verd { font-size: 12.5px; font-weight: 700; }
.emp { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.emp .cd { cursor: default; }
.ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.ic svg { width: 20px; height: 20px; } .ic.fab { background: var(--violet-soft); color: var(--violet); } .ic.dist { background: var(--blue-soft); color: var(--blue); } .ic.loja { background: var(--amber-soft); color: var(--amber); }
.how { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px 8px; font-size: 13px; } .how svg { margin-top: 2px; color: var(--muted); }
.lic { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); } .lic:last-child { border-bottom: 0; } .lic p { margin: 0; flex: 1; }
.empty { text-align: center; color: var(--muted); padding: 30px; }
.dlg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg-box { background: var(--card); border-radius: 18px; width: min(860px, 100%); max-height: 94vh; overflow: auto; padding: 18px; }
.dlg-box h3 { margin: 0 0 4px; }
.fg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.fg .f { display: flex; flex-direction: column; gap: 4px; } .fg .f label { font-size: 12px; font-weight: 700; color: var(--muted); }
.fg .w2 { grid-column: span 2; } .fg .w4 { grid-column: 1 / -1; }
.acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; } .acts .sp { margin-right: auto; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; margin: 12px 0; } .kv dt { color: var(--muted); font-weight: 700; } .kv dd { margin: 0; }
.note { background: var(--amber-soft); border-radius: 10px; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; }
.login { max-width: 400px; margin: 40px auto; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; } .tools .sp { margin-left: auto; }
@media (max-width: 899px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 699px) {
  main { padding: 10px 10px 60px; } .top { padding-left: 10px; padding-right: 10px; }
  .tabs button span { display: none; } .tabs button { padding: 8px 10px; } .tabs button.on span { display: inline; }
  .grid, .emp { grid-template-columns: 1fr; }
  .kpi .v { font-size: 18px; }
  .cmp { grid-template-columns: repeat(4, minmax(0, 1fr)); } .cmp .d, .cmp .verd { grid-column: 1 / -1; } .cmp.head { display: none; }
  .cmp .n { text-align: left; } .cmp .n::before { content: attr(data-l); display: block; font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
  .fg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kv { grid-template-columns: 110px minmax(0, 1fr); }
  .tools .sp { margin-left: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row"><h1>Concorrentes</h1><span id="sync" class="sync">Conectando…</span><button class="btn sm" id="btnConta" hidden>Sair</button></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>
<div id="dlg"></div>
<script>
'use strict';
/* =====================================================================
 * Concorrentes — o que os vencedores vendem, por quanto, de onde compram,
 * marca/modelo e como montam proposta e catálogo; e o comparativo com os
 * pregões do João (lidos da nuvem do Meus Pregões, só leitura).
 * NENHUM dado no repositório: o app só abre com login; os dados entram por
 * "Dados › Importar JSON" e ficam no aparelho e no Firestore
 * (concorrentes_dados/{uid}), registro a registro por updatedAt, lápide deleted.
 * Importação não repete: item = pregão + nº do item + empresa; arquivo = md5.
 * ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v) => v == null || v === '' || isNaN(v) ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = (v) => v == null || !isFinite(v) ? '—' : Math.round(v * 100) + '%';
const num = (v) => { if (v === '' || v == null) return null; if (typeof v === 'number') return v; const n = Number(String(v).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? null : n; };
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const SVG = { search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  fab: '<path d="M3 21V10l6 4V10l6 4V6l6 4v11z"/><path d="M3 21h18"/>', dist: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  loja: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h11.2L21 8H6.2"/>', vit: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  cmp: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>', doc: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/>', bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  db: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  alert: '<path d="M12 3 2 21h20z"/><path d="M12 10v4M12 17.5v.5"/>', cat: '<path d="M6 3h9l5 5v13H6z"/><path d="M9 12h6M9 16h6"/>', trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M5 5H3v2a3 3 0 0 0 3 3M19 5h2v2a3 3 0 0 1-3 3M10 17h4M9 21h6M12 13v4"/>' };
const ic = (k) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${SVG[k] || ''}</svg>`;
const COLS = ['itens', 'empresas', 'pregoes', 'licoes', 'arquivos'];
const vazio = () => ({ itens: {}, empresas: {}, pregoes: {}, licoes: {}, arquivos: {}, at: 0 });
const LS = 'cc.over.v1', LSUI = 'cc.ui.v2';
let OVER = Object.assign(vazio(), ld(LS));
let UI = Object.assign({ tab: 'vitrine', cat: '', q: '', ord: 'real', cmpF: 'todos' }, ld(LSUI));
let MEUS = null;   // dados do Meus Pregões (só leitura): { pregoes, itens, fonte }
function ld(k) { try { return JSON.parse(localStorage.getItem(k) || 'null') || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(LS, JSON.stringify(OVER)); } catch (e) { /* cheio */ } }
function saveUI() { try { localStorage.setItem(LSUI, JSON.stringify({ tab: UI.tab, cat: UI.cat, ord: UI.ord, cmpF: UI.cmpF })); } catch (e) { /* */ } }
const lista = (col) => Object.entries(OVER[col] || {}).map(([id, r]) => Object.assign({}, r, { id })).filter((r) => !r.deleted);
const get = (col, id) => { const r = (OVER[col] || {})[id]; return r && !r.deleted ? Object.assign({}, r, { id }) : null; };
function gravar(col, id, dados) { OVER[col][id] = Object.assign({}, OVER[col][id] || {}, dados, { id, updatedAt: Date.now() }); OVER.at = Date.now(); save(); MEU_IDX = null; VENC_IDX = null; render(); Nuvem.agendar(); }
const novoId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- chaves para cruzar pregões/itens e evitar repetição ---------- */
const nItem = (lote, item) => { const t = /\d/.test(String(lote || '')) ? lote : item; const m = String(t || '').match(/(\d+)(?!.*\d)/); return m ? String(parseInt(m[1], 10)) : norm(t); };
const chavePz = (cidade, numero) => { const c = norm(String(cidade || '').split('/')[0]); const m = String(numero || '').match(/(\d+)/); return c + '|' + (m ? parseInt(m[1], 10) : ''); };
const chavePzBase = (p) => p ? chavePz(p.cidade, p.numero) : '';
const chaveItem = (it, pzs) => { const p = (pzs && pzs[it.pregao]) || get('pregoes', it.pregao); return chavePzBase(p) + '|' + nItem('', it.item) + '|' + norm(it.empresa); };

/* ---------- cálculos ---------- */
const precoReal = (it) => it.final != null ? it.final : (it.fase === 'readequada' ? it.preco : null);
// vencedor do item já conhecido (seu app registrou ou outra proposta final do mesmo pregão/item), para propostas iniciais
let VENC_IDX = null;
function vencDoItem(it) {
  if (!VENC_IDX) { VENC_IDX = new Map(); lista('itens').forEach((c) => { const v = precoReal(c); if (v == null) return; const k = chavePzBase(get('pregoes', c.pregao)) + '|' + nItem('', c.item); if (!VENC_IDX.has(k) || v < VENC_IDX.get(k)) VENC_IDX.set(k, v); }); }
  const m = meuDo(it), mv = m ? num(m.vencedor) : null;
  return mv || VENC_IDX.get(chavePzBase(get('pregoes', it.pregao)) + '|' + nItem('', it.item)) || null;
}
const precoVenc = (it) => precoReal(it) != null ? precoReal(it) : vencDoItem(it);
const precoMostra = (it) => precoVenc(it) != null ? precoVenc(it) : it.preco;
const tetoDe = (it) => it.teto != null ? it.teto : (num((meuDo(it) || {}).teto) || null);
const desc = (it) => { const t = tetoDe(it), p = precoVenc(it); return t && p != null ? 1 - p / t : null; };
const pzNome = (id) => { const p = get('pregoes', id); return p ? String(p.cidade || '').split('/')[0] + ' ' + String(p.numero || '').replace(/^PE\s*/i, '') : '—'; };
const empNome = (id) => { const e = get('empresas', id); return e ? String(e.nome || '').replace(/ Ltda.*| \(.*$/i, '') : '—'; };
const ondeCompra = (it) => { const e = get('empresas', it.empresa) || {}; return it.onde || e.onde || e.perfil || ''; };
const tipoDe = (txt) => { const t = norm(txt); return /fabric|industria/.test(t) ? 'fab' : /loja|marketplace|revenda de brinq|online/.test(t) ? 'loja' : 'dist'; };
const tipoCompra = (it) => tipoDe(it.onde || (get('empresas', it.empresa) || {}).perfil);
const alerta = (it) => { const o = norm(it.obs); if (/abaixo d[oa] (minimo|espec|edital)|abaixo da espec|200 lumens|200 ansi|9 folhas/.test(o)) return ['bad', 'Abaixo do edital']; if (/sem (selo )?inmetro/.test(o)) return ['warn', 'Sem Inmetro']; if (/anvisa/.test(o)) return ['warn', 'Exige ANVISA']; if (/abaixo do custo|abaixo do varejo/.test(o)) return ['blue', 'Mais barato que o varejo']; if (/inconsist|diverg/.test(o)) return ['warn', 'Divergência']; return null; };

/* ---------- meus dados (Meus Pregões) ---------- */
let MEU_IDX = null;
function indexarMeus() {
  MEU_IDX = new Map();
  if (!MEUS) return;
  const pz = new Map(MEUS.pregoes.filter((p) => !p.deleted).map((p) => [p.id, p]));
  MEUS.itens.filter((i) => !i.deleted).forEach((i) => { const p = pz.get(i.pregaoId); if (!p) return; const k = chavePz(p.cidadeUf || p.orgao, p.numero) + '|' + nItem(i.loteEdital, i.itemEdital); if (!MEU_IDX.has(k)) MEU_IDX.set(k, Object.assign({}, i, { _p: p })); });
}
function meuDo(it) { if (!MEU_IDX) indexarMeus(); return MEU_IDX.get(chavePzBase(get('pregoes', it.pregao)) + '|' + nItem('', it.item)) || null; }
const resultado = (m) => m.ganhou === true ? 'venci' : m.ganhou === false ? 'perdi' : (m.colocacao ? 'perdi' : 'aguard');
const resTxt = (m) => resultado(m) === 'venci' ? 'Venci' : m.colocacao ? m.colocacao + 'º' : resultado(m) === 'perdi' ? 'Perdi' : 'Aguardando';

/* ---------- telas ---------- */
const TABS = [['vitrine', 'Vitrine', 'vit'], ['comparativo', 'Meu comparativo', 'cmp'], ['como', 'Proposta e catálogo', 'doc'], ['licoes', 'Lições', 'bulb'], ['dados', 'Dados', 'db']];
function render() {
  if (!Nuvem.liberado()) { $('#tabs').innerHTML = ''; $('#app').innerHTML = telaLogin(); return; }
  $('#tabs').innerHTML = TABS.map(([k, l, i]) => `<button data-tab="${k}" class="${UI.tab === k ? 'on' : ''}">${ic(i)}<span>${l}</span></button>`).join('');
  const f = { vitrine: telaVitrine, comparativo: telaComparativo, como: telaComo, licoes: telaLicoes, dados: telaDados }[UI.tab] || telaVitrine;
  const y = window.scrollY; $('#app').innerHTML = f(); window.scrollTo(0, y);
}
const semDados = () => `<div class="card empty">Ainda não há dados. Abra <b>Dados</b> e use <b>Importar JSON</b> com o arquivo da análise.<div class="acts" style="justify-content:center"><button class="btn pri" data-tab="dados">Ir para Dados</button></div></div>`;

function cardItem(it) {
  const p = precoMostra(it), t = tetoDe(it), d = desc(it), al = alerta(it), m = meuDo(it), tipo = tipoCompra(it), real = precoReal(it) != null, vOutro = !real && precoVenc(it) != null;
  const pos = (v) => Math.max(0, Math.min(99, Math.round(v / t * 100)));

  const conc = new Map(); lista('itens').forEach((c) => { const v = precoReal(c); if (v == null) return; const k = chavePzBase(get('pregoes', c.pregao)) + '|' + nItem('', c.item); const a = conc.get(k); if (!a || v < a.v) conc.set(k, { v, c }); });

    ${fi('preco', 'Preço na proposta', br(it.preco))}${fi('final', 'Preço final (vencedor)', br(it.final))}${fi('teto', 'Teto do edital', br(it.teto))}${fs('fase', 'Proposta', it.fase || '', [['inicial', 'Inicial (≈ teto)'], ['readequada', 'Readequada / final'], ['', 'Não sei']])}
    ${fi('qtd', 'Qtd', it.qtd)}${fi('unid', 'Unidade', it.unid)}${fs('empresa', 'Empresa', it.empresa, [['', '—']].concat(lista('empresas').map((e) => [e.id, empNome(e.id)])))}${fs('pregao', 'Pregão', it.pregao, [['', '—']].concat(lista('pregoes').map((p) => [p.id, pzNome(p.id)])))}
    ${fi('item', 'Nº do item', it.item)}${fi('obs', 'Observação', it.obs, 'w4', 'area')}${fi('nota', 'Minha anotação', it.nota, 'w4', 'area')}</form>
    <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-item">Salvar</button></div>`);
}
function formEmp(id) {
  const e = get('empresas', id) || {};
  abrir(`<h3>${esc(e.nome || 'Empresa')}</h3><form id="fEmp" class="fg" data-id="${esc(id)}">${fi('perfil', 'Perfil / onde compra', e.perfil, 'w4')}${fi('proposta', 'Como monta a proposta', e.proposta, 'w4', 'area')}${fi('catalogo', 'Como monta o catálogo', e.catalogo, 'w4', 'area')}${fi('nota', 'Minha anotação', e.nota, 'w4', 'area')}</form>
    <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-emp">Salvar</button></div>`);
}
function formLic(id) {
  const l = id ? get('licoes', id) : { tema: 'Preço' };
  abrir(`<h3>${id ? 'Lição' : 'Nova lição'}</h3><form id="fLic" class="fg" data-id="${esc(id || '')}">${fi('tema', 'Tema', l.tema, 'w4')}${fi('texto', 'Lição', l.texto, 'w4', 'area')}</form>
    <div class="acts">${id ? '<button class="btn danger sp" data-act="excluir-lic">Excluir</button>' : ''}<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-lic">Salvar</button></div>`);
}
const ler = (f) => Object.fromEntries(new FormData(f).entries());

/* ---------- eventos ---------- */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab],[data-cat],[data-ord],[data-cmpf],[data-ver],[data-edit],[data-edit-emp],[data-edit-lic],[data-filtro-emp],[data-act],#btnConta');
  if (!t) { if (ev.target.classList.contains('dlg')) fechar(); return; }
  if (t.id === 'btnConta') return Nuvem.conta();
  if (t.dataset.tab) { UI.tab = t.dataset.tab; saveUI(); fechar(); window.scrollTo(0, 0); return render(); }
  if (t.dataset.cat != null) { UI.cat = t.dataset.cat; saveUI(); return render(); }
  if (t.dataset.ord) { UI.ord = t.dataset.ord; saveUI(); return render(); }
  if (t.dataset.cmpf) { UI.cmpF = t.dataset.cmpf; saveUI(); return render(); }
  if (t.dataset.ver) return verItem(t.dataset.ver);
  if (t.dataset.edit) return formItem(t.dataset.edit);
  if (t.dataset.editEmp) return formEmp(t.dataset.editEmp);
  if (t.dataset.editLic) return formLic(t.dataset.editLic);
  if (t.dataset.filtroEmp) { UI.tab = 'vitrine'; UI.cat = ''; UI.q = empNome(t.dataset.filtroEmp); saveUI(); window.scrollTo(0, 0); return render(); }
  const a = t.dataset.act;
  if (a === 'fechar') return fechar();
  if (a === 'login') return Nuvem.entrar(ler($('#fLogin')));
  if (a === 'nova-licao') return formLic(null);
  if (a === 'salvar-item') { const f = $('#fItem'), d = ler(f); ['preco', 'teto', 'final', 'qtd'].forEach((k) => { d[k] = num(d[k]); }); if (!d.nome) return alert('Informe o item.'); gravar('itens', f.dataset.id || novoId('u'), d); return fechar(); }
  if (a === 'excluir-item') { if (confirm('Excluir este item?')) { gravar('itens', t.dataset.id, { deleted: true }); fechar(); } return; }
  if (a === 'salvar-emp') { const f = $('#fEmp'); gravar('empresas', f.dataset.id, ler(f)); return fechar(); }
  if (a === 'salvar-lic') { const f = $('#fLic'), d = ler(f); if (!d.texto) return; gravar('licoes', f.dataset.id || novoId('l'), d); return fechar(); }
  if (a === 'excluir-lic') { if (confirm('Excluir esta lição?')) { gravar('licoes', $('#fLic').dataset.id, { deleted: true }); fechar(); } return; }
  if (a === 'sync') return Nuvem.sync(true);
  if (a === 'recarregar-meus') return Nuvem.lerMeus(true);
  if (a === 'exportar') { const out = { versao: 2, exportadoEm: new Date().toISOString() }; COLS.forEach((c) => { out[c] = lista(c); }); const b = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }); const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = 'concorrentes-' + new Date().toISOString().slice(0, 10) + '.json'; l.click(); }
});
let qT = null;
document.addEventListener('input', (ev) => { if (ev.target.id === 'q') { UI.q = ev.target.value; clearTimeout(qT); qT = setTimeout(() => { const pos = ev.target.selectionStart; render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 150); } });
document.addEventListener('change', (ev) => { if (ev.target.id === 'imp') importar(ev.target.files[0]); if (ev.target.id === 'impMeus') abrirMeus(ev.target.files[0]); });
async function abrirMeus(file) { if (!file) return; try { const d = JSON.parse(await file.text()); MEUS = { pregoes: d.pregoes || [], itens: d.itens || [], fonte: 'backup ' + file.name }; MEU_IDX = null; VENC_IDX = null; render(); } catch (e) { alert('Arquivo inválido.'); } }

// importação sem repetir: itens pela chave pregão|item|empresa; arquivos pelo md5; demais pelo id
async function importar(file) {
  if (!file) return;
  let d; try { d = JSON.parse(await file.text()); } catch (e) { return alert('Arquivo inválido.'); }
  const now = Date.now(), cont = { novo: 0, atual: 0, igual: 0 };
  const arr = (c) => { const x = d[c]; return !x ? [] : Array.isArray(x) ? x : Object.entries(x).map(([id, r]) => Object.assign({ id }, r)); };
  const sem = (o) => JSON.stringify(Object.keys(o).filter((k) => !['updatedAt', 'id', 'nota'].includes(k)).sort().map((k) => [k, o[k]]));
  const por = (col, r, id) => { const old = OVER[col][id]; if (old && !old.deleted && sem(old) === sem(r)) { cont.igual++; return; } if (old && !old.deleted) cont.atual++; else cont.novo++; OVER[col][id] = Object.assign({}, old || {}, r, { id, nota: (old && old.nota) || r.nota || '', updatedAt: now }); };
  ['pregoes', 'empresas', 'licoes'].forEach((c) => arr(c).forEach((r) => por(c, r, r.id || novoId(c[0]))));
  const idxMd5 = new Map(lista('arquivos').map((a) => [a.md5, a.id]));
  arr('arquivos').forEach((r) => por('arquivos', r, idxMd5.get(r.md5) || r.id || novoId('a')));
  const idxIt = new Map(lista('itens').map((i) => [chaveItem(i), i.id]));
  arr('itens').forEach((r) => por('itens', r, idxIt.get(chaveItem(r)) || r.id || novoId('i')));
  OVER.at = now; save(); MEU_IDX = null; VENC_IDX = null; render(); Nuvem.agendar();
  alert(`Importado: ${cont.novo} novos, ${cont.atual} atualizados, ${cont.igual} já existiam iguais (não repetidos).`);
}

/* ---------- nuvem ---------- */
const Nuvem = (() => {
  const BASEURL = 'https://www.gstatic.com/firebasejs/12.15.0/', COL = 'concorrentes_dados';
  const cfg = { apiKey: 'AIzaSyCQBwZU8NK9YTGrnI-1-XDUhRGcmn3vMHs', authDomain: 'ajuste-financeiro.firebaseapp.com', projectId: 'ajuste-financeiro', storageBucket: 'ajuste-financeiro.firebasestorage.app', messagingSenderId: '1084264963597', appId: '1:1084264963597:web:fbf369dfa8e5dcb1d1bf44' };
  let F = null, user = null, tmr = null, ouvindo = null, estado = 'carregando';
  const temLocal = () => COLS.some((c) => Object.keys(OVER[c] || {}).length);
  const st = (t, c) => { const e = $('#sync'); e.textContent = t; e.className = 'sync ' + (c || ''); };
  async function init() {
    try {
      const [a, au, fs] = await Promise.all([import(BASEURL + 'firebase-app.js'), import(BASEURL + 'firebase-auth.js'), import(BASEURL + 'firebase-firestore.js')]);
      const app = a.initializeApp(cfg), auth = au.getAuth(app), db = fs.getFirestore(app);
      F = { au, fs, auth, db };
      au.onAuthStateChanged(auth, (u) => { user = u; estado = u ? 'ok' : 'login'; $('#btnConta').hidden = !u; render(); if (u) { sync(false); ouvir(); lerMeus(false); } else { if (ouvindo) ouvindo(); ouvindo = null; st('Fora da conta'); } });
    } catch (e) { estado = temLocal() ? 'semnet' : 'offline'; st('Sem internet', 'err'); lerMeusLocal(); render(); }
  }
  function mesclar(a, b) {
    const out = { at: Math.max(a.at || 0, b.at || 0) }; let mudouA = false, mudouB = false;
    COLS.forEach((c) => { out[c] = {}; new Set([...Object.keys(a[c] || {}), ...Object.keys(b[c] || {})]).forEach((id) => {
      const x = (a[c] || {})[id], y = (b[c] || {})[id], w = !x ? y : !y ? x : ((y.updatedAt || 0) > (x.updatedAt || 0) ? y : x); out[c][id] = w;
      if (w !== x && JSON.stringify(w) !== JSON.stringify(x)) mudouA = true; if (w !== y && JSON.stringify(w) !== JSON.stringify(y)) mudouB = true; }); });
    return { out, mudouA, mudouB };
  }
  const ref = () => F.fs.doc(F.db, COL, user.uid);
  async function sync(avisar) {
    if (!F || !user) return;
    st('Sincronizando…', 'run');
    try {
      const r = await F.fs.runTransaction(F.db, async (tx) => { const s = await tx.get(ref()), rem = s.exists() ? JSON.parse(s.data().json || '{}') : {}; const m = mesclar(OVER, rem); if (m.mudouB || !s.exists()) tx.set(ref(), { json: JSON.stringify(m.out), at: Date.now() }); return m; });
      if (r.mudouA) { OVER = Object.assign(vazio(), r.out); save(); MEU_IDX = null; VENC_IDX = null; render(); }
      st('Na nuvem ✓', 'ok');
    } catch (e) { st('Erro na nuvem', 'err'); if (avisar) alert('Não consegui sincronizar: ' + e.message); }
  }
  function ouvir() { if (ouvindo) return; ouvindo = F.fs.onSnapshot(ref(), (s) => { if (!s.exists() || s.metadata.hasPendingWrites) return; const m = mesclar(OVER, JSON.parse(s.data().json || '{}')); if (m.mudouA) { OVER = Object.assign(vazio(), m.out); save(); MEU_IDX = null; VENC_IDX = null; render(); } if (m.mudouB) agendar(); }, () => {}); }
  function agendar() { if (!user) return; clearTimeout(tmr); st('Alterado…', 'run'); tmr = setTimeout(() => sync(false), 1500); }
  // Meus Pregões: lê da mesma conta (índice + uma ficha por pregão), só leitura; sem nuvem, tenta o aparelho
  function lerMeusLocal() { try { const d = JSON.parse(localStorage.getItem('mp.state.v1') || 'null'); if (d && d.pregoes) { MEUS = { pregoes: d.pregoes, itens: d.itens || [], fonte: 'este aparelho' }; MEU_IDX = null; VENC_IDX = null; } } catch (e) { /* */ } }
  async function lerMeus(avisar) {
    try {
      const si = await F.fs.getDoc(F.fs.doc(F.db, 'pregoesmei_idx', user.uid));
      if (!si.exists()) { lerMeusLocal(); render(); return; }
      const ks = (si.data().pz || []).map((x) => x.k), pregoes = [], itens = [];
      await Promise.all(ks.map(async (k) => { const s = await F.fs.getDoc(F.fs.doc(F.db, 'pregoesmei_pz_' + k, user.uid)); if (!s.exists()) return; const d = s.data(); if (d.pregao) pregoes.push(d.pregao); (d.itens || []).forEach((i) => itens.push(i)); }));
      MEUS = { pregoes, itens, fonte: 'sua nuvem' }; MEU_IDX = null; VENC_IDX = null; render();
    } catch (e) { lerMeusLocal(); render(); if (avisar) alert('Não consegui ler o Meus Pregões da nuvem: ' + e.message); }
  }
  function conta() { if (!F || !user) return; if (confirm('Sair da conta? Os dados deste aparelho são apagados (continuam na sua nuvem).')) { OVER = vazio(); MEUS = null; try { localStorage.removeItem(LS); } catch (e) { /* */ } F.au.signOut(F.auth); } }
  async function entrar(d) { if (!F) return alert('Sem conexão com a nuvem agora.'); try { await F.au.signInWithEmailAndPassword(F.auth, (d.email || '').trim(), d.senha || ''); } catch (e) { alert('Não entrou: confira o e-mail e a senha (' + e.code + ').'); } }
  return { init, sync, agendar, conta, entrar, lerMeus, liberado: () => estado === 'ok' || estado === 'semnet', estado: () => estado };
})();

render(); Nuvem.init();
</script>
