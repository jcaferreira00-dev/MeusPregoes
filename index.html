        const egList = $('#egList', form);
        const lerEntregas = () => $$('.egrow', form).map((r) => ({
          id: r.dataset.id, local: r.dataset.local,
          km: C.parseBR($('[data-eg=km]', r).value) || 0, viagens: C.parseBR($('[data-eg=viagens]', r).value) || 0, pedagio: C.parseBR($('[data-eg=pedagio]', r).value) || 0,
          kmManual: r.dataset.manual === '1',
        }));
        form._lerEntregas = lerEntregas;
        const linhasLocais = () => String($('[name=locaisEntrega]', form).value || '').split('\n').map((t) => t.trim()).filter(Boolean);
        const rowHtml = (e, i) => `<div class="egrow" data-id="${esc(e.id)}" data-local="${esc(e.local)}"${e.kmManual ? ' data-manual="1"' : ''}>
          <div class="egtit"><span><b>Entrega ${i + 1}</b> · ${esc(e.local)}</span><span class="egcusto">—</span></div>
          <div class="eg3">
            <div class="field"><label>Km (ida e volta)</label><input class="input" data-eg="km" inputmode="decimal" autocomplete="off" value="${esc(e.km ? C.numBR(e.km, 1) : '')}"></div>
            <div class="field"><label>Nº de viagens</label><input class="input" data-eg="viagens" inputmode="numeric" autocomplete="off" value="${esc(e.viagens == null ? 1 : e.viagens)}"></div>
            <div class="field"><label>Pedágio (R$)</label><input class="input" data-eg="pedagio" inputmode="decimal" autocomplete="off" value="${esc(e.pedagio ? C.numBR(e.pedagio) : '')}"></div>
          </div><div class="tiny muted egstat"></div></div>`;
        async function calcLinha(row, forcar) {
          if (row.dataset.manual === '1' && !forcar) return;
          if (forcar) delete row.dataset.manual;
          const stat = $('.egstat', row), kmIn = $('[data-eg=km]', row);
          stat.style.color = ''; stat.textContent = 'Calculando trajeto…';
          try {
            const r = await Rota.calcular(store.get().config.empresa, [row.dataset.local]);
            if (!row.isConnected) return;
            ajustando = true; kmIn.value = C.numBR(r.km, 1); kmIn.dispatchEvent(new Event('input', { bubbles: true })); ajustando = false;
            stat.style.color = 'var(--green)'; stat.textContent = `Trajeto: ${r.rotulo} = ${C.numBR(r.km, 1)} km (ida e volta).`;
          } catch (e) {
            if (!row.isConnected) return;
            stat.style.color = 'var(--red)'; stat.textContent = e && e.message ? e.message : 'Não foi possível calcular. Informe o km manualmente.';
          }
        }
        async function montarEntregas() {
          const antes = lerEntregas(), base = (cur && cur.entregas) || [], locais = linhasLocais();
          const lista = locais.map((l, i) => {
            const a = antes[i] || base[i] || {};
            const igual = a.local === l;
            return { id: a.id || novoId(), local: l, km: igual ? a.km : 0, viagens: igual && a.viagens != null ? a.viagens : 1, pedagio: igual ? a.pedagio : 0, kmManual: igual ? a.kmManual : false };
          });
          const n = ++seqE;
          egList.innerHTML = lista.map(rowHtml).join('');
          form.dispatchEvent(new Event('input', { bubbles: true }));
          for (const row of $$('.egrow', form)) {
            if (n !== seqE || !form.isConnected) return;
            if (!(C.parseBR($('[data-eg=km]', row).value) > 0)) await calcLinha(row, false);
          }
        }
        egList.addEventListener('input', (e) => { const r = e.target.closest('.egrow'); if (r && e.target.dataset.eg === 'km' && !ajustando) r.dataset.manual = '1'; });
        const info = $('#rotaInfo', form), kmEl = $('[name=km]', form);
        const viagensEl = $('[name=viagens]', form);
        const setInfo = (t, cls) => { info.textContent = t; info.style.color = cls === 'err' ? 'var(--red)' : cls === 'ok' ? 'var(--green)' : ''; };
        kmEl.addEventListener('input', () => { if (!ajustando) form.dataset.kmManual = '1'; });
        async function calcular(forcar) {
          const x = readForm(form), cfg = store.get().config;
          if (x.entregaDiferente) { for (const row of $$('.egrow', form)) await calcLinha(row, !!forcar); return; }
          if (forcar) delete form.dataset.kmManual;
          const destinos = x.entregaDiferente ? String(x.locaisEntrega || '').split('\n').map((t) => t.trim()).filter(Boolean) : [String(x.cidadeUf || '').trim()].filter(Boolean);
          if (!destinos.length) { setInfo(x.entregaDiferente ? 'Informe os locais de entrega para calcular o trajeto.' : 'Informe o local do pregão para calcular o trajeto.'); return; }
          if (form.dataset.kmManual === '1' && !forcar) { setInfo('Km informado por você. Toque em “Recalcular trajeto” para usar o cálculo automático.'); return; }
          const n = ++seq;
          setInfo('Calculando trajeto…');
          try {
            const r = await Rota.calcular(cfg.empresa, destinos);
            if (n !== seq || !form.isConnected) return;
            ajustando = true;
            kmEl.value = C.numBR(r.km, 1);
            if (!String(viagensEl.value).trim() || C.parseBR(viagensEl.value) === 0) viagensEl.value = '1';
            kmEl.dispatchEvent(new Event('input', { bubbles: true }));
            ajustando = false;
            setInfo(`Trajeto: ${r.rotulo} = ${C.numBR(r.km, 1)} km (ida e volta). Pode ajustar o km manualmente.`, 'ok');
          } catch (e) {
            if (n !== seq || !form.isConnected) return;
            setInfo(e && e.message ? e.message : 'Não foi possível calcular o trajeto agora. Informe o km manualmente.', 'err');
          }
        }
        const agendar = () => { clearTimeout(timer); timer = setTimeout(() => calcular(false), 500); };
        form.addEventListener('change', (e) => {
          const n = e.target && e.target.name, ligado = !!$('[name=entregaDiferente]', form).checked;
          if (n === 'cidadeUf' && !ligado) agendar();
          else if (n === 'entregaDiferente') { if (ligado) montarEntregas(); else agendar(); }
          else if (n === 'locaisEntrega' && ligado) montarEntregas();
        });
        form.addEventListener('click', (e) => { if (e.target.closest('[data-rota="calc"]')) calcular(true); });
        if (kmEl.value && cur && cur.kmManual) form.dataset.kmManual = '1';
        if ($('[name=entregaDiferente]', form).checked) montarEntregas();
        else if (!kmEl.value && v.cidadeUf) agendar();
      },
      onInput: (form) => {
        const x = readForm(form), cfg = store.get().config;
        let custo;
        if (x.entregaDiferente) {
          custo = 0;
          $$('.egrow', form).forEach((r) => {
            const c = C.custoViagem({ km: C.parseBR($('[data-eg=km]', r).value), viagens: C.parseBR($('[data-eg=viagens]', r).value), pedagio: C.parseBR($('[data-eg=pedagio]', r).value) }, cfg);
            $('.egcusto', r).textContent = C.brl(c); custo += c;
          });
        } else custo = C.custoViagem({ km: C.parseBR(x.km), viagens: C.parseBR(x.viagens), pedagio: C.parseBR(x.pedagio) }, cfg);
        $('#viagemCusto', form).textContent = C.brl(custo);
        $('#boxEntregas', form).classList.toggle('hidden', !x.entregaDiferente);
        $('#boxUnico', form).classList.toggle('hidden', !!x.entregaDiferente);
      },
      onSave: (x, form) => {
        $$('.input.err', form).forEach((e) => e.classList.remove('err'));
        const miss = [];
        if (!x.numero.trim()) miss.push('numero');
        if (!x.orgao.trim()) miss.push('orgao');
        if (miss.length) { miss.forEach((n) => $('[name=' + n + ']', form).classList.add('err')); return 'Preencha o número do pregão e o órgão.'; }
        if (/[^0-9.\-\/]/.test(x.numero.trim())) { $('[name=numero]', form).classList.add('err'); return 'No nº do pregão vão só números e . - / (ex.: 90001/2026). A proposta já escreve “Pregão nº” antes.'; }
        const km = C.parseBR(x.km) || 0;
        const ent = x.entregaDiferente && form._lerEntregas ? form._lerEntregas() : [];
        if (x.entregaDiferente && !ent.length) { $('[name=locaisEntrega]', form).classList.add('err'); return 'Informe ao menos um local de entrega ou desmarque a opção.'; }
        const data = {
          numero: x.numero.trim(), orgao: x.orgao.trim(), plataforma: (x.plataforma || '').trim(), cidadeUf: x.cidadeUf.trim(), sessao: x.sessao || '', prazoPropostas: x.prazoPropostas || '',
          entregaDiferente: !!x.entregaDiferente, kmManual: form.dataset.kmManual === '1',
          prazoEntregaDias: x.prazoEntregaDias ? parseInt(x.prazoEntregaDias, 10) : null, exigencias: x.exigencias.trim(), status: x.status,
          link: x.link.trim(), linkProposta: (x.linkProposta || '').trim(), linkLicitacao: (x.linkLicitacao || '').trim(), obs: x.obs.trim(),
          modeloProprio: !!x.modeloProprio, linkModelo: (x.linkModelo || '').trim(),
          entregaParcelada: !!x.entregaParcelada, entregaParceladaObs: (x.entregaParceladaObs || '').trim(),
          empenhoNum: (x.empenhoNum || '').trim(), empenhoData: x.empenhoData || '', entregaPrazo: x.entregaPrazo || '', entregueEm: x.entregueEm || '',
          pagamentoDias: x.pagamentoDias ? (parseInt(x.pagamentoDias, 10) || null) : null, pagoEm: x.pagoEm || '',
        };
        if (x.entregaDiferente) { data.entregas = ent; data.locaisEntrega = ent.map((e) => e.local).join('\n'); }
        else Object.assign(data, { entregas: [], locaisEntrega: '', km, viagens: x.viagens === '' ? (km > 0 ? 1 : 0) : (C.parseBR(x.viagens) || 0), pedagio: C.parseBR(x.pedagio) || 0 });
        if (id) data.id = id;
        const antesSt = id ? (store.get().pregoes.find((x) => x.id === id) || {}).status : null;
        const nid = store.upsertPregao(data);
        toast(id ? 'Pregão atualizado' : 'Pregão cadastrado');
        perguntarItensGanhos(nid, antesSt);
        if (!id) { UI.tab = 'pregoes'; UI.detailId = nid; }
        return true;
      },
      onDelete: id ? async () => {
        const ok = await confirmar('Excluir este pregão?', 'Os itens dele também serão excluídos.', 'Excluir', true);
        if (ok) { store.removePregao(id); if (UI.detailId === id) { UI.detailId = null; } toast('Pregão excluído'); }
        return ok;
      } : null,
    });
  }

  // "Onde comprar": link vira botão. Vale o campo "Link de compra"; se o "Onde compro" já for um endereço, ele também serve.
  const urlSeg = (u) => {
    u = String(u || '').trim();
    if (!u || /\s/.test(u) || /^(javascript|data|vbscript|file|blob):/i.test(u)) return '';
    return /^https?:\/\//i.test(u) ? u : 'https://' + u;
  };
  const pareceUrl = (s) => /^(https?:\/\/\S+|www\.\S+|[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(\/\S*)?)$/i.test(String(s || '').trim());
  function compraInfo(it) {
    const nome = String(it.onde || '').trim();
    const href = urlSeg(it.ondeLink) || (pareceUrl(nome) ? urlSeg(nome) : '');
    if (!href && !nome) return null;
    let label = nome && !pareceUrl(nome) ? nome : '';
    if (!label && href) { try { label = new URL(href).hostname.replace(/^www\./, ''); } catch (_) { label = 'link'; } }
    return { href, label, nome };
  }

  // opção principal + até ALT_N alternativas (loja, link, frete, custo) para comparar fornecedores
  const ALT_N = 8, ALTS = Array.from({ length: ALT_N }, (_, i) => i);
  function comprasDoItem(it) {
    const novo = (Array.isArray(it.alternativas) ? it.alternativas : []).some((a) => a && typeof a.usar === 'boolean');
    const out = [], main = novo ? null : compraInfo(it);
    if (main) out.push(Object.assign({ principal: true, usada: true, custo: null, barato: false }, main));
    (Array.isArray(it.alternativas) ? it.alternativas : []).forEach((a) => {
      const nome = String(a.loja || '').trim();
      const href = urlSeg(a.link) || (pareceUrl(nome) ? urlSeg(nome) : '');
      if (!href && !nome) return;
      let label = nome && !pareceUrl(nome) ? nome : '';
      if (!label && href) { try { label = new URL(href).hostname.replace(/^www\./, ''); } catch (_) { label = 'link'; } }
      const custo = a.custo == null ? null : Number(a.custo);
      out.push({ principal: novo && a.usar === true && !out.some((o) => o.principal), usada: novo ? a.usar === true : Number(a.qtd) > 0, href, label, nome, custo, barato: custo != null && it.custo != null && custo < it.custo });
    });
    // o que vou usar para comprar vem primeiro (ordem do cadastro dentro de cada grupo)
    return out.map((o, i) => [o, i]).sort((a, b) => (b[0].usada ? 1 : 0) - (a[0].usada ? 1 : 0) || a[1] - b[1]).map((x) => x[0]);
  }

  // item salvo no modelo antigo (principal + alternativas): o principal vira a opção 1, marcada
  function opcoesParaForm(it) {
    const alts = Array.isArray(it.alternativas) ? it.alternativas : [];
    if (alts.some((a) => a && typeof a.usar === 'boolean')) return alts;

    const pregoesPode = new Set(itensPode.map((r) => r.o.p.id));
    const todos = D.pode ? baseP.filter((o) => pregoesPode.has(o.p.id)) : baseP;
    const rows0 = () => { let r = todos.slice(); if (D.etapa) r = r.filter((o) => dashEtapaOk(o, D.etapa)); if (D.orgao) r = r.filter((o) => o.p.orgao === D.orgao); if (D.mes) r = r.filter((o) => o.ym === D.mes); return r; };
    const part = todos.filter((o) => DASH_PART.includes(o.p.status));
    const gan = todos.filter((o) => o.x.ganho);
    const ent = gan.filter((o) => o.p.entregueEm), pag = gan.filter((o) => o.p.pagoEm);
    const soma = (arr, k) => arr.reduce((s, o) => s + (o.x[k] || 0), 0);

    // filtros ativos
    const chips = [];
    if (D.pode) chips.push(['pode', '1', 'Só os itens que posso ganhar']);
    if (D.coloc) chips.push(['coloc', '1', 'Itens com colocação']);
    if (D.colocTop) chips.push(['colocTop', '3', 'Até o 3º lugar']);
    if (D.etapa) chips.push(['etapa', D.etapa, DASH_ETAPAS[D.etapa]]);
    if (D.orgao) chips.push(['orgao', D.orgao, D.orgao]);
    if (D.mes) chips.push(['mes', D.mes, 'Mês ' + rotuloMes(D.mes)]);
    const periodos = [['mes', 'Este mês'], ['tri', '3 meses'], ['ano', 'Este ano'], ['tudo', 'Tudo']];
    const barra = `<div class="card"><div class="dash-bar"><h3 style="margin:0" class="grow">${icon('painel', 'sm')}<span class="grow">Dashboard</span></h3>
      <button type="button" class="dpill${D.pode ? ' on' : ''}" data-act="dash-filtro" data-k="pode" data-v="1" data-tip="Itens marcados como 'Posso ganhar' (sem resultado ainda). Clique para ver só eles, com o pregão de cada um.">${icon('check', 'sm')}Posso ganhar <b>${itensPode.length}</b><small>${C.brl0(itensPode.reduce((s, r) => s + valorItem(r.it), 0))}</small></button>
      <button type="button" class="dpill${D.coloc ? ' on' : ''}" data-act="dash-filtro" data-k="coloc" data-v="1" data-tip="Itens em que fiquei com colocação (1º, 2º, 3º…) e não ganhei. Clique para listar, do mais perto de ganhar para o mais longe.">${icon('acomp', 'sm')}Colocações <b>${itensColoc.length}</b></button>
      <button type="button" class="btn sm ghost" data-act="tab" data-v="acomp" title="Abrir a guia Acompanhar (posso ganhar e vencidos, por pregão)">${icon('acomp', 'sm')} Acompanhar</button>
      <div class="dseg" role="group" aria-label="Período">${periodos.map(([k, n]) => `<button type="button" class="${D.periodo === k ? 'on' : ''}" data-act="dash-periodo" data-v="${k}">${n}</button>`).join('')}</div></div>
      ${chips.length ? `<div class="dash-chips">${chips.map(([k, v, n]) => `<button type="button" class="dchip" data-act="dash-filtro" data-k="${k}" data-v="${esc(v)}">${esc(n)} ✕</button>`).join('')}<button type="button" class="btn sm ghost" data-act="dash-limpar">Limpar filtros</button></div>` : `<p class="tiny muted" style="margin-top:8px">Clique em "Posso ganhar", numa etapa do funil, num mês ou num órgão para filtrar.</p>`}</div>`;

    // rosca: de onde vem o preço de venda (responde ao período, funil, mês e órgão; clicar numa fatia destaca)
    const compD = { produtos: 0, frete: 0, entrega: 0, impostos: 0, lucro: 0 };
    rows0().forEach((o) => {
      if (C.INATIVOS.includes(o.p.status)) return;
      (o.x.todosItens || []).forEach((it) => {
        if (it.semLance) return;
        const c = R.iMap.get(it.id); if (!c || c.naoGanhou) return;
        compD.produtos += c.produtos || 0; compD.frete += c.frete || 0; compD.entrega += c.entrega || 0; compD.lucro += c.lucro || 0; compD.impostos += (c.imposto || 0) + (c.impostoCompra || 0);
      });
    });
    const segsD = [['produtos', 'Custo dos produtos', compD.produtos, '#5b6b82'], ['frete', 'Frete do fornecedor', compD.frete, '#e8a76b'], ['entrega', 'Entrega de carro', compD.entrega, '#f2cf5b'], ['impostos', 'Impostos', compD.impostos, '#8e6bbf'], ['lucro', 'Lucro', compD.lucro, '#4caf66']];
    const totD = segsD.reduce((t, x) => t + Math.max(0, x[2]), 0), CIRC = 2 * Math.PI * 54;
    let accD = 0;
    const selF = segsD.find((x) => x[0] === D.fatia);
    const arcsD = totD > 0 ? segsD.map(([k, l, v, col]) => {
      const len = Math.max(0, v) / totD * CIRC, tip = l + ': ' + C.brl0(v) + ' · ' + C.pct(Math.max(0, v) / totD, 1) + ' do preço de venda';
      const e = `<circle class="dn-seg${D.fatia === k ? ' sel' : D.fatia ? ' dim' : ''}" cx="80" cy="80" r="54" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(CIRC - len).toFixed(2)}" stroke-dashoffset="${(-accD).toFixed(2)}" transform="rotate(-90 80 80)" data-act="dash-filtro" data-k="fatia" data-v="${k}" data-tip="${esc(tip)}"/>`;
      accD += len; return e;
    }).join('') : '';
    const centro = totD <= 0 ? '<text x="80" y="84" text-anchor="middle" font-size="12" fill="currentColor">sem dados</text>'
      : selF ? `<text x="80" y="72" text-anchor="middle" font-size="21" font-weight="800" fill="currentColor">${C.pct(Math.max(0, selF[2]) / totD, 0)}</text><text x="80" y="88" text-anchor="middle" font-size="9.5" fill="currentColor">${esc(selF[1])}</text><text x="80" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">${C.brl0(selF[2])}</text>`
      : `<text x="80" y="76" text-anchor="middle" font-size="22" font-weight="800" fill="currentColor">${C.pct(compD.lucro / totD, 0)}</text><text x="80" y="95" text-anchor="middle" font-size="11" fill="currentColor">de lucro</text>`;
    const donutCard = `<div class="card dn-card"><h3>${icon('painel', 'sm')}<span class="grow">De onde vem o preço de venda</span></h3><div class="donut-wrap">
      <svg viewBox="0 0 160 160" role="img" aria-label="Composição do preço"><circle cx="80" cy="80" r="54" fill="none" stroke="var(--line)" stroke-width="22"/>${arcsD}${centro}</svg>
      <div class="donut-leg">${segsD.map(([k, l, v, col]) => `<button type="button" class="dn-row${D.fatia === k ? ' sel' : ''}" data-act="dash-filtro" data-k="fatia" data-v="${k}" data-tip="${esc(l + ': ' + C.brl0(v) + (totD > 0 ? ' · ' + C.pct(Math.max(0, v) / totD, 1) : ''))}"><i style="background:${col}"></i><span class="grow">${l}</span><b>${C.brl0(v)}</b></button>`).join('')}</div></div>
      <p class="tiny muted" style="margin-top:10px">Pregões ativos do filtro abaixo (exclui Perdeu, Desclassificado e Desisti). Passe o mouse ou clique numa fatia para destacar.</p></div>
    `;
    // funil
    const etapas = [['enviadas', part, soma(part, 'proposta'), '#2e75b6'], ['ganhas', gan, soma(gan, 'venda'), '#4caf66'], ['entregues', ent, soma(ent, 'venda'), '#e0a800'], ['pagas', pag, soma(pag, 'venda'), '#2f7d3a']];
    const base = Math.max(1, part.length);
    const funil = etapas.map(([k, arr, val, cor], i) => {
      const ant = i === 0 ? null : etapas[i - 1][1].length;
      const conv = ant ? C.pct(arr.length / ant, 0) + ' da etapa anterior' : '';
      const tip = DASH_ETAPAS[k] + ': ' + arr.length + ' · ' + C.brl0(val) + (conv ? ' · ' + conv : '');
      return `<button type="button" class="fn-row${D.etapa === k ? ' sel' : ''}" data-act="dash-filtro" data-k="etapa" data-v="${k}" data-tip="${esc(tip)}"><span class="fn-l">${DASH_ETAPAS[k]}</span><span class="fn-bar"><i style="width:${(arr.length / base * 100).toFixed(1)}%;--c:${cor}"></i></span><span class="fn-n"><b>${arr.length}</b><small>${C.brl0(val)}</small></span></button>`;
    }).join('');
    const funilCard = `<div class="card"><h3>${icon('painel', 'sm')}<span class="grow">Funil das propostas</span></h3>${part.length ? funil : '<p class="muted small">Nenhuma proposta enviada neste período.</p>'}${part.length ? `<p class="tiny muted" style="margin-top:8px">Conversão: <b style="color:var(--ink)">${gan.length}</b> ganha(s) de <b style="color:var(--ink)">${part.length}</b> enviada(s).</p>` : ''}</div>`;

    // evolução por mês (venda e lucro dos ganhos, pela data da sessão)
    const meses = {};
    gan.forEach((o) => { const m = meses[o.ym] || (meses[o.ym] = { venda: 0, lucro: 0, n: 0 }); m.venda += o.x.venda || 0; m.lucro += o.x.lucro || 0; m.n += 1; });
    const chaves = Object.keys(meses).sort().slice(-12);
    let evo = '<p class="muted small">Nenhum pregão ganho neste período.</p>';
    if (chaves.length) {
      const W = 620, H = 230, pl = 46, pr = 8, pt = 12, pb = 28;
      const mx = Math.max(1, ...chaves.map((k) => Math.max(meses[k].venda, meses[k].lucro)));
      const y = (v) => pt + (H - pt - pb) * (1 - Math.max(0, v) / mx);
      const slot = (W - pl - pr) / chaves.length, bw = Math.min(30, slot * 0.34);
      const grade = [0, 0.5, 1].map((f) => `<line x1="${pl}" x2="${W - pr}" y1="${y(mx * f).toFixed(1)}" y2="${y(mx * f).toFixed(1)}" class="dm-grid"/><text x="${pl - 6}" y="${(y(mx * f) + 4).toFixed(1)}" text-anchor="end" class="dm-ax">${kfmt(mx * f)}</text>`).join('');
      const grupos = chaves.map((k, i) => {
        const m = meses[k], cx = pl + slot * i + slot / 2;
        const tip = rotuloMes(k) + ' · Venda ' + C.brl0(m.venda) + ' · Lucro ' + C.brl0(m.lucro) + ' · ' + m.n + (m.n === 1 ? ' pregão' : ' pregões');
        return `<g class="dm-grp${D.mes === k ? ' sel' : ''}" data-act="dash-filtro" data-k="mes" data-v="${k}" data-tip="${esc(tip)}"><rect class="hit" x="${(cx - slot / 2).toFixed(1)}" y="${pt}" width="${slot.toFixed(1)}" height="${H - pt - pb}" rx="8"/><rect class="bar-v" x="${(cx - bw - 1).toFixed(1)}" y="${y(m.venda).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - pb - y(m.venda)).toFixed(1)}" rx="4"/><rect class="bar-l" x="${(cx + 1).toFixed(1)}" y="${y(m.lucro).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - pb - y(m.lucro)).toFixed(1)}" rx="4"/><text x="${cx.toFixed(1)}" y="${H - 9}" text-anchor="middle" class="dm-ax">${rotuloMes(k)}</text></g>`;
      }).join('');
      evo = `<svg class="dm-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Venda e lucro por mês">${grade}${grupos}</svg><div class="legend"><span><i style="background:#2e75b6"></i>Venda</span><span><i style="background:#4caf66"></i>Lucro</span></div>`;
    }
    const evoCard = `<div class="card"><h3>${icon('calendar', 'sm')}<span class="grow">Evolução por mês</span></h3>${evo}</div>`;

    // margem por pregão ganho
    const mg = gan.filter((o) => o.x.margem != null).sort((a, b) => b.x.margem - a.x.margem).slice(0, 8);
    const corM = (v) => (v >= 0.35 ? '#4caf66' : v >= 0.15 ? '#e0a800' : '#e07a5f');
    const mgHtml = mg.length ? mg.map((o) => {
      const tip = 'Nº ' + o.p.numero + ' · ' + o.p.orgao + ' · margem ' + C.pct(o.x.margem, 1) + ' · lucro ' + C.brl0(o.x.lucro);
      return `<button type="button" class="fn-row" data-act="abrir-pregao" data-id="${o.p.id}" data-tip="${esc(tip)}"><span class="fn-l"><small>Nº ${esc(o.p.numero)}</small><span class="ell" style="display:block">${esc(o.p.orgao)}</span></span><span class="fn-bar"><i style="width:${Math.max(2, Math.min(100, o.x.margem / 0.6 * 100)).toFixed(1)}%;--c:${corM(o.x.margem)}"></i></span><span class="fn-n"><b>${C.pct(o.x.margem, 0)}</b></span></button>`;
    }).join('') : '<p class="muted small">Sem pregões ganhos com margem calculada neste período.</p>';
    const mgCard = `<div class="card"><h3>${icon('painel', 'sm')}<span class="grow">Margem por pregão ganho</span></h3>${mgHtml}</div>`;

    // órgãos que mais compram
    const orgs = {};
    gan.forEach((o) => { const g = orgs[o.p.orgao] || (orgs[o.p.orgao] = { venda: 0, n: 0 }); g.venda += o.x.venda || 0; g.n += 1; });
    const top = Object.entries(orgs).sort((a, b) => b[1].venda - a[1].venda).slice(0, 5);
    const mxO = Math.max(1, ...top.map(([, g]) => g.venda));
    const orgHtml = top.length ? top.map(([nome, g]) => {
      const tip = nome + ' · ' + C.brl0(g.venda) + ' · ' + g.n + (g.n === 1 ? ' pregão ganho' : ' pregões ganhos');
      return `<button type="button" class="fn-row${D.orgao === nome ? ' sel' : ''}" data-act="dash-filtro" data-k="orgao" data-v="${esc(nome)}" data-tip="${esc(tip)}"><span class="fn-l ell">${esc(nome)}</span><span class="fn-bar"><i style="width:${(g.venda / mxO * 100).toFixed(1)}%;--c:#2e75b6"></i></span><span class="fn-n"><b>${C.brl0(g.venda)}</b></span></button>`;
    }).join('') : '<p class="muted small">Nenhum pregão ganho neste período.</p>';
    const orgCard = `<div class="card"><h3>${icon('pregoes', 'sm')}<span class="grow">Órgãos que mais compram</span></h3>${orgHtml}</div>`;

    // lista de pregões (responde aos cliques)
    let rows = todos.slice();
    if (D.etapa) rows = rows.filter((o) => dashEtapaOk(o, D.etapa));
    if (D.orgao) rows = rows.filter((o) => o.p.orgao === D.orgao);
    if (D.mes) rows = rows.filter((o) => o.ym === D.mes);
    rows.sort((a, b) => String(b.p.sessao || '').localeCompare(String(a.p.sessao || '')) || (b.p.createdAt || 0) - (a.p.createdAt || 0));
    const mostrar = D.todos ? rows : rows.slice(0, 10);
    const linhas = mostrar.map((o) => {
      const g = o.x.ganho;
      return `<tr data-act="abrir-pregao" data-id="${o.p.id}" tabindex="0"><td>${esc(o.p.numero)}</td><td class="nw">${o.p.sessao ? esc(C.fmtSessao(o.p.sessao)) : '—'}</td><td class="ell-td">${esc(o.p.orgao)}</td><td>${badgeStatus(o.p.status)}${o.x.nPode > 0 && !g ? ' <span class="dstar" title="Itens que posso ganhar">★' + o.x.nPode + '</span>' : ''}</td><td class="num">${o.x.proposta > 0 ? C.brl0(o.x.proposta) : '—'}</td><td class="num">${g ? C.brl0(o.x.venda) : '—'}</td><td class="num">${g ? C.brl0(o.x.lucro) : '—'}</td><td class="num">${g && o.x.margem != null ? C.pct(o.x.margem, 0) : '—'}</td></tr>`;
    }).join('');
    const tabelaPregoes = `<div class="card"><h3>${icon('pregoes', 'sm')}<span class="grow">Pregões${chips.length || D.periodo !== 'tudo' ? ' filtrados' : ''} (${rows.length})</span></h3>
      ${rows.length ? `<div class="tbl-scroll"><table class="tbl dtbl"><thead><tr><th>Nº</th><th>Sessão</th><th>Órgão</th><th>Status</th><th class="num">Proposta</th><th class="num">Ganho</th><th class="num">Lucro</th><th class="num">Margem</th></tr></thead><tbody>${linhas}</tbody></table></div>${rows.length > 10 ? `<button type="button" class="btn sm ghost" style="margin-top:10px" data-act="dash-mais">${D.todos ? 'Mostrar menos' : 'Ver todos (' + rows.length + ')'}</button>` : ''}` : '<p class="muted small">Nenhum pregão com esses filtros.</p>'}</div>`;
    // modo "posso ganhar": uma linha por item, com o pregão de cada um
    let tabela = tabelaPregoes;
    if (D.pode) {
      let ir = itensPode.filter((r) => (!D.etapa || dashEtapaOk(r.o, D.etapa)) && (!D.orgao || r.o.p.orgao === D.orgao) && (!D.mes || r.o.ym === D.mes));
      ir.sort((a, b) => String(b.o.p.sessao || '').localeCompare(String(a.o.p.sessao || '')));
      const shown = D.todos ? ir : ir.slice(0, 12);
      const linhasI = shown.map((r) => {
        const c = R.iMap.get(r.it.id) || {};
        const est = c.estrelas != null ? '<span class="stars s' + c.estrelas + '" style="font-size:12px">' + '★'.repeat(c.estrelas) + '☆'.repeat(5 - c.estrelas) + '</span>' : '';
        const tag = String(r.it.itemEdital || '').trim() ? '<b>Item ' + esc(String(r.it.itemEdital).trim()) + '</b> · ' : '';
        return `<tr data-act="abrir-pregao" data-id="${r.o.p.id}" tabindex="0"><td class="ell-td">${tag}${esc(r.it.descricao)}</td><td class="ped"><b>Nº ${esc(r.o.p.numero)}</b><small>${esc(r.o.p.orgao)}</small></td><td>${badgeStatus(r.o.p.status)}</td><td class="num">${C.qtdBR(r.it.qtd)} ${esc(r.it.unidade || 'Un')}</td><td class="num">${valorItem(r.it) > 0 ? C.brl0(valorItem(r.it)) : '—'}</td><td class="num">${c.margemReal != null ? C.pct(c.margemReal, 0) + ' ' + est : '—'}</td></tr>`;
      }).join('');
      tabela = `<div class="card"><h3>${icon('check', 'sm')}<span class="grow">Itens que posso ganhar (${ir.length})</span></h3>
        ${ir.length ? `<div class="tbl-scroll"><table class="tbl dtbl"><thead><tr><th>Item</th><th>Pregão</th><th>Status</th><th class="num">Qtd</th><th class="num">Proposta</th><th class="num">Margem</th></tr></thead><tbody>${linhasI}</tbody></table></div>${ir.length > 12 ? `<button type="button" class="btn sm ghost" style="margin-top:10px" data-act="dash-mais">${D.todos ? 'Mostrar menos' : 'Ver todos (' + ir.length + ')'}</button>` : ''}` : '<p class="muted small">Nenhum item marcado como "posso ganhar" com esses filtros.</p>'}</div>`;
    }
    if (D.coloc) {
      let ic = itensColoc.filter((r) => (!D.colocTop || r.it.colocacao <= 3) && (!D.etapa || dashEtapaOk(r.o, D.etapa)) && (!D.orgao || r.o.p.orgao === D.orgao) && (!D.mes || r.o.ym === D.mes));
      ic.sort((a, b) => (a.it.colocacao - b.it.colocacao) || String(b.o.p.sessao || '').localeCompare(String(a.o.p.sessao || '')));
      const shownC = D.todos ? ic : ic.slice(0, 15);
      const linhasC = shownC.map((r) => {
        const c = R.iMap.get(r.it.id) || {}, u = c.totalVenda != null && Number(r.it.qtd) > 0 ? C.unitProposta(c, 'auto').unit : null, vv = r.it.vencedor == null || r.it.vencedor === '' ? null : Number(r.it.vencedor);
        const dif = u != null && vv ? (u - vv) / vv : null;
        const tag = String(r.it.itemEdital || '').trim() ? '<b>Item ' + esc(String(r.it.itemEdital).trim()) + '</b> · ' : '';
        return `<tr data-act="abrir-pregao" data-id="${r.o.p.id}" tabindex="0"><td><span class="coloc-badge ${r.it.colocacao === 1 ? 'c1' : r.it.colocacao <= 3 ? 'c3' : ''}">${colocTxt(r.it.colocacao)}</span></td><td class="ell-td">${tag}${esc(r.it.descricao)}</td><td class="ped"><b>Nº ${esc(r.o.p.numero)}</b><small>${esc(r.o.p.orgao)}</small></td><td>${badgeStatus(r.o.p.status)}</td><td class="num">${u != null ? C.brl(u) : '—'}</td><td class="num">${vv ? C.brl(vv) : '—'}</td><td class="num">${dif != null ? (dif >= 0 ? '+' : '') + C.pct(dif, 1) : '—'}</td></tr>`;
      }).join('');
      tabela = `<div class="card"><h3>${icon('acomp', 'sm')}<span class="grow">Itens com colocação (${ic.length})</span><button type="button" class="dpill${D.colocTop ? ' on' : ''}" data-act="dash-filtro" data-k="colocTop" data-v="3" data-tip="Só quem ficou até o 3º lugar">Até o 3º</button></h3>
        ${ic.length ? `<div class="tbl-scroll"><table class="tbl dtbl"><thead><tr><th>Lugar</th><th>Item</th><th>Pregão</th><th>Status</th><th class="num">Meu valor</th><th class="num">Vencedor</th><th class="num">Diferença</th></tr></thead><tbody>${linhasC}</tbody></table></div>${!D.todos && ic.length > 15 ? `<button type="button" class="btn sm ghost" data-act="dash-mais">Ver todos (${ic.length})</button>` : ''}` : '<p class="muted small">Nenhum item com colocação neste filtro. Digite a colocação no item (em Pregões ou na janela de edição).</p>'}
        <p class="tiny muted" style="margin-top:8px">A diferença usa o valor do vencedor que você anotou no item (se anotou). Clique na linha para abrir o pregão.</p></div>`;
    }
    return `<section class="dash m-hide">${barra}<div class="dash-top">${donutCard}${funilCard}${evoCard}</div><div class="two-col">${mgCard}${orgCard}</div>${tabela}</section>`;
  }

  // capital de giro: quanto dinheiro sai antes de receber, somando os pregões ativos (pior caso = pedirem tudo de uma vez)
  function painelCapitalHtml(R, st) {
    const cap = C.n0(st.config.capitalGiro);
    const ABERTOS = ['Falta dados', 'Analisando', 'Proposta enviada', 'Julgamento'];
    const rows = [];
    for (const pst of R.pMap.values()) {
      const p = pst.p;
      if (C.INATIVOS.includes(p.status) || !(pst.custo > 0)) continue;
      let tipo = null;
      if (pst.ganho) { if (!p.pagoEm) tipo = 'comp'; }
      else if (ABERTOS.includes(p.status)) tipo = 'poss';
      if (!tipo) continue;
      const dias = (Number(p.prazoEntregaDias) || 0) + (Number(p.pagamentoDias) || 0);
      rows.push({ p, tipo, custo: pst.custo, dias });
    }
    if (!rows.length) return '';
    rows.sort((a, b) => (a.tipo === b.tipo ? b.custo - a.custo : a.tipo === 'comp' ? -1 : 1));
    const comp = rows.filter((r) => r.tipo === 'comp').reduce((t, r) => t + r.custo, 0);
    const poss = rows.filter((r) => r.tipo === 'poss').reduce((t, r) => t + r.custo, 0);
    const tudo = comp + poss, livre = Math.max(0, cap - tudo);
    const scale = Math.max(cap, tudo) || 1, w = (x) => (Math.max(0, x) / scale * 100).toFixed(2) + '%';
    const meter = (x) => `<div class="meter ${x >= 1 ? 'red' : ''}"><div style="width:${Math.min(100, x * 100).toFixed(1)}%"></div></div>`;
    const pc = cap > 0 ? comp / cap : null, pt = cap > 0 ? tudo / cap : null;
    const nivel = !cap ? 'info' : comp > cap ? 'bad' : tudo > cap ? 'warn' : 'ok';
    const msg = !cap ? 'Informe o capital de giro em Config › Margem e entrega de carro para o app comparar.'
      : comp > cap ? `ATENÇÃO: só o que você já ganhou e ainda não recebeu passa do seu capital em ${C.brl0(comp - cap)}.`
      : tudo > cap ? `Se pedirem tudo de uma vez em todos os pregões, faltam ${C.brl0(tudo - cap)}. Registro de preços costuma pedir aos poucos: acompanhe cada pedido.`
      : 'Seu capital de giro cobre o pior caso de todos os pregões ativos.';
    const nome = (p) => `${/^preg/i.test(String(p.numero).trim()) ? esc(p.numero) : 'Nº ' + esc(p.numero)} · ${esc(p.cidadeUf || p.orgao)}`;
    return `<div class="card"><h3>Capital de giro</h3>
        <div class="stack" role="img" aria-label="Uso do capital de giro">
          <div class="seg" style="width:${w(comp)};background:#1f3864"></div><div class="seg" style="width:${w(poss)};background:#f4b183"></div><div class="seg" style="width:${w(livre)};background:#a9d18e"></div>
          ${cap > 0 && scale > cap ? `<div class="mark" style="left:${(cap / scale * 100).toFixed(2)}%"></div>` : ''}
        </div>
        <div class="legend"><span><i style="background:#1f3864"></i>Ganho, a receber ${C.brl0(comp)}</span><span><i style="background:#f4b183"></i>Em análise/disputa ${C.brl0(poss)}</span><span><i style="background:#a9d18e"></i>Livre ${C.brl0(livre)}</span>${cap > 0 ? `<span>Capital ${C.brl0(cap)}</span>` : ''}</div>
        ${cap > 0 ? `<div style="margin-top:14px" class="row between small"><b>Já comprometido</b><span>${C.pct(pc, 0)}</span></div>${meter(pc)}
        <div style="margin-top:10px" class="row between small"><b>Se pedirem tudo</b><span>${C.pct(pt, 0)}</span></div>${meter(pt)}` : ''}
        <div class="alert ${nivel}" style="margin-top:14px">${icon(nivel === 'ok' ? 'check' : nivel === 'info' ? 'info' : 'alert', 'sm')}<span>${msg}</span></div>
        <div class="kv-list trib" style="margin-top:14px">${rows.map((r) => `<div data-act="abrir-pregao" data-id="${r.p.id}" style="cursor:pointer"><span>${nome(r.p)}<span class="tiny muted" style="display:block;margin-top:2px">${r.tipo === 'comp' ? 'ganho' : 'em análise'}${r.p.entregaParcelada ? ' · parcelada' : ''}${r.dias ? ' · volta em ~' + r.dias + ' dias' : ''}</span></span><b>${C.brl0(r.custo)}</b></div>`).join('')}</div>
        <p class="tiny muted" style="margin-top:10px">Custo de compra dos itens (com frete e viagem) se pedirem tudo de uma vez. Pregão ganho conta até você marcar o pagamento recebido.</p>
      </div>`;
  }

  function renderPainel() {
    const st = store.get();
    if (!st.pregoes.some((p) => !p.deleted)) return emptyWelcome();
    const R = C.computeAll(st), m = R.mei;
    const drafts = Draft.all();
    const f = m.faturado, a = m.aFaturar, d = m.emDisputa, livre = Math.max(0, m.limite - (f + a + d));
    const scale = Math.max(m.limite, f + a + d) || 1;
    const w = (x) => (Math.max(0, x) / scale * 100).toFixed(2) + '%';
    const alertTxt = m.alerta === 'bad' ? 'ATENÇÃO: o que já está faturado + ganho passa do limite do MEI.'
      : m.alerta === 'warn' ? 'Cuidado: se você ganhar tudo o que está em disputa, passa do limite do MEI.' : 'Dentro do limite do MEI.';
    const meter = (p) => `<div class="meter ${p >= 1 ? 'red' : ''}"><div style="width:${Math.min(100, p * 100).toFixed(1)}%"></div></div>`;
    const maxV = Math.max(1, ...R.statusRows.map((r) => r.venda));
    const comp = R.comp, tot = comp.venda || 1;
    const segs = [['Custo dos produtos', comp.produtos, '#5b6b82'], ['Frete do fornecedor', comp.frete, '#e8a76b'], ['Entrega de carro', comp.entrega, '#f2cf5b'], ['Impostos', comp.impostos, '#8e6bbf'], ['Lucro', comp.lucro, '#4caf66']];
    const CIRC = 2 * Math.PI * 54;
    let acc = 0;
    const arcs = segs.map(([, v, col]) => {
      const len = Math.max(0, v) / tot * CIRC;
      const s = `<circle cx="80" cy="80" r="54" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(CIRC - len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 80 80)"/>`;
      acc += len; return s;
    }).join('');
    const margemTot = comp.venda > 0 ? comp.lucro / comp.venda : null;

    return `<div class="page">
      ${drafts.length ? `<div class="alert warn">${icon('alert', 'sm')}<div class="grow">Você tem preenchimento não salvo: ${esc(drafts.slice(0, 2).map((x) => draftDesc(x.key)).join(', '))}.</div><button class="btn sm" data-act="rascunho" data-key="${esc(drafts[0].key)}">Continuar</button></div>` : ''}
      <div class="kpis p-kpis">
        <div class="kpi" style="--c:#1f3864"><div class="l">Limite do MEI</div><div class="v" style="color:var(--ink)">${C.brl0(m.limite)}</div><div class="s">no ano de ${st.config.anoRef}</div></div>
        <div class="kpi" style="--c:#2e75b6"><div class="l">Comprometido</div><div class="v">${C.brl0(m.comprometido)}</div><div class="s">faturado + ganho · ${C.pct(m.pctComprometido, 0)}</div></div>
        <div class="kpi" style="--c:${m.saldoAgora < 0 ? '#c0392b' : '#2f7d3a'}"><div class="l">Saldo disponível</div><div class="v">${C.brl0(m.saldoAgora)}</div><div class="s">se ganhar tudo: ${C.brl0(m.saldoSeGanhar)}</div></div>
        <div class="kpi" style="--c:#b7791f"><div class="l">Lucro previsto</div><div class="v">${C.brl0(R.lucroPrevisto)}</div><div class="s">${(() => { let g = 0, d = 0; for (const x of R.pMap.values()) { if (C.INATIVOS.includes(x.p.status)) continue; if (x.ganho) g += x.lucro; else d += x.lucro; } return 'ganho ' + C.brl0(g) + ' · em disputa ' + C.brl0(d); })()}</div></div>
      </div>
      ${painelStatusStrip(R)}
      ${painelDashboardHtml(R)}
      <div class="pn-main">${painelPendenciasHtml(R)}${painelEntregasHtml(R) || `<div class="card m-hide"><h3>${icon('calendar', 'sm')}<span class="grow">Entregas e recebimentos</span></h3><p class="muted small">Nenhuma entrega ou recebimento pendente.</p></div>`}${painelCertidoesHtml(R)}</div>
      <div class="pn-low">
      ${painelResultadosHtml(R)}
      ${painelVencedorHtml(R, st)}
      <div class="card m-hide"><h3>Uso do limite do MEI</h3>
        <div class="stack" role="img" aria-label="Uso do limite">
          <div class="seg" style="width:${w(f)};background:#1f3864"></div><div class="seg" style="width:${w(a)};background:#2e75b6"></div>
          <div class="seg" style="width:${w(d)};background:#f4b183"></div><div class="seg" style="width:${w(livre)};background:#a9d18e"></div>
          ${scale > m.limite ? `<div class="mark" style="left:${(m.limite / scale * 100).toFixed(2)}%"></div>` : ''}
        </div>
        <div class="legend"><span><i style="background:#1f3864"></i>Faturado ${C.brl0(f)}</span><span><i style="background:#2e75b6"></i>A faturar ${C.brl0(a)}</span><span><i style="background:#f4b183"></i>Em disputa ${C.brl0(d)}</span><span><i style="background:#a9d18e"></i>Livre ${C.brl0(livre)}</span></div>
        <div style="margin-top:14px" class="row between small"><b>Comprometido</b><span>${C.pct(m.pctComprometido, 0)}</span></div>${meter(m.pctComprometido)}
        <div style="margin-top:10px" class="row between small"><b>Se ganhar tudo em disputa</b><span>${C.pct(m.pctComTudo, 0)}</span></div>${meter(m.pctComTudo)}
        <div class="alert ${m.alerta}" style="margin-top:14px">${icon(m.alerta === 'ok' ? 'check' : 'alert', 'sm')}<span>${alertTxt}</span></div>
        <p class="tiny muted" style="margin-top:10px">O total de cada pregão usa o lance final; sem lance, usa o valor do edital (pior caso para o teto).</p>
      </div>
      ${painelCapitalHtml(R, st)}
      <div class="card m-hide"><h3>Tributos do MEI</h3><div class="kv-list trib">
        <div><span>DAS mensal</span><b>${C.brl(R.tributos.das)} <span class="tiny muted" style="font-weight:500">fixo, não muda com as vendas</span></b></div>
        <div><span>DAS no ano (${R.tributos.meses} meses)</span><b>${C.brl(R.tributos.dasAno)}</b></div>
        <div><span>Imposto sobre vendas</span><b>${C.brl(R.tributos.impostoVenda)}${st.config.impostoPct > 0 ? ' (' + C.pct(st.config.impostoPct, 1) + ')' : ''}</b></div>
        <div><span>Imposto na compra</span><b>${C.brl(R.tributos.impostoCompra)}</b></div>
        <div><span>Lucro depois do DAS</span><b style="color:${R.tributos.lucroLiquido < 0 ? 'var(--red)' : 'var(--green)'}">${C.brl(R.tributos.lucroLiquido)}</b></div></div>
        <p class="tiny muted" style="margin-top:10px">Lucro previsto dos pregões ativos menos o DAS do ano. MEI não paga percentual sobre a venda (dentro do limite). Optante do Simples/MEI em geral não sofre retenção de IR, PIS, Cofins e CSLL do órgão público: se o órgão pedir, apresente a declaração do Anexo IV da IN RFB 1.234/2012. Ajuste em Config › Tributos.</p></div>
        <div class="card m-hide"><h3>Pregões por status</h3>${R.statusRows.map((r) => `<div class="strow${r.count ? '' : ' zero'}"><div class="row">${badgeStatus(r.status)}<span class="small muted">${r.count} pregão(ões)</span></div><b>${C.brl0(r.venda)}</b><div class="bar"><div style="width:${(r.venda / maxV * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>
      </div>`;
  }

  function pregaoCard(pst) {

    const pzCls = (pst.ganho ? ' p-venci' : '') + (!pst.ganho && !enviada && pz && (pz.nivel === 'warn' || pz.nivel === 'bad') ? ' prz-' + pz.nivel : '') + (p.status === 'Falta dados' ? ' falta-dados' : '') + (enviada ? ' enviada' : '');

    const ib = (u, ic, tip) => u ? `<a class="ib" href="${esc(u)}" target="_blank" rel="noopener noreferrer" data-act="link-externo" title="${tip}" aria-label="${tip}">${icon(ic)}</a>` : `<span class="ib off" title="${tip}: não cadastrado" aria-label="${tip}: não cadastrado">${icon(ic)}</span>`;
    const botoes = ib(url(p.link), 'pdf', 'Abrir o edital') + (p.linkModelo ? ib(url(p.linkModelo), 'copy', 'Modelo de proposta do órgão') : '') + ib(url(p.linkProposta), 'send', 'Enviar proposta e dar lances') + ib(url(p.linkLicitacao), 'globo', 'Ver a licitação no site');
    return `<article class="pcard${pzCls}" style="--gc:${corDe(p.id)};--sc:${COR_STATUS[p.status] || '#2e75b6'}" data-act="abrir-pregao" data-id="${p.id}" tabindex="0" role="button">
      <div class="row between p-hd"><span class="num" style="color:var(--gc)" title="Pregão nº ${esc(p.numero)}">${/^preg/i.test(String(p.numero).trim()) ? esc(p.numero) : 'PREGÃO Nº ' + esc(p.numero)}</span><span class="m-acts">${url(p.link) ? `<a class="ic-btn" href="${esc(url(p.link))}" target="_blank" rel="noopener noreferrer" data-act="link-externo" title="Abrir edital" aria-label="Abrir edital">${icon('pdf', 'sm')}</a>` : '<span class="ic-btn ic-vazio" aria-hidden="true"></span>'}${url(p.linkProposta) ? `<a class="ic-btn" href="${esc(url(p.linkProposta))}" target="_blank" rel="noopener noreferrer" data-act="link-externo" title="Enviar proposta" aria-label="Enviar proposta">${icon('link', 'sm')}</a>` : '<span class="ic-btn ic-vazio" aria-hidden="true"></span>'}</span>${badgeStatus(p.status)}</div>
      <h4>${esc(p.orgao).replace(/^(Prefeitura Municipal de|Prefeitura de|Município de)\s+/i, '<span class="org-pre">$1 </span>')}</h4>
      <div class="small muted row wrap" style="gap:4px 14px;align-items:center">${url(p.linkProposta) ? `<a class="btn sm lk p-prop" href="${esc(url(p.linkProposta))}" target="_blank" rel="noopener noreferrer" data-act="link-externo">${icon('link', 'sm')} Proposta</a>` : ''}${p.cidadeUf ? `<span class="row" style="gap:4px">${icon('pin', 'sm')}${esc(cidadeFmt(p.cidadeUf))}</span>` : ''}${p.sessao && (!pz || String(p.sessao) !== String(p.prazoPropostas || '')) ? `<span class="row" style="gap:4px">${icon('calendar', 'sm')}${esc(C.fmtSessao(p.sessao))}</span>` : ''}<span class="row p-nit" style="gap:4px">${icon('itens', 'sm')}${pst.itens.length ? pst.itens.length + (pst.itens.length === 1 ? ' item' : ' itens') : 'sem itens'}</span><span class="m-meta">${pst.itens.length ? pst.itens.length + (pst.itens.length === 1 ? ' item' : ' itens') : 'sem itens'}</span>${(p.obs || pst.itens.some((i) => String(i.obs || '').trim())) ? `<span class="m-meta m-obs" title="Tem observação">${icon('info', 'sm')}</span>` : ''}</div>
      ${(() => {
        const tags = [
          pz ? `<span class="prazo ${pz.nivel}">${icon(pz.nivel === 'ok' ? 'calendar' : 'alert', 'sm')}${esc(pz.texto)}</span>` : '',
          pst.ganho ? `<span class="prazo good">${icon('acomp', 'sm')}Venci ${pst.nGanhos} de ${pst.itens.length} · ${C.brl0(pst.propostaGanha)}</span>` : '',
          pst.nDesc ? `<span class="prazo bad">${icon('alert', 'sm')}${pst.nDesc} desclassificação${pst.nDesc > 1 ? 'ões' : ''} pedida${pst.nDesc > 1 ? 's' : ''}</span>` : '',
          pst.nAguard ? `<span class="prazo warn" title="Fora das contas até você marcar Venci">${pst.nAguard} aguardando resultado</span>` : '',
          pst.nPode ? `<span class="prazo good">${icon('check', 'sm')}Posso ganhar: ${pst.nPode} ${pst.nPode === 1 ? 'item' : 'itens'}</span>` : '',
          po ? `<span class="prazo ${nivelCls(po.nivel)}">${icon(po.nivel === 'bad' || po.nivel === 'warn' ? 'alert' : 'calendar', 'sm')}${esc(po.texto)}</span>` : '',
          p.modeloProprio ? `<span class="prazo warn">${icon('alert', 'sm')}Modelo próprio de proposta</span>` : '',
          p.entregaParcelada ? `<span class="prazo warn">${icon('pin', 'sm')}Entrega parcelada</span>` : '',
          pst.nSoloPreju ? `<span class="prazo bad" title="Se você ganhar só ${pst.nSoloPreju === 1 ? 'esse item' : 'um desses itens'}, a viagem de entrega fica toda nele e dá prejuízo no ${pst.nSoloPreju === 1 ? 'lance' : 'lance'} atual. Veja o mínimo em cada item.">${icon('truck', 'sm')}${pst.nSoloPreju} ${pst.nSoloPreju === 1 ? 'item dá' : 'itens dão'} prejuízo se ganhar só ${pst.nSoloPreju === 1 ? 'ele' : 'eles'}</span>` : '',
          nObsIt ? `<span class="prazo info p-obsit" title="Observações nos itens: abra o pregão para ver">${icon('info', 'sm')}${nObsIt} ${nObsIt === 1 ? 'item com observação' : 'itens com observação'}</span>` : '',
        ].filter(Boolean).join('');
        return tags ? `<div class="p-tags">${tags}</div>` : '';
      })()}
      ${p.obs ? `<div class="obsline"><span class="obs-ic">${icon('alert', 'sm')}</span><span class="obs-tx">${esc(p.obs)}</span></div>` : ''}
      <div class="p-itens">${pst.itens.length ? pst.itens.length + (pst.itens.length === 1 ? ' item' : ' itens') : 'Sem itens ainda'}</div>
      <div class="nums"><div>Venda<b>${C.brl0(pst.venda)}</b></div><div>Lucro<b>${C.brl0(pst.lucro)}</b></div><div>Margem<b>${C.pct(pst.margem, 0)}</b></div></div>
      <div class="row lkrow lkrow-ic${url(p.link) ? ' has-ed' : ''}">${botoes}</div></article>`;
  }

  function pregoesListHtml() {
    const R = C.computeAll(store.get());
    let list = [...R.pMap.values()];
    if (UI.filtro !== 'todos') list = list.filter((x) => x.p.status === UI.filtro);
    const q = UI.busca.trim().toLowerCase();
    if (q) list = list.filter((x) => (x.p.numero + ' ' + x.p.orgao + ' ' + (x.p.cidadeUf || '') + ' ' + x.itens.map((i) => i.descricao).join(' ')).toLowerCase().includes(q));
    // mesma ordem do Painel: por status e, dentro de cada status, a data mais próxima primeiro
    list.sort((a, b) => (rankStatus(a.p.status) - rankStatus(b.p.status)) || ordemPainel(a, b));
    if (!list.length) return `<div class="card empty"><p class="muted">Nenhum pregão encontrado.</p></div>`;
    // raias por status: cada uma é uma fileira que desliza para o lado (PC e celular); encerrados e concluídos num botão só
    const atvAll = list.filter((x) => !C.INATIVOS.includes(x.p.status)), ina = list.filter((x) => C.INATIVOS.includes(x.p.status)).sort(descPrimeiro);
    const raias = [['Julgamento', 'Julgamento', 'jul'], ['Aguardando empenho', 'Aguardando empenho', 'emp'], ['Venci', 'Venci', 'venci'], ['Enviadas', 'Enviadas', 'env'], ['Analisando', 'Analisando', 'ana'], ['Incompletos', 'Incompletos', 'inc'], ['Outros', 'Outros', '']].map((r) => r.concat([[]]));
    const gDe = (x) => (x.p.status === 'Julgamento' ? 0 : x.p.status === 'Aguardando empenho' ? 1 : x.ganho ? 2 : x.p.status === 'Proposta enviada' ? 3 : x.p.status === 'Analisando' ? 4 : x.p.status === 'Falta dados' ? 5 : 6);
    atvAll.forEach((x) => raias[gDe(x)][3].push(x));
    const cols = raias.filter((r) => r[3].length);
    const html = `<div class="board-nav"><button type="button" data-act="lane-prev" aria-label="Anterior">‹</button><button type="button" data-act="lane-next" aria-label="Próximo">›</button></div><div class="pq-board">${cols.map(([, t, k, arr]) => `<section class="pq-col"><div class="pq-sec ${k === 'venci' ? 'venci' : ''}"><span>${t}</span><b>${arr.length}</b></div><div class="pq-grid pq-stack">${arr.map(pregaoCard).join('')}</div></section>`).join('')}</div>`;
    const chip = (x) => `<button type="button" class="enc-chip${x.p.status === 'Concluído' ? ' conc' : ''}" data-act="abrir-pregao" data-id="${x.p.id}" title="${esc(x.p.orgao)} · ${esc(stTxt(x.p.status))}"><b>Nº ${esc(x.p.numero)}</b><span class="ell">${esc(x.p.orgao)}</span><i>${esc(stTxt(x.p.status))}</i></button>`;
    const fim = ina.length ? `<div class="enc-box"><button type="button" class="btn sm ghost enc-btn${UI.mostrarEnc ? ' on' : ''}" data-act="painel-encerrados" aria-expanded="${UI.mostrarEnc ? 'true' : 'false'}">${icon('archive', 'sm')} Encerrados e concluídos (${ina.length}) <span class="enc-seta">${UI.mostrarEnc ? '▴' : '▾'}</span></button>${UI.mostrarEnc ? `<div class="enc-chips">${ina.map(chip).join('')}</div>` : ''}</div>` : '';
    return html + fim;
  }

  // seletor "filtrar por pregão" (guia Itens)
  function fpregSel(key) {
    const R = C.computeAll(store.get());
    const ps = [...R.pMap.values()].sort((a, b) => (rankStatus(a.p.status) - rankStatus(b.p.status)) || ordemPainel(a, b));
    if (UI[key] && !ps.some((x) => x.p.id === UI[key])) UI[key] = '';
    return `<select class="input fp-sel" data-fpreg="${key}" aria-label="Filtrar por pregão"><option value="">Todos os pregões</option>${ps.map((x) => `<option value="${esc(x.p.id)}"${x.p.id === UI[key] ? ' selected' : ''}>${esc(pregaoLabel(x.p))}</option>`).join('')}</select>`;
  }
  function renderPregoes() {
    if (UI.detailId) return renderDetail();
    const st = store.get();
    if (!st.pregoes.some((p) => !p.deleted)) return emptyWelcome();
    const fl = ['todos', ...C.STATUS];
    return `<div class="page">
      <div class="search">${icon('search')}<input class="input" id="busca" type="search" placeholder="Buscar por número, órgão ou item" value="${esc(UI.busca)}"></div>
      <div class="filters">${fl.map((s) => `<button data-act="filtro" data-v="${esc(s)}" class="${UI.filtro === s ? 'on' : ''}">${s === 'todos' ? 'Todos' : esc(stTxt(s))}</button>`).join('')}</div>
      <div id="plist">${pregoesListHtml()}</div></div>
      <button class="fab" data-act="novo-pregao" aria-label="Novo pregão">${icon('plus')}</button>`;
  }

  // itens sempre na ordem do edital (04, 10, 4A…); sem número ficam no fim, na ordem de cadastro
  // itens sempre na ordem do edital: lote e depois item
  const porItemEdital = (list) => C.ordemLoteItem(list);

  // cor da avaliação no preço que vai na proposta (lance; sem lance, o teto)
  const viabCls = (c) => (c && c.viabTipo) || (c && c.sitTipo === 'bad' ? 'bad' : '');
  const viabLinha = (c) => (c && c.viab && c.margemReal != null) ? `<div class="tiny mb-viab">${c.lance !== null ? 'No seu lance' : 'No teto'}: ${C.pct(c.margemReal, 0)} de lucro (${C.brl(c.lucro)}) · ${esc(c.viab)}</div>` : '';
  function estrelasHtml(c) {
    if (!c || c.estrelas == null) return '';
    const n = c.estrelas, nota = c.nota != null ? c.nota : n;
    const tip = `Nota ${String(nota).replace('.', ',')} de 5 · ${c.viab || ''} · lucro ${C.pct(c.margemReal, 0)} sobre a venda (${C.brl(c.lucro)})`;
    // PC: 5 estrelas + % + avaliação · celular: uma estrela que vai enchendo, com a nota na frente
    const fill = Math.max(0, Math.min(100, nota / 5 * 100)).toFixed(0);
    return `<span class="stars s${n} st-full" title="${esc(tip)}">${'★'.repeat(n)}${'☆'.repeat(5 - n)}<small>${C.pct(c.margemReal, 0)}${c.viab ? ' · ' + c.viab : ''}</small></span>`
      + `<span class="st-one ${c.viabTipo || ''}" title="${esc(tip)}"><b>${String(nota.toFixed ? nota.toFixed(1) : nota).replace('.', ',')}</b><i style="--f:${fill}%">★</i></span>`;
  }
  // itens que ficaram de fora da disputa vão para o fim da lista
  const foraNoFim = (list, R) => list.slice().sort((a, b) => ((R.iMap.get(a.id) || {}).fora ? 1 : 0) - ((R.iMap.get(b.id) || {}).fora ? 1 : 0));

  // bloco em destaque do item: com lance = o lucro no lance; sem lance = o mínimo pela meta, já contando que ganhe só este item
  function destaqueInfo(c) {
    if (c.lance !== null) {
      const cls = c.lucro == null ? '' : c.lucro <= 0 ? 'bad' : (c.viabTipo || 'ok');
      return { com: true, cls, titulo: 'Meu lucro no lance', curto: 'Lucro ' + (c.margemReal != null ? C.pct(c.margemReal, 0) : ''), valor: c.lucro != null ? C.brl(c.lucro) : '—',
        sub: `lance ${C.brl(c.lance)} · ${C.pct(c.margemReal, 1)} sobre a venda${c.viab ? ' · ' + esc(c.viab) : ''} · custo final ${C.brl(c.custoUnit)}` };
    }
    // mínimo ganhando só este, mas só se couber no teto (lance acima do teto não é permitido)
    const cabe = (v) => v != null && (c.teto == null || v <= c.teto + 0.004);
    const solo = soloMin(c) != null ? c.solo : null;
    let min = c.minimo, curto = 'Mínimo ' + C.pct(c.margem, 0), cls, sub;
    if (solo && cabe(solo.minimo)) { min = solo.minimo; curto += ' só este'; sub = `meta ${C.pct(c.margem, 0)} · se ganhar só este item (viagem toda nele) · junto com os outros: ${C.brl(c.minimo)}`; cls = 'ok'; }
    else if (solo && cabe(solo.empate)) { min = solo.empate; curto = 'Mín. sem prejuízo'; sub = `se ganhar só este item, a meta de ${C.pct(c.margem, 0)} não cabe no teto: este é o mínimo sem prejuízo · junto com os outros (meta): ${C.brl(c.minimo)}`; cls = 'warn'; }
    else if (solo) { sub = `meta ${C.pct(c.margem, 0)} junto com os outros itens · <b>sozinho não compensa</b> (prejuízo mesmo no teto)`; cls = min != null && c.teto != null && min > c.teto ? 'bad' : 'warn'; }
    else { sub = `meta ${C.pct(c.margem, 0)} · custo final ${C.brl(c.custoUnit)}`; cls = min == null || c.teto == null ? '' : min > c.teto ? 'warn' : 'ok'; }
    return { com: false, cls, titulo: 'Valor mínimo p/ proposta (unit.)', curto, valor: min != null ? C.brl(min) : '—', sub };
  }
  // bloco único de decisão do item: conclusão (seguro / abaixo da meta / risco), lance mínimo e o lucro ganhando só este x junto com os outros
  function decisao(c) {
    const cabe = (v) => v != null && (c.teto == null || v <= c.teto + 0.004);
    const s = soloMin(c) != null ? c.solo : null;
    const comLance = c.lance !== null, ref = comLance ? 'no lance' : 'pelo teto';
    let tipo, txt, min, minSub;
    if (!s) {
      min = c.minimo; minSub = 'meta ' + C.pct(c.margem, 0); tipo = min == null || c.teto == null ? '' : min > c.teto ? 'warn' : 'ok'; txt = tipo === 'warn' ? 'Atenção: a meta de ' + C.pct(c.margem, 0) + ' não cabe no teto' : tipo === 'ok' ? 'Seguro: cobre a meta' : '';
      if (tipo === 'warn') { const emp = c.custoUnit != null ? Math.ceil(c.custoUnit * 100 - 1e-6) / 100 : null; if (cabe(emp)) { min = emp; minSub = 'sem prejuízo (a meta não cabe no teto)'; } else { min = null; tipo = 'bad'; txt = 'Risco: dá prejuízo mesmo vendendo pelo teto'; } }
    }
    else if (cabe(s.minimo)) { tipo = 'ok'; min = s.minimo; minSub = 'meta ' + C.pct(c.margem, 0) + ', mesmo ganhando só este'; txt = 'Seguro: mesmo ganhando só este item, cobre a viagem e a meta'; }
    else if (cabe(s.empate)) { tipo = 'warn'; min = s.empate; minSub = 'sem prejuízo ganhando só este'; txt = 'Atenção: ganhando só este, não dá prejuízo, mas fica abaixo da meta de ' + C.pct(c.margem, 0); }
    else { tipo = 'bad'; min = null; minSub = 'nem o teto cobre se ganhar só este'; txt = 'Risco: se ganhar só este item, dá prejuízo mesmo vendendo pelo teto'; }
    const q = c.qtd || 0;
    const solo = s ? (comLance ? s.lucro : s.lucroTeto) : null;
    const junto = comLance ? c.lucro : (c.teto != null ? c.lucro : null);
    // com lance, a conclusão é pelo lance (não pelo teto)
    if (comLance && s) {
      if (s.lucro <= 0) { tipo = 'bad'; txt = 'Risco: com este lance, se ganhar só este item, dá prejuízo'; }
      else if (s.margemReal < c.margem - 0.0005) { tipo = 'warn'; txt = 'Atenção: com este lance, ganhando só este, tem lucro, mas abaixo da meta de ' + C.pct(c.margem, 0); }
      else { tipo = 'ok'; txt = 'Seguro: com este lance, mesmo ganhando só este, cobre a viagem e a meta'; }
    } else if (comLance) { tipo = c.lucro == null ? '' : c.lucro <= 0 ? 'bad' : c.margemReal < c.margem - 0.0005 ? 'warn' : 'ok'; txt = tipo === 'bad' ? 'Risco: este lance dá prejuízo' : tipo === 'warn' ? 'Atenção: este lance fica abaixo da meta de ' + C.pct(c.margem, 0) : tipo === 'ok' ? 'Seguro: este lance cobre a meta' : ''; }
    return { tipo, txt, min, minSub, minTot: min != null ? Math.round(min * q * 100) / 100 : null, ref, comLance, solo, junto, s };
  }
  // lance mínimo seguro (nunca acima do teto) para tabelas e listas
  const minSegTxt = (c) => { if (!c) return '—'; const d = decisao(c); return d.min != null ? C.brl(d.min) : '<span class="neg-tx">Não compensa</span>'; };
  function decisaoHtml(c) {
    const d = decisao(c);
    const ic = d.tipo === 'ok' ? 'check' : 'alert';
    const val = (v) => v == null ? '—' : v <= 0 ? '<span class="neg">prejuízo ' + C.brl(-v) + '</span>' : C.brl(v);
    const tip = d.s ? `Ganhando só este, a entrega de carro fica toda nele: ${C.brl(d.s.entrega)} (no rateio: ${C.brl(d.s.entrega - d.s.extra)}).` : '';
    return `<div class="dec ${d.tipo}${d.comLance ? ' com-lance' : ''}" title="${esc(tip)}">
      ${d.txt ? `<div class="dec-hd">${icon(ic, 'sm')}<span>${d.txt}</span></div>` : ''}
      <div class="dec-cols">
        <div class="dec-min"><small>Lance mínimo (unit.)</small><b>${d.min != null ? C.brl(d.min) : '<span class="neg">Não compensa</span>'}</b><em>${esc(d.minSub)}</em></div>
        ${d.s ? `<div class="dec-l dec-solo"><small>Lucro ${d.ref}, ganhando só este</small><b>${val(d.solo)}</b><em>viagem toda neste item</em></div>` : ''}
        <div class="dec-l"><small>Lucro ${d.ref}${d.s ? ', junto com os outros' : ''}</small><b>${val(d.junto)}</b><em>${d.comLance ? C.pct(c.margemReal, 0) + ' sobre a venda' : c.margemReal != null ? C.pct(c.margemReal, 0) + ' sobre a venda' : ''}${c.impostoTotal > 0 ? ' · impostos ' + C.brl(c.impostoTotal) : ''}</em></div>
      </div></div>`;
  }
  function destaqueHtml(c) {
    const d = destaqueInfo(c);
    return `<div class="minbox i-min ${d.cls}${d.com ? ' mb-lucro' : ''}"><div><div class="t">${d.titulo}</div><div class="tiny muted">${d.sub}</div></div><div class="v">${d.valor}</div></div>`;
  }

  // lance abaixo do mínimo "se ganhar só este" (sem prejuízo): pede confirmação e fica vermelho
  const soloMin = (c) => (c && c.solo && c.solo.relevante && c.solo.empate != null && !c.ganhou && !c.desclass && c.resultado !== 'perdi') ? c.solo.empate : null;
  const abaixoSolo = (c, v) => { const m = soloMin(c); return m != null && v != null && v > 0 && v < m - 0.004; };
  const avisoSoloTxt = (c, v) => `O lance de ${C.brl(v)} está abaixo do mínimo para ganhar só este item (${C.brl(soloMin(c))}). Se for o único item ganho, a entrega de carro fica toda nele e dá prejuízo, e você pode ter que pedir desclassificação.`;

  // se ganhar só este item, ele paga a viagem inteira: lance mínimo sem prejuízo e com a margem
  function soloHtml(c) {
    const s = c && c.solo;
    if (!s || !s.relevante || c.ganhou || c.resultado === 'perdi' || c.desclass) return '';
    const q = c.qtd || 0, un = String(c.unidade || 'un').toLowerCase(), tot = (v) => (v == null ? null : Math.round(v * q * 100) / 100);
    const cabe = (v) => v != null && (c.teto == null || v <= c.teto + 0.004);   // lance acima do teto não é permitido: valor acima dele não serve
    const tip = `Se este for o único item ganho, ele paga sozinho a entrega de carro (${C.brl(s.entrega)}, ${C.brl(s.extra)} a mais que no rateio). Custo total ${C.brl(s.custoTotal)}.`;
    const hd = `${icon('truck', 'sm')}<span class="solo-t"><span class="s-lg">Se ganhar só este · total ${C.qtdBR(q)} ${esc(un)}</span><span class="s-sm">Só este</span></span>`;
    const resLance = c.lance !== null ? `<span class="solo-lc">no seu lance: <b>${s.lucro <= 0 ? 'prejuízo ' + C.brl(-s.lucro) : C.brl(s.lucro) + ' (' + C.pct(s.margemReal, 0) + ')'}</b></span>` : '';
    if (!cabe(s.empate)) {
      return `<div class="solo bad" title="${esc(tip)}">${hd}<span class="solo-v"><span><b>não compensa</b>: prejuízo de <b>${C.brl(-(s.lucroTeto || 0))}</b> mesmo vendendo pelo teto (${C.brl(tot(c.teto))})</span>${c.lance !== null && c.lance < c.teto - 0.004 ? resLance : ''}</span></div>`;
    }
    const mg = cabe(s.minimo) ? `<span class="solo-mg">margem ${C.pct(c.margem, 0)} <b>${C.brl(tot(s.minimo))}</b> <small class="solo-un">(${C.brl(s.minimo)}/${esc(un)})</small></span>` : '';
    const res = c.lance !== null ? resLance : `<span class="solo-lc">vendendo pelo teto: <b>${s.lucro <= 0 ? 'prejuízo ' + C.brl(-s.lucro) : C.brl(s.lucro) + ' (' + C.pct(s.margemReal, 0) + ')'}</b></span>`;
    return `<div class="solo ${s.risco}" title="${esc(tip)}">${hd}
      <span class="solo-v"><span>sem prejuízo <b>${C.brl(tot(s.empate))}</b> <small class="solo-un">(${C.brl(s.empate)}/${esc(un)})</small></span>${mg}${res}</span>${c.lance !== null && abaixoSolo(c, c.lance) ? `<span class="solo-alerta">${icon('alert', 'sm')}Seu lance (${C.brl(c.lance)}) está abaixo do mínimo sem prejuízo</span>` : ''}</div>`;
  }

  function itemCard(it, c, opt) {
    const p = opt.pst && opt.pst.p;
    const _lt = C.padLE(it.loteEdital), _it = C.padLE(it.itemEdital);
    const tag = (_lt || _it) ? `<span class="itag">${_lt ? 'Lote ' + esc(_lt) + (_it ? ' · ' : '') : ''}${_it ? 'Item ' + esc(_it) : ''}</span>` : '<span class="itag vazio">Item s/nº</span>';
    // descrição numa linha própria, logo abaixo do nº do item; longa termina com "…" (o texto todo aparece ao passar o dedo/mouse)
    const desc = `<h4 class="i-desc" title="${esc(it.descricao)}">${esc(it.descricao)}</h4>`;
    // editar só pelo lápis (clicar no cartão não abre mais a edição)
    const btnEditar = `<button type="button" class="ic-btn i-edit" data-act="editar-item" data-id="${it.id}" title="Editar item" aria-label="Editar item">${icon('edit', 'sm')}</button>`;
    if (c.fora) {
      return `<article class="icard fora" data-id="${it.id}">
        <div class="i-hd">${tag}<div class="rcol"><span class="badge off">Fora da disputa</span>${btnEditar}</div></div>${desc}
        <div class="icard-actions"><button type="button" class="btn sm ghost" data-act="item-fora" data-id="${it.id}">Voltar para a disputa</button></div></article>`;
    }
    const ganhoMode = false;
    const cps = comprasDoItem(it);
    const compra = cps.length ? `<div class="comprar">${cps.map((cp) => {
      const custo = cp.custo != null ? ' · ' + C.brl(cp.custo) : '';
      const nm = cp.label || cp.nome || 'Comprar';
      return cp.href
        ? `<a class="btn sm lk comprar-btn${cp.usada ? ' usada' : ''}${cp.barato ? ' barato' : ''}" href="${esc(cp.href)}" target="_blank" rel="noopener noreferrer" data-act="link-externo" title="${esc((cp.usada ? 'Vou comprar em ' : 'Opção: ') + nm + custo)}" aria-label="${esc('Comprar em ' + nm)}">${icon('cart', 'sm')}<span class="ell">${esc(nm)}${custo}</span></a>`
        : `<span class="chip${cp.usada ? ' usada' : ''}">${icon('pin', 'sm')}${esc(cp.nome)}${custo}</span>`;
    }).join('')}</div>` : '';
    const venc = Number(it.vencedor) > 0 ? `<div><span class="chip venc">${icon('alert', 'sm')}Venceu por ${C.brl(it.vencedor)}</span></div>` : '';
    const obs = String(it.obs || '').trim() ? `<div class="obsline item">${esc(it.obs)}</div>` : '';
    // celular: valor do meu lance (lance final; vazio = teto do edital) e mínimo pela margem
    const meuLance = C.unitProposta(c, 'auto').unit;   // mesma regra do PDF: lance final prevalece; sem lance, o teto do edital
    const baixo = abaixoSolo(c, meuLance) ? ' solo-baixo' : '', baixoTip = baixo ? ` title="${esc('Abaixo do mínimo se ganhar só este item: ' + C.brl(soloMin(c)))}"` : '';
    const dc = decisao(c);
    const mVals = `<div class="i-mvals"><div class="v-lance${baixo}"${baixoTip}><span>${c.lance !== null ? 'Meu lance' : 'Meu lance (teto)'}</span><b>${meuLance != null ? C.brl(meuLance) : '—'}</b></div><div class="v-min ${dc.tipo}"><span>Lance mínimo</span><b>${dc.min != null ? C.brl(dc.min) : 'Não compensa'}</b></div></div>`;
    const vals = mVals + `<div class="i-vals"><div class="v-lance-pc ${viabCls(c)}${baixo}"${baixoTip}><span>${c.lance !== null ? 'Meu lance (unit.)' : 'Meu lance (teto)'}</span><b>${meuLance != null ? C.brl(meuLance) : '—'}</b></div><div><span>Custo total</span><b>${it.custo > 0 && it.qtd > 0 ? C.brl(c.produtos) : '—'}</b></div><div class="v-mintot"><span>Mín. total</span><b>${dc.minTot != null ? C.brl(dc.minTot) : '—'}</b></div><div><span>Edital total</span><b>${c.tetoTotal != null ? C.brl(c.tetoTotal) : '—'}</b></div></div>`;
    // resultado do item: seletor (toque de novo no mesmo volta para "aguardando")
    const RES = [['venci', 'Venci', 'acomp'], ['perdi', 'Não ganhei', 'x'], ['desc', 'Desclassif.', 'alert']];
    const acao = `<div class="res-sel" role="group" aria-label="Resultado do item">${RES.map(([v, l, ic]) => `<button type="button" class="btn sm res-${v}${c.resultado === v ? ' on' : ''}" data-act="item-res" data-v="${v}" data-id="${it.id}" title="${c.resultado === v ? 'Desmarcar ' + l : l}" aria-label="${l}">${icon(ic, 'sm')}${c.resultado === v ? '<span>' + l + '</span>' : ''}</button>`).join('')}</div>`
      + (c.ganhou || c.resultado === 'perdi' || c.desclass ? '' : `<div class="res-sel"><button type="button" class="btn sm${it.possivelGanhar ? ' pode-on' : ''}" data-act="item-pode" data-id="${it.id}" title="${it.possivelGanhar ? 'Desmarcar Posso ganhar' : 'Posso ganhar'}" aria-label="Posso ganhar">${icon('star', 'sm')}${it.possivelGanhar ? '<span>Posso ganhar</span>' : ''}</button><button type="button" class="btn sm" data-act="item-fora" data-id="${it.id}" title="Deixar de fora da disputa" aria-label="Deixar de fora">${icon('fora', 'sm')}</button></div>`);
    const resBadge = c.resultado === 'venci' ? '<span class="badge ok">Venci</span>' : c.resultado === 'desc' ? `<span class="badge bad" title="${esc('Pedido em ' + C.fmtSessao(it.desclassEm || '') + (it.desclassMotivo ? ' · ' + it.desclassMotivo : ''))}">Desclassif.</span>` : c.resultado === 'perdi' ? '<span class="badge off">Não ganhei</span>' : c.resultado === 'aguard' ? '<span class="badge warn" title="Fora das contas até você marcar Venci">Aguardando</span>' : '';
    const descLinha = c.desclass ? `<div class="obsline desc-line">${icon('alert', 'sm')}<span>Desclassificação pedida em ${esc(C.fmtSessao(it.desclassEm || ''))}${it.desclassMotivo ? ' · ' + esc(it.desclassMotivo) : ''}</span></div>` : '';
    return `<article class="icard${c.naoGanhou && !it.possivelGanhar && !c.aguardando && !c.desclass ? ' nao-ganho' : ''}${c.ganhou ? ' venci' : ''}${c.resultado ? ' res-' + c.resultado : ''}" data-id="${it.id}">
      <div class="i-hd">${tag}<div class="rcol">${resBadge}${it.possivelGanhar && !ganhoMode ? '<span class="prazo good">★ Posso ganhar</span>' : ''}${c.situacao ? `<span class="badge ${c.sitTipo}" title="${esc(c.situacao)}"><span class="s-lg">${esc(c.situacao)}</span><span class="s-sm">${esc(c.sitCurta || c.situacao)}</span></span>` : ''}${estrelasHtml(c)}${btnEditar}</div></div>
      ${desc}
      ${opt.showOrg && p ? `<div class="chips"><span class="chip org">#${esc(p.numero)} · ${esc(p.orgao)}</span></div>` : ''}
      <div class="small muted i-meta"><span class="i-meta-tx">${C.qtdBR(it.qtd)} ${esc(it.unidade || 'Un')} · custo ${c.divisao ? C.brl(c.custoCompra) + ' (média de ' + c.divisao.partes.length + ' fornecedores)' : C.brl(it.custo)}<span class="i-teto"> · teto ${C.brl(c.teto)}</span>${it.marca ? ' · ' + esc(it.marca) : ''}</span>${(() => { const nf = Number(it.fotosN) || 0; return `<button type="button" class="foto-tag hide-m ${nf ? 'tem' : 'sem'}" data-act="cat-ir" data-id="${it.id}" title="${nf ? 'Tem foto no catálogo. Clique para ver.' : 'Sem foto no catálogo. Clique para incluir.'}">${icon('image', 'sm')}${nf ? nf + (nf === 1 ? ' foto' : ' fotos') : 'Sem foto'}</button>`; })()}</div>
      ${vals}
      ${obs}
      ${descLinha}
      ${venc}
      ${decisaoHtml(c)}
      ${p && !c.fora && !c.ganhou && (p.status === 'Julgamento' || it.possivelGanhar || it.colocacao || c.resultado === 'perdi' || c.naoGanhou || ['Perdeu', 'Desclassificado', 'Aguardando empenho', 'Faturado', 'Concluído'].includes(p.status) || (p.sessao && (diasDesde(p.sessao) || 0) >= 0)) ? `<div class="coloc-row">${colocacaoInput(it)}${it.colocacao ? `<span class="coloc-badge ${it.colocacao === 1 ? 'c1' : it.colocacao <= 3 ? 'c3' : ''}">${colocTxt(it.colocacao)} lugar</span>` : ''}</div>` : ''}
      ${p && ['Julgamento', 'Proposta enviada'].includes(p.status) && !['perdi', 'desc'].includes(c.resultado) ? simLanceHtml(it, c, meuLance) : ''}
      <div class="icard-actions">${compra}${acao}</div></article>`;
  }

  /* ---------- simulador de lance (na disputa): calcula na hora, só grava com 2 confirmações ---------- */
  function simCalc(it, v) {
    if (!(v > 0)) return null;
    return C.previewItem(store.get(), Object.assign({}, it, { lanceFinal: v }));
  }
  function simResHtml(it, v) {
    const c = simCalc(it, v);
    if (!c) return '<span class="tiny muted">Digite um valor unitário para ver lucro, margem e viabilidade. Nada é salvo.</span>';
    const nota = c.nota != null ? String(c.nota.toFixed(1)).replace('.', ',') : '—';
    const fill = c.nota != null ? Math.max(0, Math.min(100, c.nota / 5 * 100)).toFixed(0) : 0;
    const dm = decisao(c).min;
    const vsMin = dm != null ? (v >= dm - 0.004 ? `acima do lance mínimo (${C.brl(dm)})` : `<b>${C.brl(dm - v)} abaixo</b> do lance mínimo (${C.brl(dm)})`) : '<b>não compensa ganhar só este item</b>';
    const vsTeto = c.teto != null && v > c.teto ? ` · <b class="sim-acima">acima do teto (${C.brl(c.teto)})</b>` : '';
    return `<div class="sim-kpis ${c.viabTipo || ''}">
        <div><span>Total</span><b>${C.brl(c.totalVenda)}</b></div>
        <div><span>Lucro</span><b>${C.brl(c.lucro)}</b></div>
        <div><span>Margem</span><b>${C.pct(c.margemReal, 1)}</b></div>
        <div class="sim-nota"><span>Avaliação</span><b><i style="--f:${fill}%">★</i> ${nota} · ${esc(c.viab || '')}</b></div></div>
      <div class="tiny muted sim-ref">${vsMin}${vsTeto}</div>${abaixoSolo(c, v) ? `<div class="solo-alerta">${icon('alert', 'sm')}Abaixo do mínimo se ganhar só este item (${C.brl(soloMin(c))}): sozinho dá prejuízo</div>` : ''}`;
  }
  function simLanceHtml(it, c, meuLance) {
    const v = UI.sim[it.id] || '';
    const atual = c.lance !== null ? 'lance gravado ' + C.brl(c.lance) : 'sem lance gravado (vale o teto ' + C.brl(meuLance) + ')';
    return `<div class="sim" data-act="noop">
      <div class="sim-hd"><b>${icon('acomp', 'sm')} Simular lance</b><span class="tiny muted">${atual} · simulação não altera a proposta</span></div>
      <div class="sim-row"><span class="sim-rs">R$</span><input class="input${v && abaixoSolo(simCalc(it, C.parseBR(v)), C.parseBR(v)) ? ' solo-baixo' : ''}" inputmode="decimal" autocomplete="off" data-sim="${it.id}" value="${esc(v)}" placeholder="valor unitário">
        <button type="button" class="btn sm ghost" data-act="sim-limpar" data-id="${it.id}" title="Limpar simulação">${icon('x', 'sm')}</button>
        <button type="button" class="btn sm primary" data-act="sim-gravar" data-id="${it.id}" ${C.parseBR(v) > 0 ? '' : 'disabled'}>Gravar lance</button></div>
      <div class="sim-res" data-sim-res="${it.id}">${simResHtml(it, C.parseBR(v))}</div></div>`;

  async function gravarLanceSimulado(id) {
    const it = store.get().itens.find((i) => i.id === id && !i.deleted); if (!it) return;
    const v = C.parseBR(UI.sim[id]); if (!(v > 0)) { toast('Digite o valor do lance'); return; }
    const c = simCalc(it, v), antes = it.lanceFinal != null ? C.brl(it.lanceFinal) : 'nenhum (vale o teto)';
    const nome = (C.padLE(it.itemEdital) ? 'Item ' + C.padLE(it.itemEdital) + ' · ' : '') + it.descricao;
    if (abaixoSolo(c, v) && !(await confirmar('Lance abaixo do mínimo', nome + '\n' + avisoSoloTxt(c, v) + '\nContinuar mesmo assim?', 'Continuar mesmo assim', true))) return;
    const ok1 = await confirmar('Gravar este lance?', `${nome}\nNovo lance: ${C.brl(v)} (total ${C.brl(c && c.totalVenda)})\nLucro ${C.brl(c && c.lucro)} · margem ${C.pct(c && c.margemReal, 1)} · ${c && c.viab ? c.viab : ''}\nLance atual: ${antes}`, 'Sim, continuar', false);
    if (!ok1) return;
    const ok2 = await dialog({ title: 'Confirmação final', text: `O lance de ${C.brl(v)} vai substituir o valor do item e entra na proposta (PDF). Confirma?`, buttons: [{ label: 'Cancelar', value: false, cls: 'ghost' }, { label: 'Confirmo, gravar ' + C.brl(v), value: true, cls: 'primary' }] });
    if (!ok2) return;
    UI.keepScroll = true; delete UI.sim[id];
    store.upsertItem({ id, lanceFinal: v });
    toast('Lance gravado: ' + C.brl(v));

  function openGanhosForm(id) {
    const st = store.get();
    const itens = porItemEdital(st.itens.filter((i) => i.pregaoId === id && !i.deleted && !i.semLance));
    if (!itens.length) return;
    const values = {}, R0 = C.computeAll(st);
    itens.forEach((i) => { values['g_' + i.id] = !!(R0.iMap.get(i.id) || {}).ganhou; });
    openForm({
      key: 'ganhos:' + id,
      title: 'Quais itens você ganhou?',
      values,
      body: `<p class="small muted" style="margin-bottom:10px">Marque os itens que você ganhou. Os desmarcados ficam fora das contas e das estatísticas.</p>
        <div class="row" style="gap:8px;margin-bottom:12px"><button type="button" class="btn sm ghost" data-g-todos="1">Marcar todos</button><button type="button" class="btn sm ghost" data-g-todos="0">Desmarcar todos</button></div>
        <div class="formgrid">${itens.map((i) => `<div class="full"><label class="switch"><span>${String(i.itemEdital || '').trim() ? '<b>Item ' + esc(String(i.itemEdital).trim()) + '</b> · ' : ''}${esc(i.descricao)}<small class="hint" style="display:block;font-weight:500">${C.qtdBR(i.qtd)} ${esc(i.unidade || 'Un')}</small></span><input type="checkbox" name="g_${i.id}"${i.naoGanhou ? '' : ' checked'}></label></div>`).join('')}</div>`,
      saveLabel: 'Salvar',
      onMount: (form) => {
        form.addEventListener('click', (e) => {
          const b = e.target.closest('[data-g-todos]'); if (!b) return;
          form.querySelectorAll('input[type=checkbox]').forEach((c) => { c.checked = b.dataset.gTodos === '1'; });
          form.dispatchEvent(new Event('input', { bubbles: true }));
        });
      },
      onSave: (x) => {
        let n = 0;
        itens.forEach((i) => { const ganhou = !!x['g_' + i.id]; if (ganhou) n += 1; store.patchItem(i.id, (it) => { it.ganhou = ganhou; if (ganhou) it.possivelGanhar = false; }); });
        ajustarStatusAoGanhar(id, n > 0);
        toast(n === itens.length ? 'Todos os itens ganhos' : n + ' de ' + itens.length + ' itens ganhos');

      },

  // ao mudar o status para Ganhou/Faturado, pergunta quais itens foram ganhos (se houver mais de um)
  function perguntarItensGanhos(id, statusAntes) {
    const p = store.get().pregoes.find((x) => x.id === id);
    // marcou Faturado sem nenhum item ganho: pergunta quais itens foram ganhos
    if (!p || !['Faturado', 'Aguardando empenho'].includes(p.status) || statusAntes === p.status || ganhoDe(id)) return;
    const n = store.get().itens.filter((i) => i.pregaoId === id && !i.deleted && !i.semLance).length;
    if (n >= 1) setTimeout(() => openGanhosForm(id), 400);
  }

  // entrega parcelada: aviso com a conta do capital de giro (pior caso = pedirem tudo de uma vez)
  function parceladaHtml(p, pst) {
    const cfg = store.get().config, cap = C.n0(cfg.capitalGiro);
    const custo = pst ? pst.custo : 0;
    const dE = Number(p.prazoEntregaDias) || 0, dP = Number(p.pagamentoDias) || 0;
    const volta = dE || dP ? ` O dinheiro volta cerca de <b>${dE + dP} dias</b> depois de cada pedido (${dE ? dE + ' para entregar' : 'prazo de entrega não informado'} + ${dP ? dP + ' para pagar' : 'prazo de pagamento não informado'}).` : '';
    let comp = '';
    if (custo > 0 && cap > 0) comp = cap >= custo
      ? `<br>Seu capital de giro (${C.brl(cap)}) cobre o pior caso.`
      : `<br><b>Seu capital de giro (${C.brl(cap)}) não cobre o pior caso: faltam ${C.brl(custo - cap)}.</b> Dá para atender só pedidos de até ${C.brl(cap)} por vez.`;
    else if (custo > 0) comp = '<br><span class="small">Informe o capital de giro em Config para o app comparar.</span>';
    return `<div class="alert warn" style="margin-bottom:10px">${icon('pin', 'sm')}<div class="grow"><b>Entrega parcelada:</b> o órgão pede aos poucos, conforme a necessidade.${p.entregaParceladaObs ? '<br><span style="white-space:pre-wrap">' + esc(p.entregaParceladaObs) + '</span>' : ''}
      <br><b>Capital de giro:</b> se pedirem tudo de uma vez, a compra sai cerca de <b>${C.brl(custo)}</b> (custo dos itens em disputa, com frete e viagem).${volta}${comp}
      <br><span class="small">Comprar tudo antes para garantir o preço deixa o dinheiro parado até a última entrega. Cada pedido também é uma viagem: confira o nº de viagens.</span></div></div>`;
  }
