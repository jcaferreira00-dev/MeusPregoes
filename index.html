    const t = e.target.closest('[data-act]');
    if (!t) return;
    const a = t.dataset.act, id = t.dataset.id;
    switch (a) {
      case 'tab': setTab(t.dataset.v); break;
      case 'novo-pregao': openPregaoForm(); break;
      case 'editar-pregao': openPregaoForm(id); break;
      case 'abrir-pregao': UI.tab = 'pregoes'; UI.detailId = id; history.pushState({ detail: id }, ''); saveUI(); render(); window.scrollTo(0, 0); break;
      case 'voltar': if (history.state && history.state.detail) history.back(); else { UI.detailId = null; render(); } break;
      case 'novo-item': openItemForm(null, t.dataset.pid); break;
      case 'editar-item': openItemForm(id); break;
      case 'filtro': UI.filtro = t.dataset.v; UI.keepScroll = true; render(); break;
      case 'rascunho': openDraft(t.dataset.key); break;
      case 'demo': store.mergeDemo(); toast('Dados de exemplo carregados'); break;
      case 'pdf-pregao': UI.pdf.pregaoId = id; UI.pdf.result = null; setTab('pdf'); break;
      case 'pdf-gerar': gerarPDF(); break;
      case 'pdf-abrir': if (UI.pdf.result) window.open(UI.pdf.result.url, '_blank'); break;
      case 'pdf-baixar': baixarPDF(); break;
      case 'pdf-compartilhar': compartilharPDF(); break;
      case 'pdf-modelo': commitAllPending(); store.patchPregao(UI.pdf.pregaoId, (p) => { p.pdfOpts = p.pdfOpts || {}; p.pdfOpts.modelo = t.dataset.v; }, true); UI.pdf.result = null; UI.keepScroll = true; render(); break;
      case 'pdf-datamodo': store.patchPregao(UI.pdf.pregaoId, (p) => { p.pdfOpts = p.pdfOpts || {}; setPathObj(p.pdfOpts, 'desc.localDataModo', t.dataset.v); }, true); UI.keepScroll = true; render(); break;
      case 'pdf-padrao': { commitAllPending(); const p = store.get().pregoes.find((x) => x.id === UI.pdf.pregaoId); store.setConfigPath('pdfPadrao', JSON.parse(JSON.stringify((p && p.pdfOpts) || {})), { silent: true }); toast('Estas opções agora são o padrão dos novos pregões'); break; }
      case 'pdf-reset': confirmar('Voltar ao padrão?', 'As chavinhas e textos deste pregão voltam ao padrão do app (ou ao padrão que você salvou).', 'Voltar ao padrão', false).then((ok) => { if (ok) { store.patchPregao(UI.pdf.pregaoId, (p) => { p.pdfOpts = null; }, true); UI.keepScroll = true; render(); } }); break;
      case 'clausula-add': commitAllPending(); store.patchPregao(UI.pdf.pregaoId, (p) => { p.pdfOpts = p.pdfOpts || {}; p.pdfOpts.desc = p.pdfOpts.desc || {}; p.pdfOpts.desc.clausulas = (p.pdfOpts.desc.clausulas || []).concat([{ id: 'x' + Date.now().toString(36), custom: true, ativo: true, texto: '' }]); }, true); UI.acc.add('acc-cl'); UI.keepScroll = true; render(); break;
      case 'clausula-del': store.patchPregao(UI.pdf.pregaoId, (p) => { p.pdfOpts.desc.clausulas = (p.pdfOpts.desc.clausulas || []).filter((c) => c.id !== id); }, true); UI.keepScroll = true; render(); break;
      case 'clausula-padrao': patchClausula(id, 'texto', C.CLAUSULAS_PADRAO.find((d) => d.id === id).texto); UI.keepScroll = true; render(); break;
      case 'wm-tipo': commitAllPending(); store.setConfigPath('marcaDagua.tipo', t.dataset.v, { silent: true }); UI.keepScroll = true; render(); break;
      case 'hd-pos': store.setConfigPath('cabecalho.pos', t.dataset.v, { silent: true }); UI.keepScroll = true; render(); break;
      case 'hd-remover': store.setConfigPath('cabecalho.imagem', null, { silent: true }); imagemMudou('cabecalho'); UI.keepScroll = true; render(); break;
      case 'wm-remover': store.setConfigPath('marcaDagua.imagem', null, { silent: true }); imagemMudou('marcaDagua'); UI.keepScroll = true; render(); break;
      case 'export': {
        const blob = new Blob([store.export()], { type: 'application/json' });
        const el = document.createElement('a'); el.href = URL.createObjectURL(blob); el.download = `pregoes-mei-backup-${C.hojeISO()}.json`; document.body.appendChild(el); el.click(); el.remove();
        setTimeout(() => URL.revokeObjectURL(el.href), 4000); toast('Backup exportado'); break;
      }
      case 'apagar': confirmar('Apagar todos os dados?', 'Pregões e itens serão removidos deste aparelho (e do servidor, quando a sincronização estiver ligada). Exporte um backup antes se precisar.', 'Apagar tudo', true).then((ok) => { if (ok) { store.clearAll(); toast('Dados apagados'); } }); break;
      case 'atualizar': checkUpdate(true); break;
      case 'nuvem-entrar': nuvemEntrar(false); break;
      case 'nuvem-criar': nuvemEntrar(true); break;
      case 'nuvem-sair': confirmar('Sair da conta?', 'Os dados continuam neste aparelho, mas deixam de sincronizar até você entrar de novo.', 'Sair', false).then((ok) => { if (ok && window.CloudSync) window.CloudSync.logout(); }); break;
      case 'nuvem-tentar': iniciarNuvem(true); break;
      case 'sync-agora': sincronizarImagens(); S.run('manual').then((r) => { if (r && r.ok) toast('Sincronizado'); updateStatusPill(); }); break;
      case 'instalar': if (UI.deferredPrompt) { UI.deferredPrompt.prompt(); UI.deferredPrompt.userChoice.finally(() => { UI.deferredPrompt = null; render(); }); } break;
      case 'banner-atualizar': location.reload(); break;
      default: break;
    }
  }
  function onInput(e) {
    const t = e.target;
    if (t.id === 'busca') { UI.busca = t.value; $('#plist').innerHTML = pregoesListHtml(); return; }
    if (t.id === 'buscaI') { UI.buscaI = t.value; $('#ilist').innerHTML = itensListHtml(); return; }
    if (t.dataset.ui) {
      if (t.dataset.ui === 'pregaoId' || t.dataset.ui === 'fonte') return; // selects: tratados em change
      UI.pdf[t.dataset.ui] = t.value; return;
    }
    if (t.dataset.pdf || t.dataset.clausula) { if (t.type !== 'checkbox') Guard.pending.add(pendKey(t)); return; }
    if (t.dataset.cfg) {
      Guard.pending.add(t.dataset.cfg);
      if (t.dataset.lb) { const lb = $('#' + t.dataset.lb); if (lb) lb.textContent = t.value + (t.dataset.type === 'pctrange' ? '%' : (t.dataset.suf || '')); }
      if (t.dataset.cfg.startsWith('cabecalho.') && t.type === 'range') refreshHdPreview(t);
    }
  }
  function onChange(e) {
    const t = e.target;
    if (t.dataset.ui === 'pregaoId') { UI.pdf.pregaoId = t.value; UI.pdf.result = null; saveUI(); UI.keepScroll = true; render(); return; }
    if (t.dataset.ui === 'fonte') { UI.pdf.fonte = t.value; UI.pdf.result = null; saveUI(); UI.keepScroll = true; render(); return; }
    if (t.dataset.ui) { UI.pdf[t.dataset.ui] = t.value; return; }
    if (t.dataset.pdf || t.dataset.clausula) { commitPdf(t); return; }
    if (t.dataset.cfg) { commitCfg(t); return; }
    if (t.dataset.statusPregao) { store.upsertPregao({ id: t.dataset.statusPregao, status: t.value }); toast('Status: ' + t.value); return; }
    if (t.hasAttribute('data-hd-file') && t.files && t.files[0]) {
      downscaleImage(t.files[0], 1800).then((url) => {
        store.setConfigPath('cabecalho.imagem', url, { silent: true }); imagemMudou('cabecalho');
        UI.keepScroll = true; render(); toast(Cloud.user ? 'Imagem do cabeçalho salva e enviada' : 'Imagem do cabeçalho salva');
      }).catch((err) => toast(err.message || 'Não foi possível usar essa imagem'));
      return;
    }
    if (t.hasAttribute('data-wm-file') && t.files && t.files[0]) {
      downscaleImage(t.files[0], 1000).then((url) => {
        store.setConfigPath('marcaDagua.imagem', url, { silent: true }); store.setConfigPath('marcaDagua.tipo', 'imagem', { silent: true }); imagemMudou('marcaDagua');
        UI.keepScroll = true; render(); toast(Cloud.user ? 'Marca d’água salva e enviada' : 'Marca d’água salva');
      }).catch((err) => toast(err.message || 'Não foi possível usar essa imagem'));
      return;
    }
    if (t.hasAttribute('data-import') && t.files && t.files[0]) importarBackup(t.files[0]);
  }
  async function importarBackup(file) {
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.pregoes) || !Array.isArray(data.itens)) throw new Error('Arquivo não parece um backup do app.');
      const v = await dialog({ title: 'Importar backup', text: `${data.pregoes.length} pregão(ões) e ${data.itens.length} item(ns).`, buttons: [{ label: 'Mesclar com os dados atuais', value: 'mesclar', cls: 'primary' }, { label: 'Substituir tudo', value: 'subst', cls: 'danger' }, { label: 'Cancelar', value: null, cls: 'ghost' }] });
      if (v === 'mesclar') { store.mergeFrom(data); S.schedule('importação'); toast('Backup mesclado'); }
      else if (v === 'subst') { store.replaceAll(data); toast('Backup restaurado'); }
    } catch (e) { toast(e.message || 'Não foi possível ler o arquivo'); }
    $$('[data-import]').forEach((i) => { i.value = ''; });
  }

  /* ---------- atualização forçada (servidor primeiro) ---------- */
  let hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  let swReg = null;
  function afterClose() { if (UI.reloadPending && !isDirty()) location.reload(); }
  function showUpdateBanner() {
    if ($('.banner')) return;
    const b = document.createElement('div'); b.className = 'banner'; b.setAttribute('role', 'status');
    b.innerHTML = `<span class="grow">Nova versão instalada. Conclua o que está digitando e atualize.</span><button class="btn sm" data-act="banner-atualizar">Atualizar</button>`;
    document.body.appendChild(b); b.addEventListener('click', onClick);
  }
  function applyUpdate() {
    if (!isDirty()) location.reload();
    else { UI.reloadPending = true; showUpdateBanner(); }
  }
  async function checkUpdate(manual) {
    if (!swReg) { if (manual) toast('Atualização automática indisponível neste navegador'); return; }
    try {
      await swReg.update();
      if (manual) setTimeout(() => { if (!UI.reloadPending) toast('Você está na versão mais recente (' + C.APP_VERSION + ')'); }, 1500);
    } catch (e) { if (manual) toast('Sem conexão para buscar atualização'); }
  }
  async function initSW() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    try {
      swReg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
    } catch (e) { console.warn('SW', e); return; }
    // servidor primeiro: a cada abertura, volta ao app e reconexão
    checkUpdate(false);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false); });
    window.addEventListener('online', () => checkUpdate(false));
    setInterval(() => checkUpdate(false), 20 * 60 * 1000);
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; } // primeira instalação: não recarrega
      applyUpdate();
    });
  }

  /* ---------- conta e sincronização na nuvem ---------- */
  const Cloud = { estado: 'inicial', erro: '', user: null, ligado: false, ocupado: false };

  function erroAuth(e) {
    const c = (e && e.code) || '';
    const m = {
      'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'E-mail ou senha incorretos.', 'auth/user-not-found': 'E-mail ou senha incorretos.',
      'auth/invalid-email': 'E-mail inválido.', 'auth/email-already-in-use': 'Esse e-mail já tem conta. Use “Entrar”.',
      'auth/weak-password': 'Senha fraca: use ao menos 6 caracteres.', 'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente de novo.',
      'auth/network-request-failed': 'Sem internet para falar com o Firebase.',
      'auth/unauthorized-domain': 'Este endereço não está autorizado no Firebase (Authentication › Configurações › Domínios autorizados).',
      'auth/operation-not-allowed': 'Login por e-mail/senha não está ligado no Firebase.',
    };
    return m[c] || ('Não foi possível entrar' + (c ? ' (' + c + ')' : '.'));
  }

  function cloudCard() {
    const u = Cloud.user;
    let corpo;
    if (Cloud.estado === 'carregando' || Cloud.estado === 'inicial') corpo = `<p class="small muted">Conectando ao Firebase…</p>`;
    else if (Cloud.estado === 'erro') corpo = `<div class="alert warn">${icon('alert', 'sm')}<span>${esc(Cloud.erro)}</span></div><button class="btn block" style="margin-top:10px" data-act="nuvem-tentar">Tentar de novo</button><p class="tiny muted" style="margin-top:8px">O app funciona normalmente sem a nuvem; seus dados ficam salvos no aparelho.</p>`;
    else if (u) corpo = `<div class="kv-list"><div><span>Conta</span><b>${esc(u.email || '')}</b></div><div><span>Situação</span><b id="syncMsg">${esc(S.message)}</b></div></div>
      <div class="grid2" style="margin-top:12px"><button class="btn" data-act="sync-agora">${icon('cloud', 'sm')} Sincronizar</button><button class="btn danger" data-act="nuvem-sair">Sair</button></div>
      <p class="tiny muted" style="margin-top:10px">Papel timbrado e marca d’água também sincronizam (a imagem mais recente vale; cada uma é reduzida para ~450 KB).</p>`;
    else corpo = `<p class="small muted" style="margin-bottom:12px">Entre com a mesma conta em todos os aparelhos para manter os dados iguais.</p>
      <div class="field"><label for="cEmail">E-mail</label><input class="input" id="cEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label for="cSenha">Senha</label><input class="input" id="cSenha" type="password" autocomplete="current-password"></div>
      <div class="grid2"><button class="btn primary" data-act="nuvem-entrar">Entrar</button><button class="btn" data-act="nuvem-criar">Criar conta</button></div>`;
    return `<div class="card"><h3>${icon('cloud', 'sm')} Conta e sincronização</h3>${corpo}</div>`;
  }

  async function nuvemEntrar(criar) {
    const email = ($('#cEmail') || {}).value, senha = ($('#cSenha') || {}).value;
    if (!email || !senha) { toast('Preencha e-mail e senha'); return; }
    if (!window.CloudSync) { toast('Firebase ainda não carregou'); return; }
    try { await window.CloudSync[criar ? 'cadastrar' : 'login'](email.trim(), senha); toast(criar ? 'Conta criada' : 'Conectado'); }
    catch (e) { toast(erroAuth(e)); }
  }

  // sincroniza: lê o servidor, mescla e grava numa transação (aparelho desatualizado nunca sobrescreve o servidor)
  function adaptadorFirebase(uid) {
    return {
      sync: (local) => window.CloudSync.mesclarNaNuvem(uid, (remoto) => {
        const merged = C.mergeState(local, remoto || {});
        const dados = C.paraNuvem(merged);
        const tam = JSON.stringify(dados).length;
        if (tam > 950000) throw new Error('Dados passaram do limite de 1 MB do documento da nuvem. Exporte um backup e apague pregões antigos.');
        const gravar = !remoto || C.diffState(remoto, dados);
        dados.atualizadoEm = Date.now();
        return { gravar, dados, resultado: merged };
      }),
    };
  }

  async function aoEntrar(user) {
    const cs = window.CloudSync;
    const ultimo = localStorage.getItem('mp.cloud.uid');
    if (ultimo && ultimo !== user.uid && store.hasData()) {
      const v = await dialog({
        title: 'Dados de outra conta neste aparelho',
        text: 'Este aparelho tem pregões salvos de outra conta. O que fazer com eles?',
        buttons: [
          { label: 'Apagar os daqui e usar os desta conta', value: 'limpar', cls: 'primary' },
          { label: 'Mesclar com esta conta', value: 'mesclar' },
          { label: 'Sair da conta', value: 'sair', cls: 'danger' },
        ],
      });
      if (v === 'sair') { await cs.logout(); return; }
      if (v === 'limpar') store.replaceAll(C.emptyState());
    }
    localStorage.setItem('mp.cloud.uid', user.uid);
    S.configure(adaptadorFirebase(user.uid));
    // atualização ao vivo: mudanças feitas em outro aparelho chegam aqui (não reenvia: kind 'remote')
    sincronizarImagens();
    cs.ouvirImagens(user.uid, (dados) => { if (aplicarImagensRemotas(imgRemoto(dados))) { UI.keepScroll = true; if (UI.tab === 'pdf') render(); } });
    cs.ouvirMudancas(user.uid, (dados) => {
      store.mergeFrom(dados);
      // se a nuvem está sem algo que este aparelho tem (gravação perdida ou atrasada), reconcilia sozinho
      if (C.diffState(dados, C.paraNuvem(store.get()))) S.schedule('reconciliar', 1200);
    });
  }
  function aoSair() {
    if (window.CloudSync) window.CloudSync.pararDeOuvir();
    S.configure(null);
  }

  async function iniciarNuvem(manual) {
    if (Cloud.ligado) return;
    Cloud.estado = 'carregando'; if (UI.tab === 'config') render();
    try {
      const cs = await window.carregarCloudSync();
      Cloud.ligado = true; Cloud.estado = 'pronto';
      cs.onAuthStateChanged(async (user) => {
        Cloud.user = user || null;
        try { if (user) await aoEntrar(user); else aoSair(); } catch (e) { console.error(e); }
        updateStatusPill(); if (UI.tab === 'config') render();
      });
    } catch (e) {
      Cloud.estado = 'erro';
      Cloud.erro = navigator.onLine ? 'Não consegui carregar o Firebase. Tente de novo em instantes.' : 'Sem internet: a conta e a sincronização voltam quando você estiver online.';
      if (manual) toast(Cloud.erro);
      if (UI.tab === 'config') render();
    }
  }

  /* ---------- inicialização ---------- */
  function buildShell() {
    $('#app').innerHTML = `<div class="shell">
      <header class="topbar"><img class="logo" src="icons/icon-96.png" alt="" width="34" height="34"><div class="grow"><h1>Pregões MEI</h1><div class="sub" id="subt"></div></div><span class="pill" id="pill"></span></header>
      <nav class="nav" aria-label="Seções">${TABS.map((t) => `<button data-v="${t.id}" aria-label="${t.t}">${icon(t.id)}<span>${t.t}</span></button>`).join('')}</nav>
      <main class="main" id="main" tabindex="-1"></main></div>`;
    $('.nav').addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) setTab(b.dataset.v); });
    const main = $('#main');
    main.addEventListener('click', onClick);
    main.addEventListener('input', onInput);
    main.addEventListener('change', onChange);
    main.addEventListener('toggle', (e) => { const d = e.target; if (d && d.dataset && d.dataset.acc) { if (d.open) UI.acc.add(d.dataset.acc); else UI.acc.delete(d.dataset.acc); } }, true);
    main.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('article[data-act]')) { e.preventDefault(); e.target.click(); } });
  }

  function boot() {
    buildShell();
    store.on((kind) => {
      if (kind === 'error') { toast('Armazenamento do aparelho cheio. Exporte um backup e libere espaço.'); return; }
      if (kind !== 'remote') S.schedule('alteração');   // 'remote' = veio da nuvem: não reenvia (evita laço)
      if (kind === 'change' || kind === 'remote') render(); else updateStatusPill();
    });
    S.on(() => { updateStatusPill(); const m = $('#syncMsg'); if (m) m.textContent = S.message; });
    window.addEventListener('online', updateStatusPill); window.addEventListener('offline', updateStatusPill);
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); UI.deferredPrompt = e; if (UI.tab === 'config') render(); });
    window.addEventListener('appinstalled', () => { UI.deferredPrompt = null; toast('App instalado'); });

    // atalhos do manifesto (?acao=novo-pregao / ?tab=pdf)
    const q = new URLSearchParams(location.search);
    if (q.get('tab') && TABS.some((t) => t.id === q.get('tab'))) UI.tab = q.get('tab');
    render();
    if (q.get('acao') === 'novo-pregao') openPregaoForm();
    if (q.has('tab') || q.has('acao') || q.has('source')) history.replaceState(null, '', location.pathname);
    initSW();
    iniciarNuvem(false);                                   // carrega o Firebase sem travar a abertura
    window.addEventListener('online', () => { if (!Cloud.ligado) iniciarNuvem(false); else sincronizarImagens(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  window.__app = { store, UI, render, openPregaoForm, openItemForm, Guard, Sheet, Draft, downscaleImage }; // facilita testes/depuração
})();

</script>
</body>
</html>
