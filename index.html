  // nome curto para o bloco: corta no primeiro separador e, se ainda longo, no fim de uma palavra
  function nomeCurto(txt, max) {
    let t = String(txt || '').replace(/\s+/g, ' ').trim();
    t = t.split(/\s[-–—]\s|;|,\s/)[0].trim() || t;
    if (t.length <= max) return t;
    const cut = t.slice(0, max - 1), sp = cut.lastIndexOf(' ');
    return (sp > max * 0.55 ? cut.slice(0, sp) : cut).replace(/[\s,.;:/-]+$/, '') + '…';
  }
  // bloco do item (PC): sempre as mesmas linhas, na mesma posição
  function itemBloco(it, c) {
    const lt = C.padLE(it.loteEdital), ie = C.padLE(it.itemEdital);
    const num = (lt || ie) ? (lt ? 'L' + esc(lt) + (ie ? ' · ' : '') : '') + (ie ? 'ITEM ' + esc(ie) : '') : 'S/Nº';
    const cps = comprasDoItem(it).filter((k) => k.href), k = cps[0];
    const lanceU = c.lance != null ? c.lance : c.teto;
    const tag = c.fora ? '<span class="badge off">Fora</span>' : c.ganhou ? '<span class="acp-tag venci">Venci</span>' : c.desclass ? '<span class="badge bad">Desclass.</span>' : (it.possivelGanhar ? '<span class="acp-tag posso">Posso</span>' : '');
    const colocTag = it.colocacao && !c.ganhou ? `<span class="coloc-badge ${it.colocacao === 1 ? 'c1' : it.colocacao <= 3 ? 'c3' : ''}" title="Minha colocação">${colocTxt(it.colocacao)}</span>` : '';
    const lucroCor = c.lucro == null ? '' : c.lucro < 0 ? 'var(--red)' : 'var(--green)';
    const kv = (l, v, cls) => `<div class="ib-kv${cls ? ' ' + cls : ''}"><span>${l}</span><b>${v}</b></div>`;
    return `<article class="ibox${c.fora || (c.naoGanhou && !it.possivelGanhar) ? ' apagado' : ''}" data-id="${it.id}">
      <div class="ib-hd"><span class="ib-num">${num}</span>${colocTag}${tag}<button type="button" class="ic-btn" data-act="editar-item" data-id="${it.id}" title="Editar item" aria-label="Editar item">${icon('edit', 'sm')}</button></div>
      <h4 class="ib-nome" title="${esc(it.descricao)}">${esc(nomeCurto(it.descricao, 38))}</h4>
      <div class="ib-grid">
        ${kv('Qtd', C.qtdBR(it.qtd) + (it.unidade ? ' <em>' + esc(String(it.unidade).toLowerCase()) + '</em>' : ''))}
        ${kv('Custo un.', c.divisao ? C.brl(c.custoCompra) : C.brl(it.custo))}
        ${kv(c.lance != null ? 'Meu lance' : 'Lance (teto)', lanceU != null ? C.brl(lanceU) : '—', c.lance != null ? 'dest' : '')}
        ${kv('Lance total', c.totalVenda != null ? C.brl(c.totalVenda) : '—', 'dest')}
        ${kv('Teto un.', c.teto != null ? C.brl(c.teto) : '—')}

      for (const it of porItemEdital(g.todosItens)) {

        if (!venci && !posso) continue;
        const u = C.unitProposta(c, 'auto').unit;
        const total = u == null ? 0 : round2n(u * (Number(it.qtd) || 0));
        const lucro = u == null ? null : round2n(total - (c.custoTotal || 0) - total * Math.max(0, Number(store.get().config.impostoPct) || 0));
        linhas.push({ it, c, venci, posso, unit: u, total, lucro });

  function faltasEmpresa(o, emp) {
    const val = { fornecedor: emp.nome, cnpj: emp.cnpj || emp.cpf, endereco: emp.endereco, bairro: emp.bairro, cep: emp.cep, cidade: emp.cidade, uf: emp.uf, telefone: emp.telefone, email: emp.email, banco: emp.banco, agencia: emp.agencia, conta: emp.conta, pix: emp.pix };
    const nomes = { fornecedor: 'Nome', cnpj: 'CNPJ', endereco: 'Endereço', bairro: 'Bairro', cep: 'CEP', cidade: 'Cidade', uf: 'UF', telefone: 'Telefone', email: 'E-mail', banco: 'Banco', agencia: 'Agência', conta: 'Conta', pix: 'PIX' };
    const quer = { fornecedor: true, cnpj: true };                       // nome e CNPJ sempre servem (cabeçalho, assinatura)
    if (o.desc.fornecedor) Object.keys(o.desc.campos).forEach((k) => { if (o.desc.campos[k]) quer[k] = true; });
    if (o.com.bancarios) ['banco', 'agencia', 'conta', 'pix'].forEach((k) => { if ((o.bancoCampos || {})[k] !== false) quer[k] = true; });
    return Object.keys(nomes).filter((k) => quer[k] && !String(val[k] || '').trim()).map((k) => nomes[k]);
  }
  function faltaEmpresaHtml(o, emp) {
    const f = faltasEmpresa(o, emp);
    if (!f.length) return '';
    return `<div class="alert warn">${icon('alert', 'sm')}<div class="grow">Faltam dados da empresa que este modelo usa: <b>${esc(f.join(', '))}</b>. Sem eles, os campos saem em branco no PDF.</div><button class="btn sm" data-act="tab" data-v="config">Preencher</button></div>`;
  }

        ${UI.pdf.tipo === 'final' ? '' : swp(o, 'anonima', 'Proposta inicial sem identificação da empresa', 'Para o edital que proíbe identificar o licitante. Sai sem nome, CNPJ, cabeçalho, dados bancários, local, assinatura, declarações e cláusulas com dados da empresa. Vale só para este pregão; a proposta final sai identificada.')}

        <div class="field full" style="margin-top:8px"><label>Cor do documento (rótulos, faixas e bordas)</label><input class="input" type="color" data-cfg="proposta.cor" data-type="text" value="${esc(cfg.proposta.cor)}"></div>
        <div class="grid2" style="margin-top:6px"><button type="button" class="btn sm" data-act="pdf-padrao">Usar como padrão</button><button type="button" class="btn sm" data-act="pdf-reset">Voltar ao padrão</button></div>
      </div>`;
    const corpo = [
      acc('acc-tit', 'Títulos e faixa do edital',
        `${swp(o, 'desc.titulo', 'Título do documento')}${fp(o, 'desc.tituloTexto', 'Título', { area: true, rows: 2, full: true, hint: 'Sai em caixa alta e negrito, ajustado às margens. Enter = nova linha.' })}
         ${swp(o, 'desc.faixa', 'Faixa com o número do edital')}${fp(o, 'desc.faixaTexto', 'Texto da faixa', { hint: '{numero} vira o “Nº do pregão”' })}`),
      acc('acc-grade', 'Dados do órgão e do processo', `${swp(o, 'com.grade', 'Mostrar órgão, processo, validade, pagamento e entrega')}

          ${fp(o, 'validade', 'Validade (dias)', { type: 'int', im: 'numeric' })}

          ${fp(o, 'prazoEntrega', 'Prazo de entrega', { ph: pz.prazoEntregaDias ? pz.prazoEntregaDias + ' dias (do pregão)' : 'ex.: 10 dias' })}
          ${fp(o, 'localEntrega', 'Local de entrega', { ph: C.localEntregaPadrao(pz, store.get().itens.filter((i) => i.pregaoId === pz.id && !i.deleted)) || 'local do pregão', hint: 'Em branco = usa o local do pregão. Escreva aqui só para mudar.' })}

  function renderPDF() {

    const pz0 = st.pregoes.find((x) => x.id === UI.pdf.pregaoId) || {};
    const FINAL = UI.pdf.tipo === 'final';

          ? 'Só os itens que você marcou como <b>Venci</b>, com o valor ajustado. Antes de gerar, o app pede para confirmar o preço de cada item. Os ajustes de texto feitos aqui valem só para a proposta final deste pregão.'
          : 'Todos os itens da disputa, com o preço da cotação. Na 1ª vez que você gerar, os preços ficam guardados: depois ela sai sempre igual, mesmo que você mude custos. Com lance final preenchido, sai o lance.'}</p>

        ${pz0.status !== 'Proposta enviada' ? (pz0.link

        <div class="seg-ctl">${[['esquerda', 'Esquerda'], ['centro', 'Centro'], ['direita', 'Direita']].map(([v, l]) => `<button type="button" data-act="hd-pos" data-v="${v}" class="${hd.pos === v ? 'on' : ''}">${l}</button>`).join('')}</div>

      </div>
      <div class="card"><h3>5 · Marca d’água</h3>
        <div class="seg-ctl" role="tablist">${[['nenhuma', 'Nenhuma'], ['texto', 'Texto'], ['imagem', 'Imagem']].map(([v, l]) => `<button type="button" data-act="wm-tipo" data-v="${v}" class="${w.tipo === v ? 'on' : ''}">${l}</button>`).join('')}</div>

  /* ---------- catálogo dos produtos: fotos ficam neste aparelho (IndexedDB); a descrição detalhada fica no item (vai para a nuvem) ---------- */
  const CatImg = (() => {
    let dbp = null;
    const db = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('mp.catalogo', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('img');
      r.onsuccess = () => res(r.result); r.onerror = () => { dbp = null; rej(r.error); };
    }));
    const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('img', mode); const st = t.objectStore('img'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
    const norm = (v) => (Array.isArray(v) ? { fotos: v, em: 0, pend: v.length > 0 } : (v && Array.isArray(v.fotos) ? v : { fotos: [], em: 0, pend: false }));
    return {
      getRec: async (id) => { try { return norm(await tx('readonly', (st) => st.get(id))); } catch (e) { return norm(null); } },
      setRec: (id, rec) => tx('readwrite', (st) => st.put(rec, id)),
      get: async (id) => { try { return norm(await tx('readonly', (st) => st.get(id))).fotos; } catch (e) { return []; } },
      keys: async () => { try { return (await tx('readonly', (st) => st.getAllKeys())) || []; } catch (e) { return []; } },
    };
  })();
  // fotos: ficam no aparelho (rápido) e vão para a nuvem reduzidas; o item guarda só a data (fotosEm) para os outros aparelhos saberem que mudou
  const nuvemFotosOk = () => !!(window.CloudSync && Cloud.user && navigator.onLine);
  async function enviarFotos(id, rec) {
    if (!nuvemFotosOk()) return false;
    try { await window.CloudSync.salvarFotos(Cloud.user.uid, id, { fotos: rec.fotos, em: rec.em }); await CatImg.setRec(id, Object.assign({}, rec, { pend: false })); return true; }
    catch (e) { console.warn('[fotos] envio', e); if (!enviarFotos.avisou) { enviarFotos.avisou = true; toast(/permission/i.test(String(e && (e.code || e.message))) ? 'A nuvem recusou as fotos (regras do Firebase). Elas continuam salvas neste aparelho.' : 'Fotos salvas neste aparelho; envio para a nuvem fica para depois.'); } return false; }
  }
  async function gravarFotos(id, arr) {
    const rec = { fotos: arr, em: C.agora(), pend: true };
    await CatImg.setRec(id, rec);
    store.patchItem(id, (x) => { x.fotosEm = rec.em; x.fotosN = arr.length; });   // vai para a nuvem junto com os dados
    contarFotosPendentes();
    enviarFotos(id, rec).then(contarFotosPendentes);
  }
  // fotos de um item: se outro aparelho mudou (fotosEm mais novo), baixa da nuvem; se aqui tem foto ainda não enviada, envia
  async function fotosDoItem(id) {
    const loc = await CatImg.getRec(id);
    const it = store.get().itens.find((i) => i.id === id);
    const remEm = (it && it.fotosEm) || 0;
    if (remEm > (loc.em || 0) && nuvemFotosOk()) {
      try {
        const r = await window.CloudSync.buscarFotos(Cloud.user.uid, id);
        if (r && (r.em || 0) >= remEm) { const rec = { fotos: Array.isArray(r.fotos) ? r.fotos : [], em: r.em, pend: false }; await CatImg.setRec(id, rec); return rec.fotos; }
      } catch (e) { console.warn('[fotos] download', e); }
    }
    if (loc.pend && nuvemFotosOk()) {
      const rec = loc.em ? loc : Object.assign({}, loc, { em: C.agora() });
      if (!loc.em && it) store.patchItem(id, (x) => { x.fotosEm = rec.em; x.fotosN = rec.fotos.length; });
      enviarFotos(id, rec);
    }
    return loc.fotos;
  }
  // ao entrar/voltar a internet: envia o que ficou pendente
  async function enviarFotosPendentes() {

  async function preencherFotosCatalogo() {

  // ao incluir: a foto entra inteira num quadrado com fundo transparente (padrão único; sem recorte)
  function fotoCatalogo(file, n, total) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Imagem inválida')); };
      img.onload = () => {
        URL.revokeObjectURL(url);
        const P = 280;   // tamanho da prévia
        const st = { modo: 'inteira', zoom: 1, dx: 0, dy: 0 };
        const w = document.createElement('div');
        w.className = 'dlg-wrap';
        w.innerHTML = `<div class="dlg dlg-foto" role="dialog" aria-modal="true"><h3>Ajustar foto${total > 1 ? ` (${n} de ${total})` : ''}</h3>
          <p>A foto entra inteira, sem cortar nada, num quadrado com <b>fundo transparente</b>.</p>
          <canvas width="${P * 2}" height="${P * 2}" class="foto-prev" style="width:${P}px;height:${P}px"></canvas>
          <div class="field foto-zoom" style="display:none"><input type="range" min="1" max="3" step="0.05" value="1" data-fz></div>
          <div class="btns"><button type="button" class="btn primary" data-fok>Usar esta foto</button><button type="button" class="btn ghost" data-fno>Pular esta foto</button></div></div>`;
        document.body.appendChild(w);
        const cv = w.querySelector('canvas'), g = cv.getContext('2d');
        // desenha a foto num quadrado de lado L conforme o modo
        const desenhar = (ctx, L) => {
          ctx.clearRect(0, 0, L, L);   // fundo transparente
          if (st.modo === 'inteira') { const s0 = L / Math.max(img.width, img.height); const ww = img.width * s0, hh = img.height * s0; ctx.drawImage(img, (L - ww) / 2, (L - hh) / 2, ww, hh); return; }
          const s0 = (L / Math.min(img.width, img.height)) * st.zoom; const ww = img.width * s0, hh = img.height * s0;
          const mx = Math.max(0, (ww - L) / 2), my = Math.max(0, (hh - L) / 2);
          st.dx = Math.max(-1, Math.min(1, st.dx)); st.dy = Math.max(-1, Math.min(1, st.dy));
          ctx.drawImage(img, (L - ww) / 2 + st.dx * mx, (L - hh) / 2 + st.dy * my, ww, hh);
        };
        const prev = () => { desenhar(g, cv.width); w.querySelector('.foto-zoom').style.display = st.modo === 'recortar' ? '' : 'none'; cv.style.cursor = st.modo === 'recortar' ? 'grab' : 'default'; };
        prev();
        let arr0 = null;
        cv.addEventListener('pointerdown', (e) => { if (st.modo !== 'recortar') return; arr0 = { x: e.clientX, y: e.clientY, dx: st.dx, dy: st.dy }; cv.setPointerCapture(e.pointerId); });
        cv.addEventListener('pointermove', (e) => {
          if (!arr0) return;
          const s0 = (P / Math.min(img.width, img.height)) * st.zoom, mx = Math.max(1, (img.width * s0 - P) / 2), my = Math.max(1, (img.height * s0 - P) / 2);
          st.dx = arr0.dx + (e.clientX - arr0.x) / mx; st.dy = arr0.dy + (e.clientY - arr0.y) / my; prev();
        });
        cv.addEventListener('pointerup', () => { arr0 = null; });
        w.querySelector('[data-fz]').addEventListener('input', (e) => { st.zoom = Number(e.target.value) || 1; prev(); });
        w.addEventListener('click', (e) => {
          const m = e.target.closest('[data-fm]');
          if (m) { st.modo = m.dataset.fm; w.querySelectorAll('[data-fm]').forEach((b) => b.classList.toggle('on', b === m)); prev(); return; }
          if (e.target.closest('[data-fno]')) { w.remove(); resolve(null); return; }
          if (!e.target.closest('[data-fok]')) return;
          // PNG para manter o fundo transparente; reduz o tamanho até ficar leve para sincronizar
          const gera = (L) => { const c2 = document.createElement('canvas'); c2.width = L; c2.height = L; desenhar(c2.getContext('2d'), L); return c2.toDataURL('image/png'); };
          let out = gera(900);
          for (const L of [800, 700, 600, 520, 450, 400, 360, 320]) { if (out.length <= 230000) break; out = gera(L); }
          w.remove(); resolve(out);
        });
      };
      img.src = url;
    });
  }
  async function incluirFotosCatalogo(id, files) {
    try {
      const arr = (await fotosDoItem(id)).slice();

  // proposta final: confirma o preço de cada item vencido antes de gerar (grava o valor como lance final)
  function confirmarPrecosFinal(pid) {
    const st = store.get();
    const L = C.linhasProposta(st, pid, UI.pdf.fonte, 0, 'final');
    if (!L.linhas.length) { toast('Nenhum item para a proposta final'); return Promise.resolve(false); }
    const RR = C.computeAll(st);
    const v2 = (n) => (n === null || n === undefined ? '' : Number(n).toFixed(2).replace('.', ','));
    return new Promise((resolve) => {
      const w = document.createElement('div');
      w.className = 'dlg-wrap';

  /* ---------- config autosave ---------- */

  function readCfgValue(el) {
    const t = el.dataset.type;
    if (t === 'check') return el.checked;
    if (t === 'range') return Number(el.value);
    if (t === 'pctrange') return Number(el.value) / 100;

    if (t === 'int') { const n = parseInt(el.value, 10); return isFinite(n) ? n : undefined; }

    if (t === 'num') { const n = C.parseBR(el.value); return n == null ? undefined : Math.max(0, n); }
    return el.value;

  function refreshWmPreview() {

  // reduz a imagem, CORTA as margens vazias (transparentes ou brancas) e reencolhe até caber no orçamento da nuvem
  const ORCAMENTO_IMG = 450000; // caracteres do data URL por imagem (2 imagens + folga < 1 MB do documento)
  function downscaleImage(file, max) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const png = file.type === 'image/png';
        const s0 = Math.min(1, max / Math.max(img.width, img.height));
        let cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * s0)); cv.height = Math.max(1, Math.round(img.height * s0));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        try {
          const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, d = ctx.getImageData(0, 0, W, H).data;
          const vazio = (i) => (png ? d[i + 3] < 12 : (d[i + 3] < 12 || (d[i] > 244 && d[i + 1] > 244 && d[i + 2] > 244)));
          let x0 = W, y0 = H, x1 = -1, y1 = -1;
          for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!vazio((y * W + x) * 4)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
          if (x1 >= x0 && y1 >= y0 && ((x1 - x0 + 1) < W - 2 || (y1 - y0 + 1) < H - 2)) {
            const pad = 2; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
            const c2 = document.createElement('canvas'); c2.width = x1 - x0 + 1; c2.height = y1 - y0 + 1;
            c2.getContext('2d').drawImage(cv, x0, y0, c2.width, c2.height, 0, 0, c2.width, c2.height);
            cv = c2;
          }
        } catch (e) { /* sem corte: segue com a imagem inteira */ }
        const codifica = () => (png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.85));
        let out = codifica();
        // grande demais para a nuvem: reduz 20% por vez (mínimo de 200 px no maior lado)
        while (out.length > ORCAMENTO_IMG && Math.max(cv.width, cv.height) > 200) {
          const c3 = document.createElement('canvas'); c3.width = Math.max(1, Math.round(cv.width * 0.8)); c3.height = Math.max(1, Math.round(cv.height * 0.8));
          c3.getContext('2d').drawImage(cv, 0, 0, c3.width, c3.height); cv = c3; out = codifica();
        }
        if (out.length > ORCAMENTO_IMG) reject(new Error('Imagem pesada demais. Use uma mais simples.')); else resolve(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Imagem inválida')); };
      img.src = url;
    });
  }

  /* ---------- sincronização das imagens (papel timbrado e marca d'água) ---------- */
  const IMG_CHAVES = [['cab', 'cabecalho'], ['marca', 'marcaDagua']];
  function imgLocal() { const c = store.get().config; return { cab: { img: c.cabecalho.imagem || null, em: c.cabecalho.imagemEm || 0 }, marca: { img: c.marcaDagua.imagem || null, em: c.marcaDagua.imagemEm || 0 } }; }
  function imgRemoto(r) { return { cab: { img: (r && r.cab) || null, em: (r && r.cabEm) || 0 }, marca: { img: (r && r.marca) || null, em: (r && r.marcaEm) || 0 } }; }
  function aplicarImagensRemotas(R) {
    const L = imgLocal(); let mudou = false;
    for (const [k, path] of IMG_CHAVES) if (R[k].em > L[k].em) { store.setImagem(path, R[k].img, R[k].em); mudou = true; }
    return mudou;
  }
  async function sincronizarImagens() {
    enviarFotosPendentes();
    const cs = window.CloudSync, u = Cloud.user;
    if (!cs || !u || !navigator.onLine || Cloud.imgBusy) return;
    Cloud.imgBusy = true;
    try {
      // imagens de antes desta função (sem data) valem "agora" na primeira vez: não são sobrescritas pela nuvem
      for (const [, path] of IMG_CHAVES) { const c = store.get().config[path]; if (c.imagem && !c.imagemEm) store.setImagem(path, c.imagem, C.agora()); }
      const aplicar = await cs.mesclarImagens(u.uid, (remoto) => {
        const L = imgLocal(), R = imgRemoto(remoto);
        const dados = { cab: R.cab.img, cabEm: R.cab.em, marca: R.marca.img, marcaEm: R.marca.em };

  function completarComLocal(data) {
    const st = store.get(), t = Date.now();
    const junta = (locais, vindos) => vindos.map((r) => {
      const l = r && locais.find((x) => x.id === r.id);
      if (!l || l.deleted || !((r.updatedAt || 0) > (l.updatedAt || 0))) return r;
      return Object.assign({}, l, r, { updatedAt: Math.max(t, r.updatedAt || 0) });
    });
    return Object.assign({}, data, { pregoes: junta(st.pregoes, data.pregoes), itens: junta(st.itens, data.itens) });
  }
  async function importarBackup(file) {

      const v = await dialog({ title: 'Importar backup', text: `${data.pregoes.length} pregão(ões) e ${data.itens.length} item(ns).`, buttons: [{ label: 'Mesclar com os dados atuais', value: 'mesclar', cls: 'primary' }, { label: 'Substituir tudo', value: 'subst', cls: 'danger' }, { label: 'Cancelar', value: null, cls: 'ghost' }] });
      if (v === 'mesclar') { store.mergeFrom(completarComLocal(data)); S.schedule('importação'); toast('Backup mesclado'); }

    const c = (e && e.code) || '';
    const m = {
      'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'E-mail ou senha incorretos.', 'auth/user-not-found': 'E-mail ou senha incorretos.',
      'auth/invalid-email': 'E-mail inválido.', 'auth/email-already-in-use': 'Esse e-mail já tem conta. Use “Entrar”.',
      'auth/weak-password': 'Senha fraca: use ao menos 6 caracteres.', 'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente de novo.',
      'auth/network-request-failed': 'Sem internet para falar com o Firebase.',
      'auth/unauthorized-domain': 'Este endereço não está autorizado no Firebase (Authentication › Configurações › Domínios autorizados).',
      'auth/operation-not-allowed': 'Login por e-mail/senha não está ligado no Firebase.',
    };
    return m[c] || ('Não foi possível entrar' + (c ? ' (' + c + ')' : '.'));
  }

  function cloudCard() {
    const u = Cloud.user;
    let corpo;
    if (Cloud.estado === 'carregando' || Cloud.estado === 'inicial') corpo = `<p class="small muted">Conectando ao Firebase…</p>`;
    else if (Cloud.estado === 'erro') corpo = `<div class="alert warn">${icon('alert', 'sm')}<span>${esc(Cloud.erro)}</span></div><button class="btn block" style="margin-top:10px" data-act="nuvem-tentar">Tentar de novo</button><p class="tiny muted" style="margin-top:8px">O app funciona normalmente sem a nuvem; seus dados ficam salvos no aparelho.</p>`;
    else if (u) corpo = `<div class="kv-list"><div><span>Conta</span><b>${esc(u.email || '')}</b></div><div><span>Situação</span><b id="syncMsg">${esc(S.message)}</b></div>
        <div><span>Sem enviar para a nuvem</span><b id="syncPend">${syncInfo().pend}</b></div>
        <div><span>Escuta ao vivo</span><b id="syncVivo">${syncInfo().vivo}</b></div>
        <div><span>Relógio deste aparelho</span><b id="syncRel">${syncInfo().rel}</b></div></div>
      <div class="grid2" style="margin-top:12px"><button class="btn" data-act="sync-agora">${icon('cloud', 'sm')} Sincronizar</button><button class="btn" data-act="sync-verificar">${icon('check', 'sm')} Verificar com a nuvem</button></div>
      <button class="btn danger block" style="margin-top:8px" data-act="nuvem-sair">Sair da conta</button>
      <p class="tiny muted" style="margin-top:10px">Papel timbrado e marca d’água também sincronizam (a imagem mais recente vale; cada uma é reduzida para ~450 KB).</p>`;
    else corpo = `<p class="small muted" style="margin-bottom:12px">Entre com a mesma conta em todos os aparelhos para manter os dados iguais.</p>
      <div class="field"><label for="cEmail">E-mail</label><input class="input" id="cEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label for="cSenha">Senha</label><input class="input" id="cSenha" type="password" autocomplete="current-password"></div>
      <div class="grid2"><button class="btn primary" data-act="nuvem-entrar">Entrar</button><button class="btn" data-act="nuvem-criar">Criar conta</button></div>`;
    return `<div class="card"><h3>${icon('cloud', 'sm')} Conta e sincronização</h3>${corpo}</div>`;
  }

  async function nuvemEntrar(criar) {
    const email = ($('#cEmail') || {}).value, senha = ($('#cSenha') || {}).value;
    if (!email || !senha) { toast('Preencha e-mail e senha'); return; }
    if (!window.CloudSync) { toast('Firebase ainda não carregou'); return; }
    try { await window.CloudSync[criar ? 'cadastrar' : 'login'](email.trim(), senha); toast(criar ? 'Conta criada' : 'Conectado'); }
    catch (e) { toast(erroAuth(e)); }
  }

  // sincroniza: lê o servidor, mescla e grava numa transação (aparelho desatualizado nunca sobrescreve o servidor)
  function adaptadorFirebase(uid) {
    return {
      sync: (local) => window.CloudSync.mesclarNaNuvem(uid, (remoto) => {
        const merged = C.mergeState(local, remoto || {});
        const dados = C.paraNuvem(merged);
        const tam = JSON.stringify(dados).length;
        if (tam > 950000) throw new Error('Dados passaram do limite de 1 MB do documento da nuvem. Exporte um backup e apague pregões antigos.');
        const gravar = !remoto || C.diffState(remoto, dados);
        dados.atualizadoEm = C.agora();
        return { gravar, dados, resultado: merged };
      }),
    };
  }

  async function aoEntrar(user) {
    const cs = window.CloudSync;
    const ultimo = localStorage.getItem('mp.cloud.uid');
    if (ultimo && ultimo !== user.uid && store.hasData()) {
      const v = await dialog({
        title: 'Dados de outra conta neste aparelho',
        text: 'Este aparelho tem pregões salvos de outra conta. O que fazer com eles?',
        buttons: [
          { label: 'Apagar os daqui e usar os desta conta', value: 'limpar', cls: 'primary' },
          { label: 'Mesclar com esta conta', value: 'mesclar' },
          { label: 'Sair da conta', value: 'sair', cls: 'danger' },
        ],
      });
      if (v === 'sair') { await cs.logout(); return; }
      if (v === 'limpar') store.replaceAll(C.emptyState());
    }
    localStorage.setItem('mp.cloud.uid', user.uid);
    S.configure(adaptadorFirebase(user.uid));
    // atualização ao vivo: mudanças feitas em outro aparelho chegam aqui (não reenvia: kind 'remote')
    sincronizarImagens();
    cs.ouvirImagens(user.uid, (dados) => { if (aplicarImagensRemotas(imgRemoto(dados))) { UI.keepScroll = true; if (UI.tab === 'pdf') render(); } });
    cs.ouvirMudancas(user.uid, (dados, doCache) => {
      Cloud.aoVivo = !doCache;
      if (!dados) { if (!doCache) { S.server = {}; S.schedule('nuvem vazia', 800); } updateStatusPill(); return; }
      store.mergeFrom(dados);
      if (!doCache) S.server = dados;   // só confia no que veio do servidor (a cópia do navegador pode estar velha)
      // se a nuvem está sem algo que este aparelho tem (gravação perdida ou atrasada), reconcilia sozinho
      if (C.diffState(dados, C.paraNuvem(store.get()))) S.schedule('reconciliar', 1200);
      updateStatusPill();
    });
    window.onCloudEscutaErro = () => { Cloud.aoVivo = false; updateStatusPill(); };
  }
  function aoSair() {
    if (window.CloudSync) window.CloudSync.pararDeOuvir();
    S.configure(null); S.server = null; S.confirmado = false;
  }

  /* ---------- verificar: compara este aparelho com o que está NO SERVIDOR (sem cópia do navegador) ---------- */
  async function verificarNuvem() {
    const cs = window.CloudSync, u = Cloud.user;
    if (!cs || !u) { toast('Entre na conta para verificar'); return; }
    if (!navigator.onLine) { toast('Sem internet: não dá para conferir agora'); return; }
    if (Guard.pending.size) commitAllPending();
    toast('Conferindo com a nuvem…');
    await S.run('verificar');   // envia o que estiver pendente antes de comparar
    let rem;
    try { rem = await cs.buscarDoServidor(u.uid); }
    catch (e) { dialog({ title: 'Não consegui falar com a nuvem', text: 'O servidor não respondeu (' + (e && (e.code || e.message) || 'erro') + '). Se este PC está numa rede de empresa, ela pode estar bloqueando o Firebase. Seus dados continuam salvos neste aparelho.', buttons: [{ label: 'OK', value: true, cls: 'primary' }] }); return; }
    S.server = rem || {};
    const fotos = await contarFotosPendentes();
    const loc = store.get(), R = C.migrate(rem || {});
    const ativos = (a) => a.filter((x) => !x.deleted).length;
    const pend = C.pendenciasNuvem(loc, rem || {}), novos = C.pendenciasNuvem(rem || {}, loc);
    const nome = (r) => r.numero ? 'Pregão ' + r.numero + ' · ' + (r.orgao || '') : 'Item ' + (r.itemEdital || '') + ' · ' + (r.descricao || '');
    const lista = (arr) => arr.slice(0, 12).map((r) => '<li>' + esc(nome(r)) + (r.deleted ? ' (excluído)' : '') + '</li>').join('') + (arr.length > 12 ? '<li>… e mais ' + (arr.length - 12) + '</li>' : '');
    const tam = JSON.stringify(C.paraNuvem(loc)).length;
    const ok = !pend.n && !novos.n && !fotos;
    const w = document.createElement('div'); w.className = 'dlg-wrap';
    w.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h3>${ok ? '✅ Tudo igual à nuvem' : '⚠️ Há diferenças'}</h3>
      <div class="vsync"><span class="h"></span><span class="h">Aqui</span><span class="h">Nuvem</span>
        <span>Pregões</span><b>${ativos(loc.pregoes)}</b><b>${ativos(R.pregoes)}</b>
        <span>Itens</span><b>${ativos(loc.itens)}</b><b>${ativos(R.itens)}</b>
        <span>Última gravação na nuvem</span><b></b><b>${rem && rem.atualizadoEm ? new Date(rem.atualizadoEm).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—'}</b></div>
      ${pend.n ? `<div class="vsync-dif"><b>Só neste aparelho (a nuvem não recebeu):</b><ul>${lista(pend.pregoes.concat(pend.itens))}${pend.config ? '<li>Configurações</li>' : ''}</ul></div>` : ''}
      ${novos.n ? `<div class="vsync-dif"><b>Na nuvem e ainda não aqui:</b><ul>${lista(novos.pregoes.concat(novos.itens))}</ul></div>` : ''}
      ${fotos ? `<div class="vsync-dif"><b>${fotos} item(ns) com fotos ainda só neste aparelho.</b></div>` : ''}
      <p class="tiny muted" style="margin-top:8px">Espaço usado na nuvem: ${Math.round(tam / 10000)}% do limite de 1 MB.${Cloud.relogio && Math.abs(Cloud.relogio.off) > 60000 ? ' Relógio deste PC ' + fmtDif(Cloud.relogio.off) + ': acerte a hora do Windows.' : ''}</p>
      <div class="btns">${ok ? '' : '<button type="button" class="btn primary" data-v="enviar">Enviar / trazer agora</button>'}<button type="button" class="btn ghost" data-v="ok">Fechar</button></div></div>`;
    document.body.appendChild(w);
    w.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-v]'); if (!b && e.target !== w) return;
      w.remove();
      if (b && b.dataset.v === 'enviar') { store.mergeFrom(rem || {}); await enviarFotosPendentes(); await S.run('forçar'); verificarNuvem(); }
    });
  }

  /* ---------- relógio deste aparelho x hora da internet ---------- */
  // a data de cada alteração decide qual versão vale; relógio errado = versão errada vencendo
  async function conferirRelogio() {
    try {
      const t0 = Date.now();
      const r = await fetch('./manifest.webmanifest?relogio=' + t0, { method: 'HEAD', cache: 'no-store' });
      const t1 = Date.now(), d = Date.parse(r.headers.get('date') || '');
      if (!isFinite(d)) return;
      const off = d + 500 - (t0 + t1) / 2;   // o cabeçalho tem precisão de segundos
      Cloud.relogio = { off, em: t1 }; updateStatusPill();
      C.setClockOffset(Math.abs(off) > 60000 ? off : 0);   // só corrige diferença acima de 1 min
      if (Math.abs(off) > 120000 && !conferirRelogio.avisou) { conferirRelogio.avisou = true; toast('O relógio deste computador está ' + fmtDif(off) + '. O app já corrige, mas acerte a hora do Windows.'); }
    } catch (e) { /* sem internet: tenta depois */ }
  }
  const fmtDif = (off) => { const m = Math.round(Math.abs(off) / 60000); return (m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min') + (off > 0 ? ' atrasado' : ' adiantado'); };

  // fotos do catálogo que ainda estão só neste aparelho
  async function contarFotosPendentes() {
    let n = 0;
    try { for (const id of await CatImg.keys()) { const r = await CatImg.getRec(id); if (r.pend) n += 1; } } catch (e) { /* ignora */ }
    if (Cloud.fotosPend !== n) { Cloud.fotosPend = n; updateStatusPill(); }
    return n;
  }
  // depois de cada sincronização: tenta mandar as fotos pendentes e reconta
  S.afterRun = () => { if (S.confirmado) enviarFotosPendentes().then(contarFotosPendentes); updateStatusPill(); };

  // ao sair da janela / fechar: grava o campo em edição e envia na hora (antes esperava 2,5 s e podia ficar para trás)
  function enviarAoSair() {
    try { if (Guard.pending.size) commitAllPending(); } catch (e) { /* ignora */ }
    if (S.enabled && S.pendentes().n > 0) S.run('saindo da janela');
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) enviarAoSair();
    else if (S.enabled) { S.run('voltou para a janela'); sincronizarImagens(); }
  });
  window.addEventListener('pagehide', enviarAoSair);
  window.addEventListener('beforeunload', (e) => {
    if (S.enabled && (S.pendentes().n > 0 || S.running)) { enviarAoSair(); e.preventDefault(); e.returnValue = ''; return ''; }
    return undefined;
  });
  // conferência periódica com a nuvem (a escuta ao vivo às vezes cai sem avisar, ex.: rede da empresa)
  setInterval(() => { if (S.enabled && !document.hidden) { S.run('conferência'); contarFotosPendentes(); } }, 120000);
  setInterval(conferirRelogio, 30 * 60000);
  conferirRelogio();

  async function iniciarNuvem(manual) {
    if (Cloud.ligado) return;
    Cloud.estado = 'carregando'; if (UI.tab === 'config') render();
    try {
      const cs = await window.carregarCloudSync();
      Cloud.ligado = true; Cloud.estado = 'pronto';
      cs.onAuthStateChanged(async (user) => {
        Cloud.user = user || null;
        try { if (user) await aoEntrar(user); else aoSair(); } catch (e) { console.error(e); }
        updateStatusPill(); if (UI.tab === 'config') render();
      });
    } catch (e) {
      Cloud.estado = 'erro';
      Cloud.erro = navigator.onLine ? 'Não consegui carregar o Firebase. Tente de novo em instantes.' : 'Sem internet: a conta e a sincronização voltam quando você estiver online.';
      if (manual) toast(Cloud.erro);
      if (UI.tab === 'config') render();
    }
  }

  /* ---------- inicialização ---------- */
  function buildShell() {
    $('#app').innerHTML = `<div class="shell">
      <header class="topbar"><img class="logo" src="icons/icon-96.png" alt="" width="34" height="34"><div class="grow"><h1>Meus Pregões</h1><div class="sub" id="subt"></div></div><button type="button" class="pill" id="pill" data-act="sync-pill" title="Sincronização: toque para conferir com a nuvem"></button></header>
      <nav class="nav" aria-label="Seções">${TABS.map((t) => `<button data-v="${t.id}" aria-label="${t.t}">${icon(t.id)}<span>${t.t}</span></button>`).join('')}</nav>
      <main class="main" id="main" tabindex="-1"></main></div>`;
    $('.nav').addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) setTab(b.dataset.v); });
    const main = $('#main');
    main.addEventListener('click', onClick);
    $('#pill').addEventListener('click', () => { if (S.enabled) verificarNuvem(); else setTab('config'); });
    // dica flutuante dos gráficos do dashboard (PC)
    let tipEl = null;
    const esconderTip = () => { if (tipEl) tipEl.style.display = 'none'; };
    main.addEventListener('mousemove', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (!el) { esconderTip(); return; }
      if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'dash-tip'; document.body.appendChild(tipEl); }
      tipEl.textContent = el.dataset.tip; tipEl.style.display = 'block';
      tipEl.style.left = Math.max(8, Math.min(window.innerWidth - tipEl.offsetWidth - 12, e.clientX + 14)) + 'px';
      tipEl.style.top = (e.clientY + 18) + 'px';
    });
    main.addEventListener('mouseleave', esconderTip);
    main.addEventListener('click', esconderTip);
    main.addEventListener('input', onInput);
    main.addEventListener('change', onChange);
    main.addEventListener('toggle', (e) => { const d = e.target; if (d && d.dataset && d.dataset.acc) { if (d.open) UI.acc.add(d.dataset.acc); else UI.acc.delete(d.dataset.acc); } }, true);
    main.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('article[data-act]')) { e.preventDefault(); e.target.click(); } });
    main.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.coloc) { e.preventDefault(); e.target.blur(); } });
  }

  function boot() {
    buildShell();
    store.on((kind) => {
      if (kind === 'error') { toast('Armazenamento do aparelho cheio. Exporte um backup e libere espaço.'); return; }
      if (kind !== 'remote') S.schedule('alteração');   // 'remote' = veio da nuvem: não reenvia (evita laço)
      if (kind === 'change' || kind === 'remote') render(); else updateStatusPill();
    });
    S.on(() => { updateStatusPill(); const m = $('#syncMsg'); if (m) m.textContent = S.message; });
    window.addEventListener('online', updateStatusPill); window.addEventListener('offline', updateStatusPill);
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); UI.deferredPrompt = e; if (UI.tab === 'config') render(); });
    window.addEventListener('appinstalled', () => { UI.deferredPrompt = null; toast('App instalado'); });

    // atalhos do manifesto (?acao=novo-pregao / ?tab=pdf)
    const q = new URLSearchParams(location.search);
    if (q.get('tab') && TABS.some((t) => t.id === q.get('tab'))) UI.tab = q.get('tab');
    render();
    if (q.get('acao') === 'novo-pregao') openPregaoForm();
    if (q.has('tab') || q.has('acao') || q.has('source')) history.replaceState(null, '', location.pathname);
    initSW();
    iniciarNuvem(false);                                   // carrega o Firebase sem travar a abertura
    window.addEventListener('online', () => { if (!Cloud.ligado) iniciarNuvem(false); else sincronizarImagens(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  window.__app = { store, UI, render, openPregaoForm, openItemForm, Guard, Sheet, Draft, downscaleImage }; // facilita testes/depuração
})();

</script>
</body>
</html>
