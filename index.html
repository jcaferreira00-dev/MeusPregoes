        nomeLinhas.forEach((l) => { pg.drawText(safe(l), { x: textoX, y: yy, size: 15, font: bold, color: ACCT }); yy -= 17; });
        yy += 17 - 13;
        linhasEmp.forEach((l) => { pg.drawText(safe(l), { x: textoX, y: yy, size: 8.5, font, color: GRAY }); yy -= 11; });
      }
      pg.drawLine({ start: { x: M, y: PH - TOPO - headerH + 8 }, end: { x: PW - M, y: PH - TOPO - headerH + 8 }, thickness: 1.2, color: ACC });
    }
    function novaPagina() {
      page = doc.addPage([PW, PH]); pages.push(page); desenharMarca(page); desenharCabecalho(page);
      y = headerH ? PH - TOPO - headerH - 4 : PH - M;
    }
    const garantir = (h) => { if (y - h < BOTTOM) { novaPagina(); return true; } return false; };
    const T = (t, x, yy, size, f, color) => page.drawText(safe(t), { x, y: yy, size, font: f || font, color: color || INK });
    const TR = (t, xr, yy, size, f, color) => { const s = safe(t); page.drawText(s, { x: xr - (f || font).widthOfTextAtSize(s, size), y: yy, size, font: f || font, color: color || INK }); };
    const TC = (t, xc, yy, size, f, color) => { const s = safe(t); page.drawText(s, { x: xc - (f || font).widthOfTextAtSize(s, size) / 2, y: yy, size, font: f || font, color: color || INK }); };
    const box = (x, yy, w, h, fill) => page.drawRectangle({ x, y: yy, width: w, height: h, borderColor: ACC, borderWidth: 1, color: fill, opacity: fill ? 1 : undefined });

    // texto com fontes misturadas (ex.: rótulo normal + valor em negrito), com quebra de linha
    function wrapMixed(segs, size, maxW) {
      const toks = [];
      for (const sg of segs) for (const w of safe(sg.t).split(/(\s+)/)) if (w !== '') toks.push({ t: w, f: sg.f, sp: /^\s+$/.test(w) });
      const wd = (arr) => arr.reduce((a, k) => a + k.f.widthOfTextAtSize(k.t, size), 0);
      const lines = []; let cur = [];
      for (const tk of toks) {
        if (tk.sp) { if (cur.length) cur.push(tk); continue; }
        if (cur.length && wd(cur) + tk.f.widthOfTextAtSize(tk.t, size) > maxW) {
          while (cur.length && cur[cur.length - 1].sp) cur.pop();
          lines.push(cur); cur = [];
        }
        cur.push(tk);
      }
      while (cur.length && cur[cur.length - 1].sp) cur.pop();
      if (cur.length) lines.push(cur);
      return lines.length ? lines : [[]];
    }
    function drawMixed(line, x, yy, size, color) { let cx = x; for (const tk of line) { page.drawText(tk.t, { x: cx, y: yy, size, font: tk.f, color: color || rgb(0, 0, 0) }); cx += tk.f.widthOfTextAtSize(tk.t, size); } }
    // quadro "DADOS DO FORNECEDOR" (usado nos dois modelos). campos = {id: true/false}; borda = cor da moldura
    function blocoFornecedor(campos, borda) {
      const val = { fornecedor: emp.nome, cnpj: emp.cnpj || emp.cpf, ie: emp.ie, endereco: emp.endereco, bairro: emp.bairro, cep: emp.cep, cidade: emp.cidade, uf: emp.uf, telefone: emp.telefone, email: emp.email, banco: emp.banco, agencia: emp.agencia, conta: emp.conta, pix: emp.pix };
      const rot = { fornecedor: 'Fornecedor:', cnpj: 'CNPJ/CPF:', ie: 'Inscrição Estadual:', endereco: 'Endereço:', bairro: 'Bairro:', cep: 'CEP:', cidade: 'Cidade:', uf: 'Estado:', telefone: 'Telefone:', email: 'e-mail:', banco: 'Banco:', agencia: 'Agência:', conta: 'Conta-corrente:', pix: 'PIX:' };
      const posX = { fornecedor: 0, cnpj: 0, ie: 0.46, endereco: 0, bairro: 0, cep: 0, cidade: 0.335, uf: 0.59, telefone: 0, email: 0.46, banco: 0, agencia: 0.335, conta: 0.59, pix: 0 };
      const rowsDef = [['fornecedor'], ['cnpj', 'ie'], ['endereco'], ['bairro'], ['cep', 'cidade', 'uf'], ['telefone', 'email'], ['banco', 'agencia', 'conta'], ['pix']];
      const inner = CW - 16, preto = rgb(0, 0, 0);
      const rows = rowsDef.map((r) => r.filter((f) => campos[f])).filter((r) => r.length).map((r) => {
        const cells = r.map((f, k) => {
          const x = M + 8 + posX[f] * inner;
          const nx = k + 1 < r.length ? M + 8 + posX[r[k + 1]] * inner : M + CW - 8;
          const ls = wrapMixed([{ t: rot[f] + ' ', f: font }, { t: val[f] || '', f: bold }], 10.5, Math.max(40, nx - x - 8));
          return { x, ls };
        });
        return { cells, h: Math.max(...cells.map((c) => c.ls.length)) * 13 + 8 };
      });
      if (!rows.length) return;
      const total = rows.reduce((a, r) => a + r.h, 0) + 8;
      garantir(total + 22);
      TC('DADOS DO FORNECEDOR', PW / 2, y - 11, 11.5, font, preto); y -= 18;
      page.drawRectangle({ x: M, y: y - total, width: CW, height: total, borderColor: borda, borderWidth: 1 });
      let yy = y - 4;
      rows.forEach((r) => { r.cells.forEach((c) => c.ls.forEach((l, j) => drawMixed(l, c.x, yy - 12 - j * 13, 10.5, preto))); yy -= r.h; });
      y -= total + 14;
    }

    novaPagina();

    if (op.modelo !== 'descritivo') {
    /* ===== 2) GRADE DE DADOS (órgão, processo, validade, pagamento, entrega) ===== */
    function grade(pares) {
      for (let i = 0; i < pares.length; i += 2) {
        const par = pares.slice(i, i + 2);
        const cw = CW / 2;
        const lines = par.map(([, v]) => wrap(v || '—', font, 11, cw - 10));
        const h = Math.max(40, 24 + Math.max(...lines.map((l) => l.length)) * 13);
        garantir(h + 2);
        par.forEach(([lab], k) => {
          const x = M + k * cw;
          box(x, y - h, cw, h);
          T(lab, x + 4, y - 13, 10.5, font, ACC);
          lines[k].forEach((l, j) => T(l, x + 4, y - 27 - j * 13, 11, font, INK));
        });
        y -= h;
      }
    }
    const prazoEnt = o.prazoEntrega || (preg.prazoEntregaDias ? preg.prazoEntregaDias + ' dias' : 'Conforme edital');
    if (op.com.grade) {
      grade([
        ['ÓRGÃO / CLIENTE', preg.orgao], ['PROCESSO', preg.numero],
        ['VALIDADE DA PROPOSTA', (o.validadeDias || 60) + ' dias'], ['PRAZO DE PAGAMENTO', o.condPagamento || 'Conforme edital'],
        ['LOCAL DE ENTREGA', o.localEntrega || C.localEntregaPadrao(preg, itensPdf)], ['PRAZO DE ENTREGA', prazoEnt],
      ]);
      y -= 10;
    }

    /* ===== 2b) DADOS DO FORNECEDOR (opcional no modelo comercial) ===== */
    if (op.com.fornecedor) {
      const cf = Object.assign({}, op.desc.campos);
      if (op.com.bancarios) { cf.banco = false; cf.agencia = false; cf.conta = false; cf.pix = false; }
      blocoFornecedor(cf, ACC);
    }
    /* ===== 3) DADOS BANCÁRIOS ===== */
    const temBanco = o.incluirBancarios && [emp.banco, emp.agencia, emp.conta, emp.pix, emp.favorecido].some(Boolean);
    if (temBanco) {
      garantir(24 + 3 * 40);
      T('DADOS BANCÁRIOS', M + 8, y - 12, 12, font, INK); y -= 18;
      grade([
        ['BANCO', emp.banco], ['AGÊNCIA', emp.agencia],
        ['CONTA', emp.conta], ['PIX', emp.pix],
        ['FAVORECIDO', emp.favorecido || emp.nome], ['CNPJ DA EMPRESA', emp.cnpj],
      ]);
      y -= 10;
    }

    const fmtNum = (n) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    const brlTxt = (n) => 'R$ ' + fmtNum(n);
    /* ===== 4) ITENS DA PROPOSTA (um bloco por item) ===== */
    if (op.com.itens) {
    garantir(24 + 90);
    T('ITENS DA PROPOSTA', M + 8, y - 12, 12, font, INK); y -= 18;
    const fr = [0.14, 0.34, 0.12, 0.09, 0.15, 0.16];
    const cx = []; { let a = M; for (const f of fr) { cx.push([a, f * CW]); a += f * CW; } }
    const heads = ['Item', 'Descrição', 'Unid', 'Qtd', 'Valor Unit. (R$)', 'Valor Total (R$)'];

    if (!L.linhas.length) { garantir(24); T('Nenhum item cadastrado neste pregão.', M + 8, y - 12, 10, ital, GRAY); y -= 24; }
    for (const ln of L.linhas) {
      const descL = wrap(ln.descEdital, font, 10, CW - 14);
      const marcaL = wrap('MARCA/MODELO: ' + (ln.marca || '—'), font, 9.5, CW - 14);
      const hHead = 19, hRow = 24, hDesc = descL.length * 12.5 + 10, hMarca = marcaL.length * 12 + 8;
      const total = hHead + hRow + hDesc + hMarca;
      garantir(total + 2);
      // faixa de cabeçalho
      page.drawRectangle({ x: M, y: y - hHead, width: CW, height: hHead, color: ACC, borderColor: ACC, borderWidth: 1 });
      heads.forEach((t, k) => {
        const [x, w] = cx[k];
        const fs = fitSize(t, bold, 9.5, w - 8, 6);
        if (k <= 1) T(t, x + 4, y - 13.2 + (9.5 - fs) / 2, fs, bold, WHITE); else TC(t, x + w / 2, y - 13.2 + (9.5 - fs) / 2, fs, bold, WHITE);
      });
      y -= hHead;
      // linha principal
      box(M, y - hRow, CW, hRow);
      const vals = [`ITEM ${ln.numeroItem}`, 'Ver descrição abaixo', ln.un.toUpperCase(),
        new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 }).format(ln.qtd),
        ln.unit !== null ? brlTxt(ln.unit) : '—', ln.total !== null ? brlTxt(ln.total) : '—'];
      vals.forEach((t, k) => {
        const [x, w] = cx[k];
        const f = k === 1 ? bold : font;
        const fs = fitSize(t, f, 10, w - 8, 6);
        if (k <= 1) T(t, x + 4, y - 16 + (10 - fs) / 2, fs, f, ACCT); else TC(t, x + w / 2, y - 16 + (10 - fs) / 2, fs, f, ACCT);
      });
      y -= hRow;
      // descrição completa
      box(M, y - hDesc, CW, hDesc);
      descL.forEach((l, j) => T(l, M + 7, y - 15 - j * 12.5, 10, font, ACCT));
      y -= hDesc;
      // marca / modelo
      box(M, y - hMarca, CW, hMarca);
      marcaL.forEach((l, j) => T(l, M + 7, y - 14 - j * 12, 9.5, font, ACCT));
      y -= hMarca;
    }

    }
    /* ===== 5) RESUMO COMERCIAL ===== */
    garantir(80);
    y -= 12;
    if (op.com.resumo) {
      T('Resumo Comercial', M, y - 12, 12.5, bold, ACC); y -= 18;
      box(M, y - 18, CW, 18);
      T('Valor global da proposta', M + 4, y - 12.5, 10.5, bold, ACCT);
      TR(brlTxt(L.total), PW - M - 6, y - 12.5, 10.5, bold, ACCT);
      y -= 18 + 8;
    }
    if (o.incluirExtenso && L.total > 0) {
      const ln = wrap('Valor por extenso: ' + cap(valorExtenso(L.total)) + '.', font, 11.5, CW - 30);
      ln.forEach((l, i) => {
        garantir(14);
        if (i === 0) { T('Valor por extenso:', M + 14, y - 11, 11.5, bold, INK); T(l.slice('Valor por extenso:'.length), M + 14 + bold.widthOfTextAtSize('Valor por extenso:', 11.5), y - 11, 11.5, font, INK); }
        else T(l, M + 14, y - 11, 11.5, font, INK);
        y -= 14;

      y -= 4;
    }
    if (L.semValor > 0) {
      const ln = wrap('Atenção: ' + L.semValor + ' item(ns) sem valor definido nesta proposta.', bold, 9.5, CW);
      ln.forEach((l) => { garantir(14); T(l, M, y - 10, 9.5, bold, rgb(0.75, 0.2, 0.1)); y -= 13; });
    }
    if (op.com.observacoes && o.observacoes) {
      y -= 4; garantir(30);
      T('Observações:', M + 14, y - 10, 10.5, bold, INK); y -= 15;
      wrap(o.observacoes, font, 10.5, CW - 30).forEach((l) => { garantir(14); T(l, M + 14, y - 10, 10.5, font, INK); y -= 13.5; });
    }

    /* ===== 6) DECLARAÇÃO (opcional) ===== */
    if (o.incluirDeclaracao && o.textoDeclaracao) {
      y -= 8; garantir(50);
      wrap(o.textoDeclaracao, font, 10, CW - 30).forEach((l) => { garantir(14); T(l, M + 14, y - 10, 10, font, INK); y -= 13; });
    }

    /* ===== 7) LOCAL/DATA (opcional) E ASSINATURA ===== */
    if (o.incluirLocalData || op.com.assinatura) {
      garantir(o.incluirLocalData ? 120 : 96);
      y -= 14;
      if (o.incluirLocalData) {
        T([o.local, C.dataExtensa(o.data)].filter(Boolean).join(', ') + '.', M + 14, y - 10, 10.5, font, INK); y -= 34;
      } else y -= 20;
    }
    if (op.com.assinatura) {
      const sigW = 250, sx = (PW - sigW) / 2;
      page.drawLine({ start: { x: sx, y }, end: { x: sx + sigW, y }, thickness: 1, color: INK });
      const nome = (emp.responsavel || emp.nome || '').toUpperCase();
      const doc2 = emp.cpf ? 'CPF: ' + emp.cpf : (emp.cnpj ? 'CNPJ: ' + emp.cnpj : '');
      if (nome && op.com.assinaturaNome) TC(nome, PW / 2, y - 13, 10.5, bold, INK);
      if (doc2 && op.com.assinaturaDoc) TC(doc2, PW / 2, y - 26, 10.5, bold, INK);
      y -= 34;
    }

    } else {
    /* =====================================================================
     * MODELO "DESCRITIVO DO EDITAL" (ex.: Anexo III - Modelo de descritivo da proposta de preços)
     * Cada bloco abaixo tem uma chavinha em op.desc.* (aba Proposta). Para mudar o layout, mexa aqui.
     * ===================================================================== */
    const D = op.desc, BLK = rgb(0, 0, 0), CINZA = rgb(0.9, 0.9, 0.9), AZUL = rgb(0.72, 0.78, 0.89);
    const fN = (n) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    const bT = (n) => (n === null || n === undefined) ? '—' : 'R$ ' + fN(n);
    const subst = (t, c) => safe(t)
      .replace(/\{validade\}/g, `${op.validade} (${inteiroExtenso(Number(op.validade) || 0)}) dias`)
      .replace(/\{prorrogacao\}/g, `${op.prorrogacao} (${inteiroExtenso(Number(op.prorrogacao) || 0)}) dias`)
      .replace(/\{numero\}/g, preg.numero || '').replace(/\{orgao\}/g, preg.orgao || '').replace(/\{pai\}/g, (c && c.paiRotulo) || '4');

    // --- títulos e faixa do edital
    if (D.titulo) {
      [D.titulo1, D.titulo2].filter(Boolean).forEach((t) => { garantir(20); TC(subst(t), PW / 2, y - 12, 12.5, bold, BLK); y -= 16; });
      y -= 6;
    }
    if (D.faixa && D.faixaTexto) {
      garantir(30);
      page.drawRectangle({ x: M, y: y - 22, width: CW, height: 22, color: CINZA, borderColor: BLK, borderWidth: 1 });
      TC(subst(D.faixaTexto), PW / 2, y - 15, 11.5, bold, BLK);
      y -= 22 + 14;
    }

    // --- dados do fornecedor (cada campo liga/desliga; posições fixas para manter o alinhamento)
    if (D.fornecedor) blocoFornecedor(D.campos, BLK);

    // --- objeto da licitação
    if (D.objeto && D.objetoTexto) {
      wrapMixed([{ t: (D.objetoPrefixo ? D.objetoPrefixo + ' ' : ''), f: font }, { t: D.objetoTexto, f: bold }], 11, CW - 4)
        .forEach((l) => { garantir(15); drawMixed(l, M + 2, y - 11, 11); y -= 14.5; });
      y -= 10;
    }

    // --- tabela de especificações técnicas (cada coluna liga/desliga)
    if (D.tabela) {
      if (D.tabelaTitulo) { garantir(40); T(D.tabelaTitulo, M + 2, y - 11, 11.5, bold, BLK); y -= 17; }
      const rotC = { lote: D.rotuloItem || 'Lote', desc: 'Descrição', marca: 'Marca/Modelo', un: 'Unid.', qtd: 'Quantidade', vub: 'Valor Unitário Bruto', vtb: 'Valor Total Bruto', vus: 'Valor Unitário s/ ICMS', vts: 'Valor Total s/ ICMS', aliq: 'Alíquota % ICMS' };
      const cols = C.COLUNAS_DESC.filter(([id]) => D.colunas[id]).map(([id, , w]) => ({ id, w }));
      const wsum = cols.reduce((a, c) => a + c.w, 0) || 1;
      cols.forEach((c) => { c.pw = CW * c.w / wsum; });
      const cellTxt = (c, ln) => ({
        lote: ln.numeroItem, desc: ln.descEdital, marca: ln.marca || '—', un: ln.un, qtd: new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 }).format(ln.qtd),
        vub: bT(ln.unit), vtb: bT(ln.total), vus: bT(ln.unitS), vts: bT(ln.totalS), aliq: fN(ln.aliq * 100) + '%',
      })[c.id];
      const cabecalhoTab = () => {
        // fonte do cabeçalho: a maior palavra precisa caber inteira na coluna (sem quebrar no meio da palavra)
        const hfs = (c) => Math.min(...safe(rotC[c.id]).split(/\s+/).map((wd) => fitSize(wd, bold, 9, c.pw - 6, 6)));
        const hs = cols.map((c) => wrap(rotC[c.id], bold, hfs(c), c.pw - 6));
        const h = Math.max(...hs.map((x) => x.length)) * 11 + 9;
        garantir(h + 30);
        let x = M;
        cols.forEach((c, k) => {
          page.drawRectangle({ x, y: y - h, width: c.pw, height: h, color: AZUL, borderColor: BLK, borderWidth: 0.9 });
          const fs = hfs(c), off = (h - hs[k].length * 11) / 2;      // centraliza o bloco de texto na vertical
          hs[k].forEach((l, j) => TC(l, x + c.pw / 2, y - off - 7.5 - j * 11, fs, bold, BLK));
          x += c.pw;
        });
        y -= h;
      };
      if (cols.length) {
        cabecalhoTab();
        L.linhas.forEach((ln) => {
          const fsz = cols.map((c) => (c.id === 'desc' || c.id === 'marca') ? 9 : fitSize(String(cellTxt(c, ln)), font, 9, c.pw - 8, 6.5));
          const cells = cols.map((c, k) => wrap(String(cellTxt(c, ln)), font, fsz[k], c.pw - 8));
          const h = Math.max(...cells.map((x) => x.length)) * 11 + 8;
          if (y - h < BOTTOM) { novaPagina(); cabecalhoTab(); }
          let x = M;
          cols.forEach((c, k) => {
            page.drawRectangle({ x, y: y - h, width: c.pw, height: h, borderColor: BLK, borderWidth: 0.9 });
            const off = (h - cells[k].length * 11) / 2;                 // centraliza na vertical quando a linha tem mais altura
            cells[k].forEach((l, j) => {
              const w = font.widthOfTextAtSize(safe(l), fsz[k]);
              const left = c.id === 'desc' || c.id === 'marca';
              const tx = left ? x + 4 : x + (c.pw - w) / 2;
              T(l, tx, y - off - 7.5 - j * 11, fsz[k], font, BLK);
            });
            x += c.pw;
          });
          y -= h;
        });
        if (!L.linhas.length) { garantir(20); T('Nenhum item cadastrado neste pregão.', M + 4, y - 14, 9.5, ital, GRAY); y -= 22; }
      }
      y -= 6;
      if (D.total) {
        garantir(30);
        const partes = ['Valor total da proposta: ' + bT(L.total)];
        if (D.colunas.vts) partes.push('Valor total s/ ICMS: ' + bT(L.totalS));
        partes.forEach((t) => { garantir(16); TR(t, PW - M - 2, y - 11, 10.5, bold, BLK); y -= 15; });
        if (D.extenso && L.total > 0) {
          wrap('Valor por extenso: ' + cap(valorExtenso(L.total)) + '.', font, 10.5, CW - 10).forEach((l) => { garantir(14); T(l, M + 2, y - 11, 10.5, font, BLK); y -= 13.5; });
        }
        y -= 4;
      }
      if (L.semValor > 0) { garantir(16); T('Atenção: ' + L.semValor + ' item(ns) sem valor definido nesta proposta.', M + 2, y - 11, 9.5, bold, rgb(0.75, 0.2, 0.1)); y -= 16; }
      y -= 6;
    }

    // --- cláusulas numeradas (2, 3, 4, 4.1, 4.2, 5, 6…): cada uma liga/desliga e o texto é editável
    C.numerarClausulas(D.clausulas, D.tabela ? 2 : 1).forEach((c) => {
      const txt = subst(c.texto, c);
      if (!txt.trim()) return;
      const ls = wrapMixed([{ t: c.rotulo + ' ', f: bold }, { t: txt, f: font }], 10.5, CW - 6);
      ls.forEach((l, j) => { garantir(15); drawMixed(l, M + 2, y - 11, 10.5); y -= 13.5; });
      y -= 4;
    });

    // --- local e data
    if (D.localData) {
      garantir(60); y -= 14;
      const ano = new Date().getFullYear();
      const txt = D.localDataModo === 'branco'
        ? `______________________, ____ de ______________________ de ${ano}.`
        : [emp.cidade, C.dataExtensa(o.data)].filter(Boolean).join(', ') + '.';
      TC(txt, PW / 2, y - 11, 11, font, BLK); y -= 36;
    }
    // --- assinatura
    if (D.assinatura) {
      garantir(70); if (!D.localData) y -= 24;
      const sigW = 260, sx = (PW - sigW) / 2;
      page.drawLine({ start: { x: sx, y }, end: { x: sx + sigW, y }, thickness: 0.9, color: BLK });
      let yy = y - 14;
      if (D.assinaturaRotulo) { TC(D.assinaturaRotulo, PW / 2, yy, 11, font, BLK); yy -= 13; }
      const nm = (emp.responsavel || emp.nome || '').toUpperCase();
      const dc = emp.cpf ? 'CPF: ' + emp.cpf : (emp.cnpj ? 'CNPJ: ' + emp.cnpj : '');
      if (D.assinaturaNome && nm) { TC(nm, PW / 2, yy, 10.5, bold, BLK); yy -= 13; }
      if (D.assinaturaDoc && dc) { TC(dc, PW / 2, yy, 10.5, font, BLK); yy -= 13; }
      y = yy;
    }
    }

    /* ===== numeração de páginas (só se houver mais de uma) ===== */
    if (pages.length > 1) {
      pages.forEach((pg, i) => {
        const pt = `Página ${i + 1} de ${pages.length}`;
        pg.drawText(pt, { x: PW / 2 - font.widthOfTextAtSize(pt, 8) / 2, y: 20, size: 8, font, color: GRAY });
      });
    }

    const bytes = await doc.save();
    const filename = `Proposta_${slug(preg.numero) || 'compra'}_${slug(preg.orgao) || 'orgao'}.pdf`;
    return { bytes, filename, total: L.total, linhas: L.linhas.length, semValor: L.semValor, paginas: pages.length };
  }

  const api = { gerarProposta, valorExtenso, inteiroExtenso };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.PropostaPDF = api;
})(typeof window !== 'undefined' ? window : globalThis);

  };
  const icon = (n, cls) => `<svg class="i ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

  /* ---------- estado da interface ---------- */
  const UI = {
    tab: 'painel', detailId: null, filtro: 'todos', busca: '', buscaI: '',
    pdf: { pregaoId: null, fonte: 'auto', data: C.hojeISO(), busy: false, result: null }, acc: new Set(['acc-forn']),
    ignorePop: 0, deferredPrompt: null, reloadPending: false, updateBanner: false,
  };
  try {
    const s = JSON.parse(localStorage.getItem('mp.ui') || '{}');
    if (s.tab) UI.tab = s.tab;
    if (s.pdfPregao) UI.pdf.pregaoId = s.pdfPregao;
    if (s.fonte) UI.pdf.fonte = s.fonte;
  } catch (e) { /* ignora */ }
  const saveUI = () => { try { localStorage.setItem('mp.ui', JSON.stringify({ tab: UI.tab, pdfPregao: UI.pdf.pregaoId, fonte: UI.pdf.fonte })); } catch (e) { /* ignora */ } };

  const TABS = [
    { id: 'painel', t: 'Painel', title: 'Visão geral' },
    { id: 'pregoes', t: 'Pregões', title: 'Pregões e compras' },
    { id: 'itens', t: 'Itens', title: 'Itens e valor mínimo' },
    { id: 'pdf', t: 'Proposta', title: 'Proposta em PDF' },
    { id: 'config', t: 'Config', title: 'Configurações' },
  ];

  /* ---------- proteção: rascunhos e saída sem salvar ---------- */
  const Guard = { pending: new Set() };
  const Sheet = { current: null };
  const isDirty = () => !!(Sheet.current && Sheet.current.dirty) || Guard.pending.size > 0;

  const Draft = {
    k: (key) => 'mp.draft:' + key,
    save(key, data) { try { localStorage.setItem(this.k(key), JSON.stringify({ t: Date.now(), data })); } catch (e) { /* ignora */ } },
    load(key) { try { const r = localStorage.getItem(this.k(key)); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
    clear(key) { try { localStorage.removeItem(this.k(key)); } catch (e) { /* ignora */ } },
    all() {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('mp.draft:')) { try { out.push({ key: k.slice(9), t: JSON.parse(localStorage.getItem(k)).t }); } catch (e) { /* ignora */ } }
      }
      return out.sort((a, b) => b.t - a.t);
    },
  };

  window.addEventListener('beforeunload', (e) => {
    if (isDirty()) { e.preventDefault(); e.returnValue = ''; return ''; }
    return undefined;
  });

  /* ---------- toast e diálogos ---------- */
  let toastT;
  function toast(msg) {
    $$('.toast').forEach((t) => t.remove());
    const el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3200);
  }
  function dialog({ title, text, buttons }) {
    return new Promise((resolve) => {
      const w = document.createElement('div');
      w.className = 'dlg-wrap';
      w.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text || '')}</p><div class="btns">${
        buttons.map((b, i) => `<button type="button" class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
      document.body.appendChild(w);
      const done = (v) => { w.remove(); resolve(v); };
      w.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) done(buttons[+b.dataset.i].value); });
      const first = $('button', w); if (first) first.focus();
    });
  }
  const confirmar = (title, text, ok, danger) => dialog({ title, text, buttons: [{ label: ok, value: true, cls: danger ? 'danger' : 'primary' }, { label: 'Cancelar', value: false, cls: 'ghost' }] });

  /* ---------- formulários (sheet) com rascunho automático ---------- */
  const readForm = (form) => {
    const o = {};
    for (const el of form.elements) if (el.name) o[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    return o;
  };
  const applyValues = (form, vals) => {
    for (const el of form.elements) {
      if (el.name && Object.prototype.hasOwnProperty.call(vals, el.name)) {
        if (el.type === 'checkbox') el.checked = !!vals[el.name]; else el.value = vals[el.name];
      }
    }
  };

  function field(o) {
    const id = 'f_' + o.name;
    const cls = o.full ? 'field full' : 'field';
    let ctl;
    if (o.type === 'textarea') ctl = `<textarea class="input" id="${id}" name="${o.name}" placeholder="${esc(o.ph || '')}" rows="2">${esc(o.value)}</textarea>`;
    else if (o.type === 'select') ctl = `<select class="input" id="${id}" name="${o.name}">${o.options.map((x) => `<option value="${esc(x.v)}"${String(x.v) === String(o.value) ? ' selected' : ''}>${esc(x.l)}</option>`).join('')}</select>`;
    else ctl = `<input class="input" id="${id}" name="${o.name}" type="${o.type || 'text'}" value="${esc(o.value)}" placeholder="${esc(o.ph || '')}"${o.inputmode ? ` inputmode="${o.inputmode}"` : ''} autocomplete="off"${o.type === 'datetime-local' || o.type === 'date' ? '' : ' autocapitalize="sentences"'}>`;
    return `<div class="${cls}"><label for="${id}">${esc(o.label)}</label>${ctl}${o.hint ? `<div class="hint">${esc(o.hint)}</div>` : ''}</div>`;
  }

  function openForm(o) {
    if (Sheet.current) closeSheetNow();
    const draft = Draft.load(o.key);
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = `<div class="sheet-backdrop"></div>
      <section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">
        <header class="sheet-head"><button type="button" class="icon-btn" data-sh="close" aria-label="Fechar">${icon('x')}</button><h2>${esc(o.title)}</h2></header>
        <form class="sheet-form" novalidate>
          <div class="sheet-body">${o.top || ''}<div data-slot="draft"></div>${o.body}${o.onDelete ? `<div style="margin-top:8px"><button type="button" class="btn danger block" data-sh="delete">${icon('trash')} ${esc(o.deleteLabel || 'Excluir')}</button></div>` : ''}</div>
          <div class="sheet-foot"><button type="button" class="btn ghost" data-sh="close">Cancelar</button><button type="submit" class="btn primary">${esc(o.saveLabel || 'Salvar')}</button></div>
        </form>
      </section>`;
    document.body.appendChild(wrap);
    document.body.style.overflow = 'hidden';
    const form = $('form', wrap);
    const ctl = { key: o.key, el: wrap, form, dirty: false };
    Sheet.current = ctl;
    history.pushState({ sheet: o.key }, '');

    const restoreOriginal = () => { applyValues(form, o.values); Draft.clear(o.key); ctl.dirty = false; $('[data-slot="draft"]', wrap).innerHTML = ''; if (o.onInput) o.onInput(form); };
    if (draft) {
      applyValues(form, draft.data);
      ctl.dirty = true;
      const quando = new Date(draft.t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      $('[data-slot="draft"]', wrap).innerHTML = `<div class="draftbar">${icon('alert', 'sm')}<span>Rascunho não salvo recuperado (${quando})</span><button type="button" data-sh="discard-draft">Descartar</button></div>`;
    }

    const onInput = () => { ctl.dirty = true; Draft.save(o.key, readForm(form)); if (o.onInput) o.onInput(form); };
    form.addEventListener('input', onInput);
    form.addEventListener('change', onInput);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const res = o.onSave(readForm(form), form);
      if (res === true) { Draft.clear(o.key); ctl.dirty = false; closeSheetNow(); if (o.afterSave) o.afterSave(); }
      else if (typeof res === 'string') toast(res);
    });
    wrap.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-sh]');
      if (e.target.classList.contains('sheet-backdrop')) { requestClose(); return; }
      if (!b) return;
      const a = b.dataset.sh;
      if (a === 'close') requestClose();
      else if (a === 'discard-draft') restoreOriginal();
      else if (a === 'delete' && o.onDelete) { if (await o.onDelete()) { Draft.clear(o.key); ctl.dirty = false; closeSheetNow(); } }
    });

    ctl.requestClose = requestClose;
    async function requestClose() {
      if (ctl.dirty) {
        const v = await dialog({
          title: 'Sair sem salvar?',
          text: 'Você começou a preencher e ainda não salvou. O que foi digitado fica guardado como rascunho neste aparelho.',
          buttons: [
            { label: 'Continuar editando', value: 'ficar', cls: 'primary' },
            { label: 'Sair e manter rascunho', value: 'manter' },
            { label: 'Descartar o que digitei', value: 'descartar', cls: 'danger' },
          ],
        });
        if (v === 'ficar') return false;
        if (v === 'descartar') Draft.clear(o.key);
      }
      closeSheetNow();
      return true;
    }
    if (o.onMount) o.onMount(form, ctl);
    if (o.onInput) o.onInput(form);
    const first = $('input[type=text],textarea', form); if (first && !draft && !o.values._noFocus) setTimeout(() => first.focus({ preventScroll: true }), 250);
    return ctl;
  }

  function closeSheetNow() {
    const c = Sheet.current;
    if (!c) return;

    if (history.state && history.state.sheet) { UI.ignorePop++; history.back(); }

  window.addEventListener('popstate', async () => {

  /* ---------- editores ---------- */
  const activePregoes = () => store.get().pregoes.filter((p) => !p.deleted);
  const pregaoLabel = (p) => `#${p.numero} — ${p.orgao}`;

  function pregaoValues(p) {
    return {
      numero: p.numero || '', orgao: p.orgao || '', cidadeUf: p.cidadeUf || '', sessao: p.sessao || '', prazoPropostas: p.prazoPropostas || '',

      km: p.km ? C.numBR(p.km, 1) : '', viagens: p.viagens == null ? '1' : String(p.viagens), pedagio: p.pedagio ? C.numBR(p.pedagio) : '',
      entregaDiferente: !!p.entregaDiferente, locaisEntrega: p.locaisEntrega || '',
      link: p.link || '', obs: p.obs || '',
    };
  }
  /* ---------- trajeto automático (OpenStreetMap: Nominatim para achar o local, OSRM para a distância por estrada) ---------- */
  const Rota = (() => {
    const KEY = 'mp.geo';
    let cache = {}; try { cache = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { cache = {}; }
    const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch (e) { /* ignora */ } };
    let ultima = 0;
    async function geocodar(txt) {
      const q = String(txt || '').replace(/\s*\/\s*/g, ', ').replace(/\s+/g, ' ').trim();
      if (!q) return null;
      const k = q.toLowerCase();
      if (cache[k]) return cache[k];
      const espera = ultima + 1100 - Date.now();
      if (espera > 0) await new Promise((r) => setTimeout(r, espera));
      ultima = Date.now();
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&q=' + encodeURIComponent(q));
      if (!r.ok) throw new Error('geo');
      const j = await r.json();
      if (!j.length) return null;
      const pt = { lat: Number(j[0].lat), lon: Number(j[0].lon) };
      cache[k] = pt; salvar();
      return pt;
    }
    async function calcular(emp, destinos) {
      emp = emp || {};
      const cidade = [emp.cidade, emp.uf].filter(Boolean).join(', ');
      if (!cidade && !emp.endereco) throw new Error('Preencha a cidade da sua empresa em Config › Empresa para calcular o trajeto.');
      try {
        let o = null;
        if (emp.endereco && cidade) o = await geocodar([emp.endereco, emp.bairro, cidade].filter(Boolean).join(', '));
        if (!o && cidade) o = await geocodar(cidade);
        if (!o) throw new Error('Não encontrei o endereço da sua empresa no mapa. Confira Config › Empresa.');
        const pts = [o];
        for (const d of destinos) {
          const g = await geocodar(d);
          if (!g) throw new Error('Não encontrei “' + d + '” no mapa. Confira o nome da cidade e a UF.');
          pts.push(g);
        }
        pts.push(o);
        const coords = pts.map((x) => x.lon.toFixed(6) + ',' + x.lat.toFixed(6)).join(';');
        const r = await fetch('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=false');
        if (!r.ok) throw new Error('rota');
        const j = await r.json();
        if (!j.routes || !j.routes[0]) throw new Error('Não foi encontrada rota de carro até esse local.');
        const nome = emp.cidade ? [emp.cidade, emp.uf].filter(Boolean).join('/') : 'sua empresa';
        return { km: Math.round(j.routes[0].distance / 100) / 10, rotulo: [nome].concat(destinos, [nome]).join(' → ') };
      } catch (e) {
        if (e && e.message && e.message.length > 6 && e.message !== 'geo' && e.message !== 'rota') throw e;
        throw new Error('Não foi possível calcular o trajeto agora (sem internet ou serviço indisponível). Informe o km manualmente.');
      }
    }
    return { calcular };
  })();

  /* ---------- prazo de envio das propostas: cor muda com 2 dias (amarelo) e 1 dia ou menos (vermelho) ---------- */
  function prazoInfo(p) {
    if (!p || !p.prazoPropostas) return null;
    const alvo = new Date(p.prazoPropostas);
    if (!isFinite(alvo.getTime())) return null;
    const ini = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const agora = new Date();
    const dias = Math.round((ini(alvo) - ini(agora)) / 86400000);
    const quando = C.fmtSessao(p.prazoPropostas);
    const hora = (/T(\d{2}:\d{2})/.exec(p.prazoPropostas) || [])[1];
    const pendente = ['Falta dados', 'Analisando'].includes(p.status);   // só alerta enquanto a proposta ainda não foi enviada
    if (!pendente) return { nivel: 'ok', texto: 'Propostas até ' + quando };
    if (alvo.getTime() < agora.getTime()) return { nivel: 'off', texto: 'Prazo de propostas encerrado (' + quando + ')' };
    if (dias <= 0) return { nivel: 'bad', texto: 'Propostas: hoje' + (hora ? ' até ' + hora : '') };
    if (dias === 1) return { nivel: 'bad', texto: 'Propostas: falta 1 dia (' + quando + ')' };
    if (dias === 2) return { nivel: 'warn', texto: 'Propostas: faltam 2 dias (' + quando + ')' };
    return { nivel: 'ok', texto: 'Propostas até ' + quando };
  }

  function openPregaoForm(id) {
    const cur = id ? store.get().pregoes.find((p) => p.id === id && !p.deleted) : null;
    const v = pregaoValues(cur || { status: 'Falta dados', viagens: 1 });
    v._noFocus = false;
    const body = `
      <div class="formgrid">
        ${field({ label: 'Nº do pregão *', name: 'numero', value: v.numero, ph: 'ex.: 90001/2026' })}
        ${field({ label: 'Status', name: 'status', type: 'select', value: v.status, options: C.STATUS.map((s) => ({ v: s, l: s })), hint: 'Falta dados = ainda preenchendo para ver se vale a pena.' })}
        ${field({ label: 'Órgão / entidade *', name: 'orgao', value: v.orgao, full: true, ph: 'ex.: Universidade de Londrina' })}
        ${field({ label: 'Local do pregão (cidade/UF)', name: 'cidadeUf', value: v.cidadeUf, full: true, ph: 'Londrina/PR', hint: 'Ao preencher, o trajeto de ida e volta a partir do endereço da sua empresa é calculado sozinho.' })}
        ${field({ label: 'Link do edital', name: 'link', type: 'url', value: v.link, full: true, ph: 'https://…' })}
        ${field({ label: 'Data e hora final para envio das propostas', name: 'prazoPropostas', type: 'datetime-local', value: v.prazoPropostas, hint: 'Na lista, o cartão fica amarelo faltando 2 dias e vermelho faltando 1 dia.' })}
        ${field({ label: 'Data e hora da sessão', name: 'sessao', type: 'datetime-local', value: v.sessao })}
        ${field({ label: 'Prazo de entrega (dias)', name: 'prazoEntregaDias', value: v.prazoEntregaDias, inputmode: 'numeric' })}
        ${field({ label: 'Exigências (IE, certidões)', name: 'exigencias', type: 'textarea', value: v.exigencias, full: true, ph: 'SICAF, CND estadual…' })}
      </div>
      <div class="sect">${icon('pin', 'sm')} Entrega de carro</div>
      <div class="formgrid">
        <div class="full"><label class="switch"><span>Vou entregar aos poucos: calcular cada ida separadamente<small class="hint" style="display:block;font-weight:500">Marque quando cada entrega tiver destino ou custo próprio (ex.: 1ª ida para uma cidade, 2ª para outra). Se for tudo no local do pregão, deixe desmarcado.</small></span><input type="checkbox" name="entregaDiferente"${v.entregaDiferente ? ' checked' : ''}></label></div>

        async function calcLinha(row, forcar) {

          <span>Posso baixar do teto <b>${c.folgaRs != null ? C.brl(c.folgaRs) + ' (' + C.pct(c.folgaPct, 0) + ')' : '—'}</b></span>
          ${c.impostoTotal > 0 ? `<span>Impostos <b>${C.brl(c.impostoTotal)}</b></span>` : ''}</div>
          ${c.situacao ? `<div><span class="badge ${c.sitTipo}">${esc(c.situacao)}</span> <span class="tiny muted">Lucro previsto ${C.brl(c.lucro)}</span></div>` : ''}`;
      },
      onSave: (x, form) => {
        $$('.input.err', form).forEach((e) => e.classList.remove('err'));
        const it = itemFromForm(x, id);
        const miss = [];
        if (!it.pregaoId) miss.push('pregaoId');
        if (!it.descricao) miss.push('descricao');
        if (!(it.qtd > 0)) miss.push('qtd');
        if (it.custo == null || it.custo < 0) miss.push('custo');
        if (miss.length) { miss.forEach((n) => $('[name=' + n + ']', form).classList.add('err')); return 'Preencha pregão, item, quantidade e custo.'; }
        if (it.margem != null && it.margem >= 1) { $('[name=margem]', form).classList.add('err'); return 'A margem precisa ser menor que 100%.'; }
        const data = Object.assign({}, it); delete data.id;
        if (id) data.id = id;
        store.upsertItem(data);
        toast(id ? 'Item atualizado' : 'Item adicionado');
        return true;
      },
      onDelete: id ? async () => {
        const ok = await confirmar('Excluir este item?', cur ? cur.descricao : '', 'Excluir', true);
        if (ok) { store.removeItem(id); toast('Item excluído'); }
        return ok;
      } : null,
    });
  }

  /* ---------- telas ---------- */
  // cada pregão tem uma cor fixa (pela ordem de cadastro) para não confundir itens de pregões diferentes
  const PALETA = ['#2e75b6', '#2f8f5b', '#d9822b', '#8e44ad', '#c0392b', '#16a2b8', '#b7791f', '#5c6bc0', '#d6457a', '#6d8b2f'];
  function corDe(id) {
    const ordem = store.get().pregoes.filter((p) => !p.deleted).sort((a, b) => ((a.createdAt || 0) - (b.createdAt || 0)) || String(a.id).localeCompare(String(b.id)));
    const i = ordem.findIndex((p) => p.id === id);
    return PALETA[(i < 0 ? 0 : i) % PALETA.length];
  }
  const badgeStatus = (s) => `<span class="badge st-${slugClass(s)}">${esc(s)}</span>`;

  function draftDesc(key) {
    const [kind, id] = key.split(':');
    const st = store.get();
    if (kind === 'pregao') { const p = st.pregoes.find((x) => x.id === id); return id === 'novo' ? 'Novo pregão' : 'Pregão ' + (p ? '#' + p.numero : ''); }
    if (kind === 'item') { const i = st.itens.find((x) => x.id === id); return id === 'novo' ? 'Novo item' : 'Item ' + (i ? i.descricao : ''); }
    return key;
  }
  function openDraft(key) {
    const [kind, id] = key.split(':');
    if (kind === 'pregao') openPregaoForm(id === 'novo' ? null : id);
    else if (kind === 'item') openItemForm(id === 'novo' ? null : id);
  }

  function emptyWelcome() {
    return `<div class="page"><div class="card empty">${icon('pregoes')}<h2>Bem-vindo ao Pregões MEI</h2>
      <p class="muted">Cadastre um pregão, adicione os itens que vai vender e veja na hora o <b>valor mínimo</b> da proposta e quanto falta para o teto do MEI.</p>
      <button class="btn primary block" data-act="novo-pregao">${icon('plus')} Cadastrar primeiro pregão</button>
      <button class="btn ghost block" data-act="demo">Ver com dados de exemplo</button></div></div>`;
  }

  function renderPainel() {
    const st = store.get();
    if (!st.pregoes.some((p) => !p.deleted)) return emptyWelcome();
    const R = C.computeAll(st), m = R.mei;
    const drafts = Draft.all();
    const f = m.faturado, a = m.aFaturar, d = m.emDisputa, livre = Math.max(0, m.limite - (f + a + d));
    const scale = Math.max(m.limite, f + a + d) || 1;
    const w = (x) => (Math.max(0, x) / scale * 100).toFixed(2) + '%';
    const alertTxt = m.alerta === 'bad' ? 'ATENÇÃO: o que já está faturado + ganho passa do limite do MEI.'
      : m.alerta === 'warn' ? 'Cuidado: se você ganhar tudo o que está em disputa, passa do limite do MEI.' : 'Dentro do limite do MEI.';
    const meter = (p) => `<div class="meter ${p >= 1 ? 'red' : ''}"><div style="width:${Math.min(100, p * 100).toFixed(1)}%"></div></div>`;
    const maxV = Math.max(1, ...R.statusRows.map((r) => r.venda));
    const comp = R.comp, tot = comp.venda || 1;
    const segs = [['Custo dos produtos', comp.produtos, '#5b6b82'], ['Frete do fornecedor', comp.frete, '#e8a76b'], ['Entrega de carro', comp.entrega, '#f2cf5b'], ['Impostos', comp.impostos, '#8e6bbf'], ['Lucro', comp.lucro, '#4caf66']];
    const CIRC = 2 * Math.PI * 54;
    let acc = 0;
    const arcs = segs.map(([, v, col]) => {
      const len = Math.max(0, v) / tot * CIRC;
      const s = `<circle cx="80" cy="80" r="54" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(CIRC - len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 80 80)"/>`;
      acc += len; return s;
    }).join('');
    const margemTot = comp.venda > 0 ? comp.lucro / comp.venda : null;
    const prox = R.proximas.slice(0, 4);

    return `<div class="page">
      ${drafts.length ? `<div class="alert warn">${icon('alert', 'sm')}<div class="grow">Você tem preenchimento não salvo: ${esc(drafts.slice(0, 2).map((x) => draftDesc(x.key)).join(', '))}.</div><button class="btn sm" data-act="rascunho" data-key="${esc(drafts[0].key)}">Continuar</button></div>` : ''}
      <div class="kpis">
        <div class="kpi" style="--c:#1f3864"><div class="l">Limite do MEI</div><div class="v" style="color:var(--ink)">${C.brl0(m.limite)}</div><div class="s">no ano de ${st.config.anoRef}</div></div>
        <div class="kpi" style="--c:#2e75b6"><div class="l">Comprometido</div><div class="v">${C.brl0(m.comprometido)}</div><div class="s">faturado + ganho · ${C.pct(m.pctComprometido, 0)}</div></div>
        <div class="kpi" style="--c:${m.saldoAgora < 0 ? '#c0392b' : '#2f7d3a'}"><div class="l">Saldo disponível</div><div class="v">${C.brl0(m.saldoAgora)}</div><div class="s">se ganhar tudo: ${C.brl0(m.saldoSeGanhar)}</div></div>
        <div class="kpi" style="--c:#b7791f"><div class="l">Lucro previsto</div><div class="v">${C.brl0(R.lucroPrevisto)}</div><div class="s">pregões ativos</div></div>
      </div>
      ${prox.length ? `<div class="card"><h3>${icon('calendar', 'sm')} Próximas sessões</h3>${prox.map((x) => `<div class="strow" data-act="abrir-pregao" data-id="${x.p.id}" style="cursor:pointer"><div><b>${esc(x.p.orgao)}</b><div class="tiny muted">#${esc(x.p.numero)} · ${esc(C.fmtSessao(x.p.sessao))}</div></div>${badgeStatus(x.p.status)}</div>`).join('')}</div>` : ''}
      <div class="card"><h3>Uso do limite do MEI</h3>
        <div class="stack" role="img" aria-label="Uso do limite">
          <div class="seg" style="width:${w(f)};background:#1f3864"></div><div class="seg" style="width:${w(a)};background:#2e75b6"></div>
          <div class="seg" style="width:${w(d)};background:#f4b183"></div><div class="seg" style="width:${w(livre)};background:#a9d18e"></div>
          ${scale > m.limite ? `<div class="mark" style="left:${(m.limite / scale * 100).toFixed(2)}%"></div>` : ''}
        </div>
        <div class="legend"><span><i style="background:#1f3864"></i>Faturado ${C.brl0(f)}</span><span><i style="background:#2e75b6"></i>A faturar ${C.brl0(a)}</span><span><i style="background:#f4b183"></i>Em disputa ${C.brl0(d)}</span><span><i style="background:#a9d18e"></i>Livre ${C.brl0(livre)}</span></div>
        <div style="margin-top:14px" class="row between small"><b>Comprometido</b><span>${C.pct(m.pctComprometido, 0)}</span></div>${meter(m.pctComprometido)}
        <div style="margin-top:10px" class="row between small"><b>Se ganhar tudo em disputa</b><span>${C.pct(m.pctComTudo, 0)}</span></div>${meter(m.pctComTudo)}
        <div class="alert ${m.alerta}" style="margin-top:14px">${icon(m.alerta === 'ok' ? 'check' : 'alert', 'sm')}<span>${alertTxt}</span></div>
        <p class="tiny muted" style="margin-top:10px">O total de cada pregão usa o lance final; sem lance, usa o valor do edital (pior caso para o teto).</p>
      </div>
      <div class="card"><h3>Tributos do MEI</h3><div class="kv-list">
        <div><span>DAS mensal</span><b>${C.brl(R.tributos.das)} <span class="tiny muted" style="font-weight:500">fixo, não muda com as vendas</span></b></div>
        <div><span>DAS no ano (${R.tributos.meses} meses)</span><b>${C.brl(R.tributos.dasAno)}</b></div>
        <div><span>Imposto sobre vendas</span><b>${C.brl(R.tributos.impostoVenda)}${st.config.impostoPct > 0 ? ' (' + C.pct(st.config.impostoPct, 1) + ')' : ''}</b></div>
        <div><span>Imposto na compra</span><b>${C.brl(R.tributos.impostoCompra)}</b></div>
        <div><span>Lucro depois do DAS</span><b style="color:${R.tributos.lucroLiquido < 0 ? 'var(--red)' : 'var(--green)'}">${C.brl(R.tributos.lucroLiquido)}</b></div></div>
        <p class="tiny muted" style="margin-top:10px">Lucro previsto dos pregões ativos menos o DAS do ano. MEI não paga percentual sobre a venda (dentro do limite). Optante do Simples/MEI em geral não sofre retenção de IR, PIS, Cofins e CSLL do órgão público: se o órgão pedir, apresente a declaração do Anexo IV da IN RFB 1.234/2012. Ajuste em Config › Tributos.</p></div>
      <div class="two-col">
        <div class="card"><h3>Pregões por status</h3>${R.statusRows.map((r) => `<div class="strow"><div class="row">${badgeStatus(r.status)}<span class="small muted">${r.count} pregão(ões)</span></div><b>${C.brl0(r.venda)}</b><div class="bar"><div style="width:${(r.venda / maxV * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>
        <div class="card"><h3>De onde vem o preço de venda</h3><div class="donut-wrap">
          <svg viewBox="0 0 160 160" role="img" aria-label="Composição do preço"><circle cx="80" cy="80" r="54" fill="none" stroke="var(--line)" stroke-width="22"/>${comp.venda > 0 ? arcs : ''}
            <text x="80" y="76" text-anchor="middle" font-size="22" font-weight="800" fill="currentColor">${margemTot == null ? '—' : C.pct(margemTot, 0)}</text><text x="80" y="95" text-anchor="middle" font-size="11" fill="var(--muted)">de lucro</text></svg>
          <div class="donut-leg">${segs.map(([l, v, col]) => `<div><i style="background:${col}"></i>${l}<b>${C.brl0(v)}</b></div>`).join('')}</div></div>
          <p class="tiny muted" style="margin-top:10px">Pregões ativos (exclui Perdeu, Desclassificado e Desisti).</p></div>
      </div></div>`;
  }

  function pregaoCard(pst) {
    const p = pst.p;
    const chips = pst.itens.slice(0, 3).map((i) => `<span class="chip">${esc(i.descricao)}</span>`).join('') + (pst.itens.length > 3 ? `<span class="chip">+${pst.itens.length - 3}</span>` : '');
    const pz = prazoInfo(p);
    const pzCls = pz && (pz.nivel === 'warn' || pz.nivel === 'bad') ? ' prz-' + pz.nivel : '';
    return `<article class="pcard${pzCls}" style="--gc:${corDe(p.id)}" data-act="abrir-pregao" data-id="${p.id}" tabindex="0" role="button">
      <div class="row between"><span class="num" style="color:var(--gc)">PREGÃO Nº ${esc(p.numero)}</span>${badgeStatus(p.status)}</div>
      <h4>${esc(p.orgao)}</h4>
      <div class="small muted row wrap" style="gap:4px 14px">${p.cidadeUf ? `<span class="row" style="gap:4px">${icon('pin', 'sm')}${esc(p.cidadeUf)}</span>` : ''}${p.sessao ? `<span class="row" style="gap:4px">${icon('calendar', 'sm')}${esc(C.fmtSessao(p.sessao))}</span>` : ''}</div>
      ${pz ? `<div><span class="prazo ${pz.nivel}">${icon(pz.nivel === 'ok' ? 'calendar' : 'alert', 'sm')}${esc(pz.texto)}</span></div>` : ''}
      <div class="chips">${chips || '<span class="chip">Sem itens ainda</span>'}</div>
      <div class="nums"><div>Venda<b>${C.brl0(pst.venda)}</b></div><div>Lucro<b>${C.brl0(pst.lucro)}</b></div><div>Margem<b>${C.pct(pst.margem, 0)}</b></div></div></article>`;
  }

  function pregoesListHtml() {
    const R = C.computeAll(store.get());
    let list = [...R.pMap.values()];
    if (UI.filtro !== 'todos') list = list.filter((x) => x.p.status === UI.filtro);
    const q = UI.busca.trim().toLowerCase();
    if (q) list = list.filter((x) => (x.p.numero + ' ' + x.p.orgao + ' ' + (x.p.cidadeUf || '') + ' ' + x.itens.map((i) => i.descricao).join(' ')).toLowerCase().includes(q));
    list.sort((a, b) => (b.p.createdAt || 0) - (a.p.createdAt || 0));
    if (!list.length) return `<div class="card empty"><p class="muted">Nenhum pregão encontrado.</p></div>`;
    return `<div class="list">${list.map(pregaoCard).join('')}</div>`;
  }

  function renderPregoes() {
    if (UI.detailId) return renderDetail();
    const st = store.get();
    if (!st.pregoes.some((p) => !p.deleted)) return emptyWelcome();
    const fl = ['todos', ...C.STATUS];
    return `<div class="page">
      <div class="search">${icon('search')}<input class="input" id="busca" type="search" placeholder="Buscar por número, órgão ou item" value="${esc(UI.busca)}"></div>
      <div class="filters">${fl.map((s) => `<button data-act="filtro" data-v="${esc(s)}" class="${UI.filtro === s ? 'on' : ''}">${s === 'todos' ? 'Todos' : esc(s)}</button>`).join('')}</div>
      <div id="plist">${pregoesListHtml()}</div></div>
      <button class="fab" data-act="novo-pregao" aria-label="Novo pregão">${icon('plus')}</button>`;
  }

  function itemCard(it, c, opt) {
    const p = opt.pst && opt.pst.p;
    return `<article class="icard" data-act="editar-item" data-id="${it.id}" tabindex="0" role="button">
      <div class="row between" style="align-items:flex-start"><h4 class="grow">${esc(it.descricao)}</h4>${c.situacao ? `<span class="badge ${c.sitTipo}">${esc(c.situacao)}</span>` : ''}</div>
      ${opt.showOrg && p ? `<div class="chips"><span class="chip org">#${esc(p.numero)} · ${esc(p.orgao)}</span></div>` : ''}
      <div class="small muted">${C.qtdBR(it.qtd)} ${esc(it.unidade || 'Un')} · custo ${C.brl(it.custo)} · teto ${C.brl(c.teto)}${it.marca ? ' · ' + esc(it.marca) : ''}</div>
      <div class="minbox ${c.sitTipo === 'bad' ? 'bad' : ''}"><div><div class="t">Valor mínimo p/ proposta (unit.)</div><div class="tiny muted">margem ${C.pct(c.margem, 0)} · custo final ${C.brl(c.custoUnit)}</div></div><div class="v">${C.brl(c.minimo)}</div></div>
      <div class="row between wrap small muted" style="gap:4px 10px"><span>Posso baixar do teto: <b style="color:var(--ink)">${c.folgaRs != null ? C.brl(c.folgaRs) + ' (' + C.pct(c.folgaPct, 0) + ')' : '—'}</b></span><span>${c.impostoTotal > 0 ? 'Impostos ' + C.brl(c.impostoTotal) + ' · ' : ''}Lucro: <b style="color:var(--ink)">${C.brl(c.lucro)}</b></span></div></article>`;
  }

  function renderDetail() {
    const R = C.computeAll(store.get());
    const pst = R.pMap.get(UI.detailId);
    if (!pst) { UI.detailId = null; return renderPregoes(); }
    const p = pst.p;
    const kv = (k, v) => v ? `<div><span>${k}</span><b>${v}</b></div>` : '';
    return `<div class="page">
      <button class="back" data-act="voltar">${icon('back')} Pregões</button>
      <div class="hero"><span class="num">PREGÃO Nº ${esc(p.numero)}</span><h2>${esc(p.orgao)}</h2>
        <div class="m">${p.cidadeUf ? `<span>${esc(p.cidadeUf)}</span>` : ''}${p.sessao ? `<span>Sessão ${esc(C.fmtSessao(p.sessao))}</span>` : ''}</div></div>
      <div class="card"><div class="field" style="margin:0"><label for="stsel">Status do pregão</label>
        <select class="input" id="stsel" data-status-pregao="${p.id}">${C.STATUS.map((s) => `<option${s === p.status ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></div></div>
      <div class="kpis">
        <div class="kpi"><div class="l">Total de venda</div><div class="v">${C.brl0(pst.venda)}</div></div>
        <div class="kpi" style="--c:#667489"><div class="l">Custo total</div><div class="v" style="color:var(--ink)">${C.brl0(pst.custo)}</div><div class="s">entrega ${C.brl0(pst.viagem)}${pst.imposto > 0 ? ' · impostos ' + C.brl0(pst.imposto) : ''}</div></div>
        <div class="kpi" style="--c:#2f7d3a"><div class="l">Lucro</div><div class="v">${C.brl0(pst.lucro)}</div></div>
        <div class="kpi" style="--c:#b7791f"><div class="l">Margem real</div><div class="v">${C.pct(pst.margem, 1)}</div></div>
      </div>
      <div class="card"><h3><span class="grow">Itens deste pregão (${pst.nItens})</span><button class="btn sm primary" data-act="novo-item" data-pid="${p.id}">${icon('plus', 'sm')} Item</button></h3>
        ${pst.itens.length ? `<div class="list">${pst.itens.map((it) => itemCard(it, R.iMap.get(it.id), { pst, showOrg: false })).join('')}</div>` : `<p class="muted small">Nenhum item ainda. Toque em “Item” para adicionar o primeiro.</p>`}</div>
      <div class="card"><h3>Dados do pregão</h3><div class="kv-list">
        ${(() => { const z = prazoInfo(p); return z ? kv('Envio das propostas', `<span class="prazo ${z.nivel}">${esc(z.texto)}</span>`) : ''; })()}${kv('Local de entrega', esc(C.localEntregaPadrao(p)))}${kv('Intervalo mín. lances', esc(p.intervaloMin))}${kv('Prazo de entrega', p.prazoEntregaDias ? esc(p.prazoEntregaDias) + ' dias' : '')}${kv('Exigências', esc(p.exigencias))}
        ${pst.ents ? kv('Entregas', pst.ents.map((x, i) => `${i + 1}. ${esc(x.local)} · ${C.numBR(x.e.km || 0, 1)} km · ${x.e.viagens || 0} viagem(ns)${x.e.pedagio ? ' · pedágio ' + C.brl(x.e.pedagio) : ''} = <b>${C.brl(x.custo)}</b> · ${x.nItens} ${x.nItens === 1 ? 'item' : 'itens'}`).join('<br>') + (pst.ents.length > 1 ? `<br>Total: ${C.brl(pst.viagem)}` : '')) : ''}
        ${pst.grupos && pst.grupos.length ? kv('Itens com local próprio', pst.grupos.map((g) => `${esc(g.local)} · ${C.numBR(g.e.km || 0, 1)} km · ${g.e.viagens == null ? 1 : g.e.viagens} viagem(ns)${g.e.pedagio ? ' · pedágio ' + C.brl(g.e.pedagio) : ''} = <b>${C.brl(g.custo)}</b> · ${g.nItens} ${g.nItens === 1 ? 'item' : 'itens'}`).join('<br>')) : ''}
        ${!pst.ents ? kv('Entrega de carro', p.km ? `${C.numBR(p.km, 1)} km (ida e volta) · ${p.viagens || 0} viagem(ns)${p.pedagio ? ' · pedágio ' + C.brl(p.pedagio) : ''} = ${C.brl(pst.viagem)}` : '') : ''}
        ${kv('Link do edital', p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.link)}</a>` : '')}${kv('Observações', esc(p.obs))}</div></div>
      <div class="grid2"><button class="btn" data-act="editar-pregao" data-id="${p.id}">${icon('edit', 'sm')} Editar dados</button>
        <button class="btn navy" data-act="pdf-pregao" data-id="${p.id}">${icon('pdf', 'sm')} Proposta PDF</button></div></div>`;
  }

  function itensListHtml() {
    const R = C.computeAll(store.get());
    const q = UI.buscaI.trim().toLowerCase();
    const groups = [...R.pMap.values()].sort((a, b) => (b.p.createdAt || 0) - (a.p.createdAt || 0));
    let html = '', n = 0;
    for (const g of groups) {
      const its = g.itens.filter((i) => !q || (i.descricao + ' ' + (i.marca || '') + ' ' + (i.onde || '') + ' ' + g.p.orgao + ' ' + g.p.numero).toLowerCase().includes(q));
      if (!its.length) continue;
      n += its.length;
      html += `<section class="gbox" style="--gc:${corDe(g.p.id)}">
        <header class="ghead"><div class="grow"><div class="gnum">PREGÃO Nº ${esc(g.p.numero)}</div><h3>${esc(g.p.orgao)}</h3></div>${badgeStatus(g.p.status)}</header>
        <div class="gmeta">${g.itens.length} ${g.itens.length === 1 ? 'item' : 'itens'}${its.length !== g.itens.length ? ' (' + its.length + ' na busca)' : ''} · venda <b>${C.brl0(g.venda)}</b> · lucro <b>${C.brl0(g.lucro)}</b></div>
        <div class="list">${its.map((it) => itemCard(it, R.iMap.get(it.id), { pst: g, showOrg: false })).join('')}</div></section>`;
    }

  /* ---------- tela PDF ---------- */
  const FONTES = [['auto', 'Lance final; sem lance, valor mínimo'], ['minimo', 'Sempre o valor mínimo (custo + margem)'], ['teto', 'Valor do edital (teto)'], ['lance', 'Só o lance final']];
  function hdPreviewHtml(h, emp) {

  }
  const wmTexto = (w) => (w.tipo === 'texto' ? esc(w.texto || '') : '');
  const wmPrevSize = (w) => Math.max(12, Math.min(w.tamanho / 2, 300 / Math.max(6, String(w.texto || '').length) * 1.4));



  /* ---------- Proposta: modelo e "chavinhas" do que aparece (valem para o pregão escolhido) ---------- */
  const optGet = (o, path) => path.split('.').reduce((a, k) => (a === undefined || a === null ? a : a[k]), o);
  const swp = (o, path, label, hint) => `<label class="switch"><span>${label}${hint ? `<small class="hint" style="display:block;font-weight:500">${hint}</small>` : ''}</span><input type="checkbox" data-pdf="${path}" data-type="check" ${optGet(o, path) ? 'checked' : ''}></label>`;
  const fp = (o, path, label, x) => {
    x = x || {}; const v = optGet(o, path);
    const val = x.type === 'pct' ? (v ? C.numBR(v * 100, 2) : '') : (v === undefined || v === null ? '' : v);
    const ctl = x.area
      ? `<textarea class="input" rows="${x.rows || 3}" data-pdf="${path}" data-type="text"${x.ph ? ` placeholder="${esc(x.ph)}"` : ''}>${esc(val)}</textarea>`
      : `<input class="input" data-pdf="${path}" data-type="${x.type || 'text'}" value="${esc(val)}"${x.im ? ` inputmode="${x.im}"` : ''}${x.ph ? ` placeholder="${esc(x.ph)}"` : ''}>`;
    return `<div class="field${x.full ? ' full' : ''}"><label>${label}</label>${ctl}${x.hint ? `<div class="hint">${x.hint}</div>` : ''}</div>`;
  };
  const acc = (id, titulo, corpo) => `<details class="acc" data-acc="${id}"${UI.acc.has(id) ? ' open' : ''}><summary>${titulo}</summary><div class="acc-body">${corpo}</div></details>`;


  // dados da empresa que o modelo escolhido vai usar e que ainda estão vazios (para não sair campo em branco sem você perceber)
  function faltasEmpresa(o, emp) {
    const val = { fornecedor: emp.nome, cnpj: emp.cnpj || emp.cpf, endereco: emp.endereco, bairro: emp.bairro, cep: emp.cep, cidade: emp.cidade, uf: emp.uf, telefone: emp.telefone, email: emp.email, banco: emp.banco, agencia: emp.agencia, conta: emp.conta, pix: emp.pix };
    const nomes = { fornecedor: 'Nome', cnpj: 'CNPJ', endereco: 'Endereço', bairro: 'Bairro', cep: 'CEP', cidade: 'Cidade', uf: 'UF', telefone: 'Telefone', email: 'E-mail', banco: 'Banco', agencia: 'Agência', conta: 'Conta', pix: 'PIX' };
    const desc = o.modelo === 'descritivo';
    const quer = { fornecedor: true, cnpj: true };                       // nome e CNPJ sempre servem (cabeçalho, assinatura)
    if (desc ? o.desc.fornecedor : o.com.fornecedor) Object.keys(o.desc.campos).forEach((k) => { if (o.desc.campos[k]) quer[k] = true; });
    if (!desc && o.com.bancarios) { quer.banco = true; quer.agencia = true; quer.conta = true; }
    if (!desc && o.com.fornecedor && o.com.bancarios) { delete quer.pix; }
    return Object.keys(nomes).filter((k) => quer[k] && !String(val[k] || '').trim()).map((k) => nomes[k]);
  }
  function faltaEmpresaHtml(o, emp) {
    const f = faltasEmpresa(o, emp);

    return `<div class="alert warn">${icon('alert', 'sm')}<div class="grow">Faltam dados da empresa que este modelo usa: <b>${esc(f.join(', '))}</b>. Sem eles, os campos saem em branco no PDF.</div><button class="btn sm" data-act="tab" data-v="config">Preencher</button></div>`;
  }

         ${swp(o, 'desc.faixa', 'Faixa com o número do edital')}${fp(o, 'desc.faixaTexto', 'Texto da faixa', { hint: '{numero} vira o “Nº do pregão”' })}`),

      acc('acc-obj', 'Objeto da licitação', `${swp(o, 'desc.objeto', 'Mostrar o objeto')}${fp(o, 'desc.objetoPrefixo', 'Prefixo')}${fp(o, 'desc.objetoTexto', 'Objeto (copie do edital)', { area: true, rows: 4, ph: 'aquisição de …' })}`),

  function readCfgValue(el) {
    const t = el.dataset.type;
    if (t === 'check') return el.checked;
    if (t === 'range') return Number(el.value);
    if (t === 'pctrange') return Number(el.value) / 100;

  // reduz a imagem, CORTA as margens vazias (transparentes ou brancas) e reencolhe até caber no orçamento da nuvem
  const ORCAMENTO_IMG = 450000; // caracteres do data URL por imagem (2 imagens + folga < 1 MB do documento)
  function downscaleImage(file, max) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const png = file.type === 'image/png';
        const s0 = Math.min(1, max / Math.max(img.width, img.height));
        let cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * s0)); cv.height = Math.max(1, Math.round(img.height * s0));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        try {
          const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, d = ctx.getImageData(0, 0, W, H).data;
          const vazio = (i) => (png ? d[i + 3] < 12 : (d[i + 3] < 12 || (d[i] > 244 && d[i + 1] > 244 && d[i + 2] > 244)));
          let x0 = W, y0 = H, x1 = -1, y1 = -1;
          for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!vazio((y * W + x) * 4)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
          if (x1 >= x0 && y1 >= y0 && ((x1 - x0 + 1) < W - 2 || (y1 - y0 + 1) < H - 2)) {
            const pad = 2; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
            const c2 = document.createElement('canvas'); c2.width = x1 - x0 + 1; c2.height = y1 - y0 + 1;
            c2.getContext('2d').drawImage(cv, x0, y0, c2.width, c2.height, 0, 0, c2.width, c2.height);
            cv = c2;
          }
        } catch (e) { /* sem corte: segue com a imagem inteira */ }
        const codifica = () => (png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.85));
        let out = codifica();
        // grande demais para a nuvem: reduz 20% por vez (mínimo de 200 px no maior lado)
        while (out.length > ORCAMENTO_IMG && Math.max(cv.width, cv.height) > 200) {
          const c3 = document.createElement('canvas'); c3.width = Math.max(1, Math.round(cv.width * 0.8)); c3.height = Math.max(1, Math.round(cv.height * 0.8));
          c3.getContext('2d').drawImage(cv, 0, 0, c3.width, c3.height); cv = c3; out = codifica();
        }
        if (out.length > ORCAMENTO_IMG) reject(new Error('Imagem pesada demais. Use uma mais simples.')); else resolve(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Imagem inválida')); };
      img.src = url;
    });
  }

  /* ---------- sincronização das imagens (papel timbrado e marca d'água) ---------- */
  const IMG_CHAVES = [['cab', 'cabecalho'], ['marca', 'marcaDagua']];
  function imgLocal() { const c = store.get().config; return { cab: { img: c.cabecalho.imagem || null, em: c.cabecalho.imagemEm || 0 }, marca: { img: c.marcaDagua.imagem || null, em: c.marcaDagua.imagemEm || 0 } }; }
  function imgRemoto(r) { return { cab: { img: (r && r.cab) || null, em: (r && r.cabEm) || 0 }, marca: { img: (r && r.marca) || null, em: (r && r.marcaEm) || 0 } }; }
  function aplicarImagensRemotas(R) {
    const L = imgLocal(); let mudou = false;
    for (const [k, path] of IMG_CHAVES) if (R[k].em > L[k].em) { store.setImagem(path, R[k].img, R[k].em); mudou = true; }
    return mudou;
  }
  async function sincronizarImagens() {
    const cs = window.CloudSync, u = Cloud.user;
    if (!cs || !u || !navigator.onLine || Cloud.imgBusy) return;
    Cloud.imgBusy = true;
    try {
      // imagens de antes desta função (sem data) valem "agora" na primeira vez: não são sobrescritas pela nuvem
      for (const [, path] of IMG_CHAVES) { const c = store.get().config[path]; if (c.imagem && !c.imagemEm) store.setImagem(path, c.imagem, Date.now()); }
      const aplicar = await cs.mesclarImagens(u.uid, (remoto) => {
        const L = imgLocal(), R = imgRemoto(remoto);
        const dados = { cab: R.cab.img, cabEm: R.cab.em, marca: R.marca.img, marcaEm: R.marca.em };
        let gravar = false;
        for (const k of ['cab', 'marca']) if (L[k].em > R[k].em) { dados[k] = L[k].img; dados[k + 'Em'] = L[k].em; gravar = true; }
        if (JSON.stringify(dados).length > 960000) throw new Error('As imagens passaram do limite da nuvem. Troque por imagens menores.');
        return { gravar, dados, resultado: R };
      });
      if (aplicarImagensRemotas(aplicar)) { UI.keepScroll = true; if (UI.tab === 'pdf') render(); }
    } catch (e) { console.warn('[imagens]', e); if (e && /limite/.test(e.message || '')) toast(e.message); }
    finally { Cloud.imgBusy = false; }
  }
  // chamado quando você troca ou remove uma imagem: carimba a data e envia
  function imagemMudou(path) {
    store.setConfigPath(path + '.imagemEm', Date.now(), { silent: true });
    sincronizarImagens();
  }
